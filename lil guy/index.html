<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- THREE.JS IMPORT MAP -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    #scene {

      width: 100%;
      height: 100%;

    }


    canvas {

      display: block;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <div id="scene"></div>


  <script type="module">


    import * as THREE from "three";


    import {
      GLTFLoader
    } from "three/addons/loaders/GLTFLoader.js";


    /* ------------------------- */
    /* SCENE                     */
    /* ------------------------- */


    const container =
      document.getElementById("scene");


    const scene =
      new THREE.Scene();


    /* ------------------------- */
    /* CAMERA                    */
    /* ------------------------- */


    const camera =
      new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

      );


    /* ------------------------- */
    /* RENDERER                  */
    /* ------------------------- */


    const renderer =
      new THREE.WebGLRenderer({

        alpha: true,

        antialias: true

      });


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio,

        2

      )

    );


    /*
      TRANSPARENT BACKGROUND
    */


    renderer.setClearColor(

      0x000000,

      0

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    /*
      NO CINEMATIC TONEMAPPING

      Keeps the colour response
      cleaner and closer to the
      Illustrator reference.
    */


    renderer.toneMapping =
      THREE.NoToneMapping;


    renderer.toneMappingExposure =
      1.0;


    container.appendChild(
      renderer.domElement
    );


    /* ------------------------- */
    /* LIGHTING                  */
    /* ------------------------- */


    /*
      BASE AMBIENT LIGHT

      Keeps Oko visible while
      still allowing the recessed
      and underside areas to
      become properly dark.
    */


    const ambientLight =
      new THREE.AmbientLight(

        0xffd8c5,

        0.22

      );


    scene.add(
      ambientLight
    );


    /*
      MAIN SOFTBOX LIGHT

      Upper-right/front.

      Pale and warm so the
      highlights become more
      peach / cream rather than
      bright orange.
    */


    const keyLight =
      new THREE.DirectionalLight(

        0xffeadf,

        2.4

      );


    keyLight.position.set(

      5,

      7,

      8

    );


    scene.add(
      keyLight
    );


    /*
      FRONT FILL

      Broadens the illumination
      across Oko's torso and
      prevents the whole centre
      from falling into shadow.
    */


    const frontFill =
      new THREE.DirectionalLight(

        0xffb07c,

        0.55

      );


    frontFill.position.set(

      0,

      3,

      6

    );


    scene.add(
      frontFill
    );


    /*
      WARM SHADOW-SIDE BOUNCE

      Extremely subtle.

      Stops the dark areas from
      becoming completely black
      while keeping them warm
      brown like the reference.
    */


    const warmBounce =
      new THREE.DirectionalLight(

        0x7a2d20,

        0.12

      );


    warmBounce.position.set(

      -5,

      1,

      4

    );


    scene.add(
      warmBounce
    );


    /* ------------------------- */
    /* LOAD OKO                  */
    /* ------------------------- */


    const loader =
      new GLTFLoader();


    let oko;


    loader.load(

      "./OKO.glb",


      (gltf) => {


        console.log(
          "OKO LOADED"
        );


        oko =
          gltf.scene;


        /*
          PREPARE MODEL
        */


        oko.traverse(

          (object) => {


            if (
              object.isMesh
            ) {


              object.frustumCulled =
                false;


            }


          }

        );


        /*
          FIND MODEL BOUNDS
        */


        const box =
          new THREE.Box3()
          .setFromObject(
            oko
          );


        const size =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        /*
          CENTRE OKO
        */


        oko.position.sub(
          center
        );


        scene.add(
          oko
        );


        /*
          FIT CAMERA TO MODEL
        */


        const maxSize =
          Math.max(

            size.x,

            size.y,

            size.z

          );


        const fov =
          camera.fov *
          (
            Math.PI /
            180
          );


        let distance =
          (
            maxSize /
            2
          ) /
          Math.tan(
            fov /
            2
          );


        /*
          LEAVE SOME SPACE
          AROUND OKO
        */


        distance *=
          1.35;


        camera.position.set(

          0,

          0,

          distance

        );


        camera.lookAt(

          0,

          0,

          0

        );


        camera.near =
          Math.max(

            0.01,

            distance /
            100

          );


        camera.far =
          distance *
          100;


        camera.updateProjectionMatrix();


        console.log(
          "MODEL SIZE:",

          size
        );


      },


      undefined,


      (error) => {


        console.error(

          "FAILED TO LOAD OKO:",

          error

        );


      }

    );


    /* ------------------------- */
    /* RESIZE                    */
    /* ------------------------- */


    window.addEventListener(

      "resize",

      () => {


        const width =
          container.clientWidth;


        const height =
          container.clientHeight;


        camera.aspect =
          width /
          height;


        camera.updateProjectionMatrix();


        renderer.setSize(

          width,

          height

        );


      }

    );


    /* ------------------------- */
    /* RENDER LOOP               */
    /* ------------------------- */


    function animate() {


      requestAnimationFrame(
        animate
      );


      renderer.render(

        scene,

        camera

      );


    }


    animate();


  </script>


</body>

</html>
