<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oko Test</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1B1C1C;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";



// ========================================
// SCENE
// ========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x1B1C1C);



// ========================================
// CAMERA
// ========================================

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);



// ========================================
// RENDERER
// ========================================

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);



// ========================================
// LIGHTING
// ========================================

const ambientLight = new THREE.AmbientLight(
  0xffffff,
  2
);

scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

directionalLight.position.set(3, 5, 5);

scene.add(directionalLight);



// ========================================
// OKO VARIABLES
// ========================================

let oko = null;

let eyeballBone = null;
let eyeballMesh = null;

let head = null;
let body = null;

let leftEar = null;
let rightEar = null;



// ========================================
// EYE SETTINGS
// ========================================

const eyeRangeX = 0.16;
const eyeRangeY = 0.12;

const eyeOffsetY = 0.05;

const eyeBasePosition = new THREE.Vector3();

let eyeCurrentX = 0;
let eyeCurrentY = 0;

let eyeTargetX = 0;
let eyeTargetY = 0;



// ========================================
// IDLE SETTINGS
// ========================================

const idleDelay = 2500;

const idleRangeX = 0.10;
const idleRangeY = 0.07;

let isIdle = false;

let idleTimer = null;
let idleLookTimer = null;



// ========================================
// HEAD SETTINGS
// ========================================

const headBaseRotation = new THREE.Euler();

let headCurrentX = 0;
let headCurrentY = 0;
let headCurrentZ = 0;



// ========================================
// HEAD IDLE SETTINGS
// ========================================

const headIdleRangeX = 0.025;
const headIdleRangeY = 0.035;
const headIdleRangeZ = 0.045;

let headIdleTargetX = 0;
let headIdleTargetY = 0;
let headIdleTargetZ = 0;

let headIdleCurrentX = 0;
let headIdleCurrentY = 0;
let headIdleCurrentZ = 0;

let headIdleTimer = null;



// ========================================
// BODY SETTINGS
// ========================================

const bodyBaseRotation = new THREE.Euler();



// ========================================
// BODY IDLE SETTINGS
// ========================================

const bodyIdleRangeX = 0.006;
const bodyIdleRangeY = 0.010;
const bodyIdleRangeZ = 0.012;

let bodyIdleTargetX = 0;
let bodyIdleTargetY = 0;
let bodyIdleTargetZ = 0;

let bodyIdleCurrentX = 0;
let bodyIdleCurrentY = 0;
let bodyIdleCurrentZ = 0;

let bodyIdleTimer = null;



// ========================================
// EAR SETTINGS
// ========================================

// Save original Blender rotations.

const leftEarBaseRotation = new THREE.Euler();
const rightEarBaseRotation = new THREE.Euler();



// ----------------------------------------
// Normal idle ear movement
// ----------------------------------------

const earIdleRangeX = 0.035;
const earIdleRangeY = 0.025;
const earIdleRangeZ = 0.045;



// ----------------------------------------
// Current ear targets
// ----------------------------------------

let leftEarTargetX = 0;
let leftEarTargetY = 0;
let leftEarTargetZ = 0;

let rightEarTargetX = 0;
let rightEarTargetY = 0;
let rightEarTargetZ = 0;



// ----------------------------------------
// Current ear positions
// ----------------------------------------

let leftEarCurrentX = 0;
let leftEarCurrentY = 0;
let leftEarCurrentZ = 0;

let rightEarCurrentX = 0;
let rightEarCurrentY = 0;
let rightEarCurrentZ = 0;



// ----------------------------------------
// Ear timer
// ----------------------------------------

let earIdleTimer = null;



// ========================================
// CHOOSE EAR IDLE MOVEMENT
// ========================================

function chooseEarIdleMovement() {

  if (!isIdle) {
    return;
  }


  const behaviour =
    THREE.MathUtils.randInt(0, 3);



  // ======================================
  // 0 — SMALL ASYMMETRIC TWITCH
  // ======================================

  if (behaviour === 0) {

    const twitchLeft =
      Math.random() < 0.5;


    if (twitchLeft) {

      leftEarTargetX =
        THREE.MathUtils.randFloat(
          -earIdleRangeX,
          earIdleRangeX
        );

      leftEarTargetY =
        THREE.MathUtils.randFloat(
          -earIdleRangeY,
          earIdleRangeY
        );

      leftEarTargetZ =
        THREE.MathUtils.randFloat(
          -earIdleRangeZ,
          earIdleRangeZ
        );

    } else {

      rightEarTargetX =
        THREE.MathUtils.randFloat(
          -earIdleRangeX,
          earIdleRangeX
        );

      rightEarTargetY =
        THREE.MathUtils.randFloat(
          -earIdleRangeY,
          earIdleRangeY
        );

      rightEarTargetZ =
        THREE.MathUtils.randFloat(
          -earIdleRangeZ,
          earIdleRangeZ
        );

    }

  }



  // ======================================
  // 1 — BOTH EARS PERK
  // ======================================

  else if (behaviour === 1) {

    const perk =
      THREE.MathUtils.randFloat(
        0.025,
        0.055
      );


    leftEarTargetX = -perk;

    rightEarTargetX = -perk;


    leftEarTargetZ =
      THREE.MathUtils.randFloat(
        -0.015,
        0.015
      );

    rightEarTargetZ =
      THREE.MathUtils.randFloat(
        -0.015,
        0.015
      );

  }



  // ======================================
  // 2 — BOTH EARS RELAX
  // ======================================

  else if (behaviour === 2) {

    leftEarTargetX =
      THREE.MathUtils.randFloat(
        -0.015,
        0.015
      );

    rightEarTargetX =
      THREE.MathUtils.randFloat(
        -0.015,
        0.015
      );


    leftEarTargetY =
      THREE.MathUtils.randFloat(
        -0.015,
        0.015
      );

    rightEarTargetY =
      THREE.MathUtils.randFloat(
        -0.015,
        0.015
      );

  }



  // ======================================
  // 3 — ONE EAR LISTENS
  // ======================================

  else {

    const listeningLeft =
      Math.random() < 0.5;


    if (listeningLeft) {

      leftEarTargetY =
        THREE.MathUtils.randFloat(
          0.025,
          0.06
        );

      leftEarTargetZ =
        THREE.MathUtils.randFloat(
          -0.025,
          0.025
        );

    } else {

      rightEarTargetY =
        THREE.MathUtils.randFloat(
          -0.06,
          -0.025
        );

      rightEarTargetZ =
        THREE.MathUtils.randFloat(
          -0.025,
          0.025
        );

    }

  }



  // ======================================
  // NEXT EAR MOVEMENT
  // ======================================

  const delay =
    THREE.MathUtils.randFloat(
      1800,
      5000
    );


  clearTimeout(earIdleTimer);


  earIdleTimer = setTimeout(
    chooseEarIdleMovement,
    delay
  );

}



// ========================================
// START IDLE
// ========================================

function startIdle() {

  if (isIdle) {
    return;
  }


  isIdle = true;


  chooseIdleLook();

  chooseHeadIdleMovement();

  chooseBodyIdleMovement();

  chooseEarIdleMovement();

}



// ========================================
// CHOOSE IDLE EYE LOOK
// ========================================

function chooseIdleLook() {

  if (!isIdle) {
    return;
  }


  eyeTargetX =
    THREE.MathUtils.randFloat(
      -idleRangeX,
      idleRangeX
    );


  eyeTargetY =
    THREE.MathUtils.randFloat(
      -idleRangeY,
      idleRangeY
    );


  const delay =
    THREE.MathUtils.randFloat(
      1000,
      2500
    );


  clearTimeout(idleLookTimer);


  idleLookTimer = setTimeout(
    chooseIdleLook,
    delay
  );

}



// ========================================
// CHOOSE HEAD IDLE MOVEMENT
// ========================================

function chooseHeadIdleMovement() {

  if (!isIdle) {
    return;
  }


  headIdleTargetX =
    THREE.MathUtils.randFloat(
      -headIdleRangeX,
      headIdleRangeX
    );


  headIdleTargetY =
    THREE.MathUtils.randFloat(
      -headIdleRangeY,
      headIdleRangeY
    );


  headIdleTargetZ =
    THREE.MathUtils.randFloat(
      -headIdleRangeZ,
      headIdleRangeZ
    );


  const delay =
    THREE.MathUtils.randFloat(
      2500,
      5000
    );


  clearTimeout(headIdleTimer);


  headIdleTimer = setTimeout(
    chooseHeadIdleMovement,
    delay
  );

}



// ========================================
// CHOOSE BODY IDLE MOVEMENT
// ========================================

function chooseBodyIdleMovement() {

  if (!isIdle) {
    return;
  }


  bodyIdleTargetX =
    THREE.MathUtils.randFloat(
      -bodyIdleRangeX,
      bodyIdleRangeX
    );


  bodyIdleTargetY =
    THREE.MathUtils.randFloat(
      -bodyIdleRangeY,
      bodyIdleRangeY
    );


  bodyIdleTargetZ =
    THREE.MathUtils.randFloat(
      -bodyIdleRangeZ,
      bodyIdleRangeZ
    );


  const delay =
    THREE.MathUtils.randFloat(
      3500,
      7000
    );


  clearTimeout(bodyIdleTimer);


  bodyIdleTimer = setTimeout(
    chooseBodyIdleMovement,
    delay
  );

}



// ========================================
// EXIT IDLE
// ========================================

function exitIdle() {

  if (!isIdle) {
    return;
  }


  isIdle = false;


  clearTimeout(idleLookTimer);

  clearTimeout(headIdleTimer);

  clearTimeout(bodyIdleTimer);

  clearTimeout(earIdleTimer);


  headIdleTargetX = 0;
  headIdleTargetY = 0;
  headIdleTargetZ = 0;


  bodyIdleTargetX = 0;
  bodyIdleTargetY = 0;
  bodyIdleTargetZ = 0;


  leftEarTargetX = 0;
  leftEarTargetY = 0;
  leftEarTargetZ = 0;


  rightEarTargetX = 0;
  rightEarTargetY = 0;
  rightEarTargetZ = 0;

}



// ========================================
// MOUSE
// ========================================

window.addEventListener(
  "mousemove",
  (event) => {

    exitIdle();


    clearTimeout(idleTimer);


    idleTimer = setTimeout(
      startIdle,
      idleDelay
    );


    const normalizedX =
      (event.clientX - window.innerWidth / 2) /
      (window.innerWidth / 2);


    const normalizedY =
      (event.clientY - window.innerHeight / 2) /
      (window.innerHeight / 2);


    eyeTargetX =
      normalizedX * eyeRangeX;


    eyeTargetY =
      -normalizedY * eyeRangeY;

  }
);



// ========================================
// LOAD GLB
// ========================================

const loader = new GLTFLoader();

loader.load(

  "./OKO.glb",

  (gltf) => {

    oko = gltf.scene;

    scene.add(oko);


    // ------------------------------------
    // FIND OBJECTS
    // ------------------------------------

    eyeballBone =
      oko.getObjectByName("Eyeball");


    eyeballMesh =
      oko.getObjectByName("EYEBALL");


    head =
      oko.getObjectByName("HEAD");


    body =
      oko.getObjectByName("BODY_1");


    leftEar =
      oko.getObjectByName("left ear");


    rightEar =
      oko.getObjectByName("right ear");


    // ------------------------------------
    // DEBUG
    // ------------------------------------

    console.log("================================");
    console.log("OKO LOADED");
    console.log("================================");

    console.log(
      "Eyeball BONE:",
      eyeballBone
    );

    console.log(
      "Eyeball MESH:",
      eyeballMesh
    );

    console.log(
      "Head:",
      head
    );

    console.log(
      "Body:",
      body
    );

    console.log(
      "Left Ear:",
      leftEar
    );

    console.log(
      "Right Ear:",
      rightEar
    );


    // ------------------------------------
    // SAVE EYE POSITION
    // ------------------------------------

    if (eyeballBone) {

      eyeBasePosition.copy(
        eyeballBone.position
      );

    }


    // ------------------------------------
    // SAVE HEAD ROTATION
    // ------------------------------------

    if (head) {

      headBaseRotation.copy(
        head.rotation
      );

    }


    // ------------------------------------
    // SAVE BODY ROTATION
    // ------------------------------------

    if (body) {

      bodyBaseRotation.copy(
        body.rotation
      );

    }


    // ------------------------------------
    // SAVE EAR ROTATIONS
    // ------------------------------------

    if (leftEar) {

      leftEarBaseRotation.copy(
        leftEar.rotation
      );

    }


    if (rightEar) {

      rightEarBaseRotation.copy(
        rightEar.rotation
      );

    }


    // ------------------------------------
    // CENTRE OKO
    // ------------------------------------

    const box =
      new THREE.Box3().setFromObject(oko);


    const center =
      box.getCenter(
        new THREE.Vector3()
      );


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    oko.position.sub(center);


    // ------------------------------------
    // CAMERA
    // ------------------------------------

    const maxDimension =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    const fitHeightDistance =
      maxDimension /
      (
        2 *
        Math.tan(
          THREE.MathUtils.degToRad(
            camera.fov / 2
          )
        )
      );


    const cameraDistance =
      fitHeightDistance * 1.5;


    camera.position.set(
      0,
      0,
      cameraDistance
    );


    camera.lookAt(
      0,
      0,
      0
    );

  },


  // --------------------------------------
  // LOADING
  // --------------------------------------

  (progress) => {

    if (progress.total) {

      const percent =
        (progress.loaded / progress.total) * 100;


      console.log(
        "Loading Oko:",
        percent.toFixed(0) + "%"
      );

    }

  },


  // --------------------------------------
  // ERROR
  // --------------------------------------

  (error) => {

    console.error(
      "COULD NOT LOAD OKO:",
      error
    );

  }

);



// ========================================
// ANIMATION LOOP
// ========================================

function animate() {

  requestAnimationFrame(animate);



  // ======================================
  // EYE
  // ======================================

  if (eyeballBone) {

    eyeCurrentX +=
      (
        eyeTargetX -
        eyeCurrentX
      ) * 0.08;


    eyeCurrentY +=
      (
        eyeTargetY -
        eyeCurrentY
      ) * 0.08;


    eyeballBone.position.x =
      eyeBasePosition.x +
      eyeCurrentX;


    eyeballBone.position.y =
      eyeBasePosition.y +
      eyeOffsetY +
      eyeCurrentY;

  }



  // ======================================
  // HEAD
  // ======================================

  if (head) {

    const headTargetY =
      eyeCurrentX * 1.4;


    const headTargetX =
      -eyeCurrentY * 1.0;


    const headTargetZ =
      eyeCurrentX * -0.5;


    // ------------------------------------
    // Normal head follow.
    // ------------------------------------

    headCurrentY +=
      (
        headTargetY -
        headCurrentY
      ) * 0.035;


    headCurrentX +=
      (
        headTargetX -
        headCurrentX
      ) * 0.035;


    headCurrentZ +=
      (
        headTargetZ -
        headCurrentZ
      ) * 0.035;


    // ------------------------------------
    // Idle head.
    // ------------------------------------

    headIdleCurrentX +=
      (
        headIdleTargetX -
        headIdleCurrentX
      ) * 0.015;


    headIdleCurrentY +=
      (
        headIdleTargetY -
        headIdleCurrentY
      ) * 0.015;


    headIdleCurrentZ +=
      (
        headIdleTargetZ -
        headIdleCurrentZ
      ) * 0.015;


    // ------------------------------------
    // Apply head.
    // ------------------------------------

    head.rotation.x =
      headBaseRotation.x +
      headCurrentX +
      headIdleCurrentX;


    head.rotation.y =
      headBaseRotation.y +
      headCurrentY +
      headIdleCurrentY;


    head.rotation.z =
      headBaseRotation.z +
      headCurrentZ +
      headIdleCurrentZ;

  }



  // ======================================
  // BODY
  // ======================================

  if (body) {

    bodyIdleCurrentX +=
      (
        bodyIdleTargetX -
        bodyIdleCurrentX
      ) * 0.008;


    bodyIdleCurrentY +=
      (
        bodyIdleTargetY -
        bodyIdleCurrentY
      ) * 0.008;


    bodyIdleCurrentZ +=
      (
        bodyIdleTargetZ -
        bodyIdleCurrentZ
      ) * 0.008;


    // ------------------------------------
    // Body follows head slightly.
    // ------------------------------------

    const bodyFollowY =
      headCurrentY * 0.20;


    const bodyFollowX =
      headCurrentX * 0.15;


    const bodyFollowZ =
      headCurrentZ * 0.20;


    // ------------------------------------
    // Apply body.
    // ------------------------------------

    body.rotation.x =
      bodyBaseRotation.x +
      bodyFollowX +
      bodyIdleCurrentX;


    body.rotation.y =
      bodyBaseRotation.y +
      bodyFollowY +
      bodyIdleCurrentY;


    body.rotation.z =
      bodyBaseRotation.z +
      bodyFollowZ +
      bodyIdleCurrentZ;

  }



// ======================================
// EAR TEST — X AXIS
// ======================================

if (leftEar && rightEar) {

  const earTest =
    Math.sin(performance.now() * 0.004) * 0.5;


  leftEar.rotation.x =
    leftEarBaseRotation.x +
    earTest;

  leftEar.rotation.y =
    leftEarBaseRotation.y;

  leftEar.rotation.z =
    leftEarBaseRotation.z;


  rightEar.rotation.x =
    rightEarBaseRotation.x -
    earTest;

  rightEar.rotation.y =
    rightEarBaseRotation.y;

  rightEar.rotation.z =
    rightEarBaseRotation.z;

}

  // ======================================
  // RENDER
  // ======================================

  renderer.render(
    scene,
    camera
  );

}



// ========================================
// START
// ========================================

animate();



// ========================================
// RESIZE
// ========================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
