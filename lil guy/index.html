<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #kkzywz {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="kkzywz"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// SETUP
// ============================================================

const container = document.getElementById("kkzywz");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  container.clientWidth / container.clientHeight,
  0.01,
  1000
);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setClearColor(
  0x000000,
  0
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.NoToneMapping;

renderer.toneMappingExposure = 1;

container.appendChild(
  renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    0.45
  );

scene.add(
  ambientLight
);


const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    1.8
  );

directionalLight.position.set(
  4,
  5,
  6
);

scene.add(
  directionalLight
);


const fillLight =
  new THREE.DirectionalLight(
    0xffffff,
    0.15
  );

fillLight.position.set(
  -4,
  2,
  3
);

scene.add(
  fillLight
);


// ============================================================
// CLOCK
// ============================================================

const clock =
  new THREE.Clock();


// ============================================================
// MODEL REFERENCES
// ============================================================

let oko = null;

let leftEar = null;
let rightEar = null;

let leftShoulder = null;
let leftArm = null;

let rightShoulder = null;
let rightArm = null;

let leftHip = null;
let leftLeg = null;

let rightHip = null;
let rightLeg = null;

let head = null;

let eyeBone = null;
let eyeMesh = null;


// ============================================================
// EYE
// ============================================================

let eyeMovementAmount = 0;

let currentEyeX = 0;
let currentEyeY = 0;

let headEyeX = 0;
let headEyeY = 0;


// ============================================================
// MOUSE
// ============================================================

let mouseX = 0;
let mouseY = 0;

let mouseInsideContainer = false;

let lastMouseMoveTime = 0;


// Mouse position relative to the Oko container.
// This keeps the behaviour local to the character.

container.addEventListener(
  "mousemove",
  (event) => {

    const rect =
      container.getBoundingClientRect();

    const x =
      (event.clientX - rect.left) /
      rect.width;

    const y =
      (event.clientY - rect.top) /
      rect.height;

    mouseX =
      x * 2 - 1;

    mouseY =
      y * 2 - 1;

    lastMouseMoveTime =
      clock.elapsedTime;

    mouseInsideContainer = true;

  }
);


container.addEventListener(
  "mouseenter",
  () => {
    mouseInsideContainer = true;
  }
);


container.addEventListener(
  "mouseleave",
  () => {

    mouseInsideContainer = false;

  }
);


// ============================================================
// HELPERS
// ============================================================

function damp(
  current,
  target,
  speed,
  delta
) {

  return THREE.MathUtils.damp(
    current,
    target,
    speed,
    delta
  );

}


function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function easeOut(t) {

  t =
    clamp(
      t,
      0,
      1
    );

  return 1 -
    Math.pow(
      1 - t,
      3
    );

}


// ============================================================
// LOAD MODEL
// ============================================================

const loader =
  new GLTFLoader();

loader.load(
  "./OKO.glb",

  function(gltf) {

    console.log(
      "OKO LOADED"
    );

    oko =
      gltf.scene;


    // ----------------------------------------------------------
    // FIND RIG
    // ----------------------------------------------------------

    oko.traverse(
      (object) => {

        if (
          object.name ===
          "left_ear"
        )
          leftEar = object;

        if (
          object.name ===
          "right_ear"
        )
          rightEar = object;

        if (
          object.name ===
          "left_shoulder"
        )
          leftShoulder =
            object;

        if (
          object.name ===
          "left_arm"
        )
          leftArm = object;

        if (
          object.name ===
          "right_shoulder"
        )
          rightShoulder =
            object;

        if (
          object.name ===
          "right_arm"
        )
          rightArm = object;

        if (
          object.name ===
          "left_hip_bone"
        )
          leftHip = object;

        if (
          object.name ===
          "left_leg"
        )
          leftLeg = object;

        if (
          object.name ===
          "right_hip_bone"
        )
          rightHip = object;

        if (
          object.name ===
          "right_leg"
        )
          rightLeg = object;

        if (
          object.name ===
          "HEAD"
        )
          head = object;

        if (
          object.name ===
          "Eyeball"
        )
          eyeBone = object;

        if (
          object.name ===
          "EYEBALL"
        )
          eyeMesh = object;

      }
    );


    // ----------------------------------------------------------
    // CENTRE MODEL
    // ----------------------------------------------------------

    const box =
      new THREE.Box3()
        .setFromObject(oko);

    const size =
      box.getSize(
        new THREE.Vector3()
      );

    const center =
      box.getCenter(
        new THREE.Vector3()
      );

    oko.position.sub(
      center
    );

    scene.add(
      oko
    );


    // ----------------------------------------------------------
    // CAMERA
    // ----------------------------------------------------------

    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );

    const fov =
      THREE.MathUtils.degToRad(
        camera.fov
      );

    let distance =
      (maxSize / 2) /
      Math.tan(
        fov / 2
      );

    distance *= 1.35;

    camera.position.set(
      0,
      0,
      distance
    );

    camera.lookAt(
      0,
      0,
      0
    );

    camera.near =
      Math.max(
        0.01,
        distance / 100
      );

    camera.far =
      distance * 100;

    camera.updateProjectionMatrix();


    // ----------------------------------------------------------
    // EYE RANGE
    // ----------------------------------------------------------

    eyeMovementAmount =
      maxSize * 0.045;


    console.log(
      "Bones found:",
      {
        leftEar,
        rightEar,
        leftShoulder,
        leftArm,
        rightShoulder,
        rightArm,
        leftHip,
        leftLeg,
        rightHip,
        rightLeg,
        head,
        eyeBone,
        eyeMesh
      }
    );

  },

  undefined,

  function(error) {

    console.error(
      "ERROR LOADING OKO:",
      error
    );

  }
);


// ============================================================
// IDLE EYE WANDERING
// ============================================================

let idleEyeX = 0;
let idleEyeY = 0;

let idleEyeTargetX = 0;
let idleEyeTargetY = 0;

let nextEyeMove = 2;


// ============================================================
// SHY
// ============================================================

let behaviour = "normal";

let shyAmount = 0;

let shyStartTime = -10;

let nervousX = 0;
let nervousY = 0;

let nextNervousMove = 0;


// ============================================================
// EARS
// ============================================================

let earReactionStart = -10;


// ============================================================
// DETERMINE WHETHER CURSOR IS CLOSE ENOUGH
// ============================================================

function cursorIsClose() {

  if (
    !mouseInsideContainer
  ) {
    return false;
  }


  // Distance from the centre of the
  // character in normalized screen space.

  const distance =
    Math.sqrt(
      mouseX * mouseX +
      mouseY * mouseY
    );


  // Only become shy when the cursor
  // is reasonably close to Oko.
  //
  // This is intentionally generous because
  // the canvas may be larger than the model.

  return distance < 0.72;

}


// ============================================================
// IDLE EYE
// ============================================================

function updateIdleEye(
  time,
  delta
) {

  const idle =
    !mouseInsideContainer ||
    time - lastMouseMoveTime >
      2;


  if (!idle) {

    idleEyeTargetX = 0;
    idleEyeTargetY = 0;

    idleEyeX =
      damp(
        idleEyeX,
        0,
        5,
        delta
      );

    idleEyeY =
      damp(
        idleEyeY,
        0,
        5,
        delta
      );

    return;

  }


  if (
    time >
    nextEyeMove
  ) {

    const directions = [

      [-1.0, 0.15],
      [-0.7, 0.65],
      [0.85, 0.15],
      [0.65, -0.55],
      [-0.55, -0.55],
      [0.10, 0.65],
      [0.05, -0.55]

    ];


    const direction =
      directions[
        Math.floor(
          Math.random() *
          directions.length
        )
      ];


    idleEyeTargetX =
      direction[0] *
      eyeMovementAmount *
      0.9;

    idleEyeTargetY =
      direction[1] *
      eyeMovementAmount *
      0.75;


    nextEyeMove =
      time +
      THREE.MathUtils.randFloat(
        1.3,
        2.7
      );

  }


  idleEyeX =
    damp(
      idleEyeX,
      idleEyeTargetX,
      3.5,
      delta
    );

  idleEyeY =
    damp(
      idleEyeY,
      idleEyeTargetY,
      3.5,
      delta
    );

}


// ============================================================
// SHY NERVOUS EYE
// ============================================================

function updateNervousEye(
  time
) {

  if (
    behaviour !== "shy"
  ) {

    nervousX *= 0.85;
    nervousY *= 0.85;

    return;

  }


  if (
    time >
    nextNervousMove
  ) {

    const directions = [

      [-0.9, 0.15],
      [0.8, 0.10],
      [-0.65, 0.55],
      [0.65, -0.45],
      [0.10, 0.60],
      [-0.2, -0.55]

    ];


    const direction =
      directions[
        Math.floor(
          Math.random() *
          directions.length
        )
      ];


    nervousX =
      direction[0] *
      eyeMovementAmount *
      0.38;

    nervousY =
      direction[1] *
      eyeMovementAmount *
      0.32;


    nextNervousMove =
      time +
      THREE.MathUtils.randFloat(
        0.25,
        0.55
      );

  }

}


// ============================================================
// EARS
// ============================================================

function updateEars(
  time
) {

  if (
    !leftEar ||
    !rightEar
  ) {
    return;
  }


  // Extremely subtle idle movement.

  const leftIdle =
    Math.sin(
      time * 0.8
    ) * 0.018;

  const rightIdle =
    Math.sin(
      time * 0.72 + 1.8
    ) * 0.014;

  const leftIdleX =
    Math.sin(
      time * 0.63 + 0.5
    ) * 0.012;

  const rightIdleX =
    Math.sin(
      time * 0.68 + 2.2
    ) * 0.010;


  // Short reaction when shy.

  let reaction = 0;

  const elapsed =
    time -
    earReactionStart;


  if (
    elapsed >= 0 &&
    elapsed < 0.35
  ) {

    const progress =
      elapsed / 0.35;

    reaction =
      Math.sin(
        progress * Math.PI
      );

  }


  leftEar.rotation.z =
    leftIdle +
    reaction * 0.06;

  rightEar.rotation.z =
    rightIdle -
    reaction * 0.045;

  leftEar.rotation.x =
    leftIdleX;

  rightEar.rotation.x =
    rightIdleX;


  // Slight nervous ear movement.

  if (
    behaviour === "shy"
  ) {

    leftEar.rotation.z +=
      Math.sin(
        time * 9
      ) * 0.012;

    rightEar.rotation.z +=
      Math.sin(
        time * 10.5
      ) * 0.010;

  }

}


// ============================================================
// SHY STATE
// ============================================================

function enterShy(
  time
) {

  if (
    behaviour === "shy"
  ) {
    return;
  }


  behaviour = "shy";

  shyStartTime =
    time;

  nextNervousMove =
    time + 0.15;

  earReactionStart =
    time;

}


function exitShy() {

  if (
    behaviour !== "shy"
  ) {
    return;
  }

  behaviour = "normal";

}


// ============================================================
// ANIMATION
// ============================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  const delta =
    Math.min(
      clock.getDelta(),
      0.05
    );

  const time =
    clock.elapsedTime;


  if (!oko) {

    renderer.render(
      scene,
      camera
    );

    return;

  }


  // ==========================================================
  // SHY DETECTION
  // ==========================================================

  if (
    cursorIsClose()
  ) {

    enterShy(
      time
    );

  } else {

    exitShy();

  }


  // ==========================================================
  // EYE SOURCES
  // ==========================================================

  updateIdleEye(
    time,
    delta
  );

  updateNervousEye(
    time
  );


  const mouseIdle =
    !mouseInsideContainer ||
    time - lastMouseMoveTime >
      2;


  let targetEyeX = 0;
  let targetEyeY = 0;


  if (
    behaviour === "shy"
  ) {

    // Nervous eye still occasionally
    // checks where the cursor is.

    targetEyeX =
      mouseX *
      eyeMovementAmount *
      0.30;

    targetEyeY =
      mouseY *
      eyeMovementAmount *
      0.22;

    targetEyeX +=
      nervousX;

    targetEyeY +=
      nervousY;

  }

  else if (
    mouseIdle
  ) {

    targetEyeX =
      idleEyeX;

    targetEyeY =
      idleEyeY;

  }

  else {

    targetEyeX =
      mouseX *
      eyeMovementAmount;

    targetEyeY =
      mouseY *
      eyeMovementAmount;

  }


  // ==========================================================
  // EYE
  // ==========================================================

  currentEyeX =
    damp(
      currentEyeX,
      targetEyeX,
      behaviour === "shy"
        ? 11
        : 8,
      delta
    );

  currentEyeY =
    damp(
      currentEyeY,
      targetEyeY,
      behaviour === "shy"
        ? 11
        : 8,
      delta
    );


  if (
    eyeBone
  ) {

    eyeBone.rotation.y =
      currentEyeX;

    eyeBone.rotation.x =
      -currentEyeY;

  }


  // ==========================================================
  // HEAD FOLLOWS EYE
  // ==========================================================

  headEyeX =
    damp(
      headEyeX,
      currentEyeX,
      4.5,
      delta
    );

  headEyeY =
    damp(
      headEyeY,
      currentEyeY,
      4.5,
      delta
    );


  if (
    head
  ) {

    head.rotation.y =
      headEyeX *
      0.18;

    head.rotation.x =
      -headEyeY *
      0.10;

  }


  // ==========================================================
  // SHY BODY REACTION
  // ==========================================================

  const shyTarget =
    behaviour === "shy"
      ? 1
      : 0;


  shyAmount =
    damp(
      shyAmount,
      shyTarget,
      behaviour === "shy"
        ? 10
        : 6,
      delta
    );


  // ==========================================================
  // SHOULDERS
  // ==========================================================

  if (
    leftShoulder &&
    rightShoulder
  ) {

    // Small "oh!" shoulder raise.
    // Much safer than throwing the arms around.

    const shoulderPulse =
      Math.sin(
        (time - shyStartTime) *
        8
      ) *
      0.025 *
      shyAmount;


    leftShoulder.rotation.z =
      -shyAmount *
      0.055;

    rightShoulder.rotation.z =
      shyAmount *
      0.055;


    leftShoulder.rotation.x =
      -shyAmount *
      0.035 +
      shoulderPulse;

    rightShoulder.rotation.x =
      -shyAmount *
      0.035 +
      shoulderPulse;

  }


  // ==========================================================
  // ARMS
  // ==========================================================

  if (
    leftArm &&
    rightArm
  ) {

    /*
      IMPORTANT:

      The previous animation rotated the arms
      aggressively toward the face.

      This version deliberately stays inside
      a very small safe range.

      Think:
        "tuck arms in"
      rather than:
        "cover face"

      This avoids the torso intersection.
    */


    // Small inward tuck.

    const leftSafeZ =
      -0.075;

    const rightSafeZ =
      0.075;


    // Slight backward/downward movement.

    const leftSafeX =
      0.025;

    const rightSafeX =
      0.025;


    // Tiny startle pulse.

    const elapsed =
      time -
      shyStartTime;


    let startle =
      0;


    if (
      behaviour === "shy" &&
      elapsed >= 0 &&
      elapsed < 0.30
    ) {

      const progress =
        elapsed / 0.30;

      startle =
        Math.sin(
          progress * Math.PI
        );

    }


    leftArm.rotation.z =
      leftSafeZ *
      shyAmount -
      startle *
      0.025;

    rightArm.rotation.z =
      rightSafeZ *
      shyAmount +
      startle *
      0.025;


    leftArm.rotation.x =
      leftSafeX *
      shyAmount;

    rightArm.rotation.x =
      rightSafeX *
      shyAmount;


    // Very small nervous pulse once settled.

    if (
      behaviour === "shy" &&
      elapsed > 0.65
    ) {

      const nervousPulse =
        Math.sin(
          time * 7
        ) *
        0.012;


      leftArm.rotation.z +=
        nervousPulse;

      rightArm.rotation.z -=
        nervousPulse;

    }

  }


  // ==========================================================
  // HIPS
  // ==========================================================

  if (
    leftHip &&
    rightHip
  ) {

    const hipShift =
      Math.sin(
        time * 0.9
      ) *
      0.018;


    leftHip.rotation.z =
      hipShift;

    rightHip.rotation.z =
      -hipShift;

  }


  // ==========================================================
  // LEGS
  // ==========================================================

  if (
    leftLeg &&
    rightLeg
  ) {

    const legShift =
      Math.sin(
        time * 1.1
      ) *
      0.025;


    leftLeg.rotation.z =
      legShift;

    rightLeg.rotation.z =
      -legShift;

  }


  // ==========================================================
  // EARS
  // ==========================================================

  updateEars(
    time
  );


  // ==========================================================
  // RENDER
  // ==========================================================

  renderer.render(
    scene,
    camera
  );

}


// ============================================================
// RESIZE
// ============================================================

function resize() {

  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if (
    width === 0 ||
    height === 0
  ) {
    return;
  }


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height
  );

}


window.addEventListener(
  "resize",
  resize
);


// ============================================================
// START
// ============================================================

resize();

animate();

</script>

</body>
</html>
