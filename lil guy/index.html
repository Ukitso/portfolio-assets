<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #kkzywz {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="kkzywz"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// SETUP
// ============================================================

const container =
  document.getElementById("kkzywz");

const scene =
  new THREE.Scene();


// ============================================================
// CAMERA
// ============================================================

const camera =
  new THREE.PerspectiveCamera(
    45,
    container.clientWidth /
      container.clientHeight,
    0.01,
    1000
  );


// ============================================================
// RENDERER
// ============================================================

const renderer =
  new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setClearColor(
  0x000000,
  0
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.NoToneMapping;

renderer.toneMappingExposure =
  1.0;

container.appendChild(
  renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    0.45
  );

scene.add(
  ambientLight
);


const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    1.8
  );

directionalLight.position.set(
  4,
  5,
  6
);

scene.add(
  directionalLight
);


const fillLight =
  new THREE.DirectionalLight(
    0xffffff,
    0.15
  );

fillLight.position.set(
  -4,
  2,
  3
);

scene.add(
  fillLight
);


// ============================================================
// MODEL
// ============================================================

const loader =
  new GLTFLoader();

let oko;


// ============================================================
// BONES
// ============================================================

let leftEar;
let rightEar;

let leftShoulder;
let rightShoulder;

let leftArm;
let rightArm;

let leftHip;
let rightHip;

let leftLeg;
let rightLeg;

let head;
let eyeball;


// ============================================================
// BASE TRANSFORMS
// ============================================================

let leftEarBaseRotation;
let rightEarBaseRotation;

let leftShoulderBaseRotation;
let rightShoulderBaseRotation;

let leftArmBaseRotation;
let rightArmBaseRotation;

let leftHipBaseRotation;
let rightHipBaseRotation;

let leftLegBaseRotation;
let rightLegBaseRotation;

let headBaseRotation;

let eyeballBasePosition;

let baseOkoPosition;
let baseOkoScale;


// ============================================================
// CLOCK
// ============================================================

const clock =
  new THREE.Clock();


// ============================================================
// MOUSE
// ============================================================

let pointerX = 0;
let pointerY = 0;

let pointerScreenX = 0;
let pointerScreenY = 0;

let pointerMoved = false;


// ============================================================
// EYE TRACKING
// ============================================================

let eyeMovementAmount = 0;

let targetEyeX = 0;
let targetEyeY = 0;

let currentEyeX = 0;
let currentEyeY = 0;


// ============================================================
// IDLE EYE WANDER
// ============================================================

let lastPointerMoveTime = 0;

let idleEyeX = 0;
let idleEyeY = 0;

let idleEyeTargetX = 0;
let idleEyeTargetY = 0;

let nextIdleEyeMove = 2.0;

const idleEyeDelay = 2.0;


// ============================================================
// BEHAVIOUR STATE
// ============================================================

let behaviour =
  "idle";


// Smoothly moves between
// 0 = normal
// 1 = shy

let shyAmount = 0;


// Quick startle impulse

let shyPulse = 0;

let wasNear = false;


// ============================================================
// PERSONALITY HIERARCHY
// ============================================================

// Priority:
// 1. BOOP      = direct click interaction
// 2. SHY       = cursor is very close
// 3. CURIOUS   = cursor enters Oko's space
// 4. IDLE      = nobody is bothering him

let noticePulse = 0;
let boopPulse = 0;
let boopStart = -10;
const boopDuration = 0.55;

let curiousAmount = 0;

let pointerNear = false;
let pointerVeryNear = false;


// ============================================================
// IDLE ACTION
// ============================================================

let idleAction = null;

let nextIdleAction = 3;


// ============================================================
// IDLE ACTION TARGETS
// ============================================================

let idleHeadX = 0;
let idleHeadY = 0;
let idleHeadZ = 0;

let idleLeftArmX = 0;
let idleLeftArmY = 0;
let idleLeftArmZ = 0;

let idleRightArmX = 0;
let idleRightArmY = 0;
let idleRightArmZ = 0;

let idleLeftLegX = 0;
let idleLeftLegY = 0;
let idleLeftLegZ = 0;

let idleRightLegX = 0;
let idleRightLegY = 0;
let idleRightLegZ = 0;

let idleHipZ = 0;

let idleLeftEarX = 0;
let idleRightEarX = 0;

let idleBodyY = 0;
let idleBodyZ = 0;


// ============================================================
// EYE DART
// ============================================================

let eyeDartX = 0;
let eyeDartY = 0;

let eyeDartTargetX = 0;
let eyeDartTargetY = 0;

let eyeDartAmount = 0;

let nextEyeDart = 3;

let eyeDartStart = -10;

const eyeDartDuration =
  0.32;


// ============================================================
// NERVOUS EYES
// ============================================================

let nervousEyeX = 0;
let nervousEyeY = 0;

let nervousEyeTargetX = 0;
let nervousEyeTargetY = 0;

let nextNervousEyeMove = 0;


// ============================================================
// EARS
// ============================================================

let earReaction = 0;

let earReactionStart = -10;

const earReactionDuration =
  0.42;


// Random ear twitches

let earTwitchLeft = 0;
let earTwitchRight = 0;

let nextLeftEarTwitch = 2.5;
let nextRightEarTwitch = 4;

let leftEarTwitchStart = -10;
let rightEarTwitchStart = -10;

const earTwitchDuration =
  0.28;


// ============================================================
// LOAD MODEL
// ============================================================

loader.load(
  "./OKO.glb",

  function(gltf) {

    console.log(
      "OKO LOADED"
    );

    oko =
      gltf.scene;


    // --------------------------------------------------------
    // CENTER
    // --------------------------------------------------------

    const box =
      new THREE.Box3()
        .setFromObject(
          oko
        );

    const size =
      box.getSize(
        new THREE.Vector3()
      );

    const center =
      box.getCenter(
        new THREE.Vector3()
      );

    oko.position.sub(
      center
    );

    scene.add(
      oko
    );


    // --------------------------------------------------------
    // BASE TRANSFORMS
    // --------------------------------------------------------

    baseOkoPosition =
      oko.position.clone();

    baseOkoScale =
      oko.scale.clone();


    // --------------------------------------------------------
    // FIND BONES
    // --------------------------------------------------------

    leftEar =
      oko.getObjectByName(
        "left_ear"
      );

    rightEar =
      oko.getObjectByName(
        "right_ear"
      );


    leftShoulder =
      oko.getObjectByName(
        "left_shoulder"
      );

    rightShoulder =
      oko.getObjectByName(
        "right_shoulder"
      );


    leftArm =
      oko.getObjectByName(
        "left_arm"
      );

    rightArm =
      oko.getObjectByName(
        "right_arm"
      );


    leftHip =
      oko.getObjectByName(
        "left_hip_bone"
      );

    rightHip =
      oko.getObjectByName(
        "right_hip_bone"
      );


    leftLeg =
      oko.getObjectByName(
        "left_leg"
      );

    rightLeg =
      oko.getObjectByName(
        "right_leg"
      );


    head =
      oko.getObjectByName(
        "HEAD"
      );

    eyeball =
      oko.getObjectByName(
        "Eyeball"
      );


    // --------------------------------------------------------
    // STORE BASE ROTATIONS
    // --------------------------------------------------------

    if (leftEar)
      leftEarBaseRotation =
        leftEar.rotation.clone();

    if (rightEar)
      rightEarBaseRotation =
        rightEar.rotation.clone();


    if (leftShoulder)
      leftShoulderBaseRotation =
        leftShoulder.rotation.clone();

    if (rightShoulder)
      rightShoulderBaseRotation =
        rightShoulder.rotation.clone();


    if (leftArm)
      leftArmBaseRotation =
        leftArm.rotation.clone();

    if (rightArm)
      rightArmBaseRotation =
        rightArm.rotation.clone();


    if (leftHip)
      leftHipBaseRotation =
        leftHip.rotation.clone();

    if (rightHip)
      rightHipBaseRotation =
        rightHip.rotation.clone();


    if (leftLeg)
      leftLegBaseRotation =
        leftLeg.rotation.clone();

    if (rightLeg)
      rightLegBaseRotation =
        rightLeg.rotation.clone();


    if (head)
      headBaseRotation =
        head.rotation.clone();


    if (eyeball)
      eyeballBasePosition =
        eyeball.position.clone();


    // --------------------------------------------------------
    // EYE RANGE
    // --------------------------------------------------------

    eyeMovementAmount =
      Math.max(
        size.x,
        size.y,
        size.z
      ) * 0.045;


    // --------------------------------------------------------
    // CAMERA
    // --------------------------------------------------------

    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );

    const fov =
      THREE.MathUtils.degToRad(
        camera.fov
      );

    let distance =
      (maxSize / 2) /
      Math.tan(
        fov / 2
      );

    distance *=
      1.35;


    camera.position.set(
      0,
      0,
      distance
    );

    camera.lookAt(
      0,
      0,
      0
    );

    camera.near =
      Math.max(
        0.01,
        distance / 100
      );

    camera.far =
      distance * 100;

    camera.updateProjectionMatrix();

  },

  undefined,

  function(error) {

    console.error(
      "ERROR LOADING OKO:",
      error
    );

  }
);


// ============================================================
// MOUSE / POINTER TRACKING
// ============================================================

// Track the pointer relative to the actual Oko embed rather
// than the browser window. This keeps the eye stable when the
// Readymag embed is resized, moved, or given a different aspect ratio.

document.addEventListener(
  "pointermove",
  function(e) {

    pointerScreenX =
      e.clientX;

    pointerScreenY =
      e.clientY;

    pointerMoved =
      true;

    lastPointerMoveTime =
      clock.elapsedTime;


    const rect =
      container.getBoundingClientRect();

    if (
      rect.width <= 0 ||
      rect.height <= 0
    ) {
      return;
    }


    const centreX =
      rect.left +
      rect.width / 2;

    const centreY =
      rect.top +
      rect.height / 2;


    // Convert pointer position into a stable
    // -1 ... +1 coordinate inside the embed.

    let localX =
      (
        e.clientX -
        centreX
      ) /
      (rect.width / 2);

    let localY =
      (
        e.clientY -
        centreY
      ) /
      (rect.height / 2);


    // Never allow the cursor to create an
    // excessive eye target.

    localX =
      THREE.MathUtils.clamp(
        localX,
        -1,
        1
      );

    localY =
      THREE.MathUtils.clamp(
        localY,
        -1,
        1
      );


    // Also clamp the combined diagonal distance.
    // This gives the eye a circular movement limit.

    const pointerLength =
      Math.sqrt(
        localX * localX +
        localY * localY
      );

    if (
      pointerLength > 1
    ) {

      localX /=
        pointerLength;

      localY /=
        pointerLength;

    }


    pointerX =
      localX;

    pointerY =
      localY;


    targetEyeX =
      localX * 0.45;

    targetEyeY =
      localY * 0.30;

  }
);


// When the pointer leaves the embed, gently
// bring the eye back rather than leaving it stuck
// at the last cursor position.

container.addEventListener(
  "pointerleave",
  function() {

    targetEyeX = 0;
    targetEyeY = 0;

    idleEyeTargetX = 0;
    idleEyeTargetY = 0;

  }
);


// ============================================================
// IDLE EYE WANDER
// ============================================================

function updateIdleEye(
  time,
  delta
) {

  // While the pointer is moving, leave the idle
  // target alone and let normal cursor tracking take over.

  const pointerIdle =
    time -
    lastPointerMoveTime >
    idleEyeDelay;


  if (!pointerIdle) {

    idleEyeTargetX = 0;
    idleEyeTargetY = 0;

    idleEyeX =
      damp(
        idleEyeX,
        0,
        7,
        delta
      );

    idleEyeY =
      damp(
        idleEyeY,
        0,
        7,
        delta
      );

    return;

  }


  // Pick a new place to look every so often.
  // The eye pauses between movements instead of
  // continuously drifting.

  if (
    time >
    nextIdleEyeMove
  ) {

    const directions = [
      [-1.00,  0.05],
      [-0.72,  0.62],
      [ 0.92,  0.10],
      [ 0.68, -0.52],
      [-0.58, -0.48],
      [ 0.10,  0.70],
      [ 0.05, -0.62]
    ];


    const direction =
      directions[
        Math.floor(
          Math.random() *
          directions.length
        )
      ];


    // Keep idle wandering slightly inside the
    // normal tracking range.

    idleEyeTargetX =
      direction[0] *
      0.34;

    idleEyeTargetY =
      direction[1] *
      0.23;


    // Sometimes hold the glance longer,
    // making it feel like Oko is actually
    // looking at something.

    nextIdleEyeMove =
      time +
      THREE.MathUtils.randFloat(
        1.1,
        2.8
      );

  }


  idleEyeX =
    damp(
      idleEyeX,
      idleEyeTargetX,
      5.5,
      delta
    );

  idleEyeY =
    damp(
      idleEyeY,
      idleEyeTargetY,
      5.5,
      delta
    );

}


// ============================================================
// PERSONALITY STATE
// ============================================================

function getPointerDistance() {

  if (!oko || !pointerMoved)
    return Infinity;


  const rect =
    container.getBoundingClientRect();


  if (
    rect.width <= 0 ||
    rect.height <= 0
  ) {
    return Infinity;
  }


  const centreX =
    rect.left +
    rect.width / 2;

  const centreY =
    rect.top +
    rect.height / 2;


  const dx =
    pointerScreenX -
    centreX;

  const dy =
    pointerScreenY -
    centreY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


function updateShyState(
  delta,
  time
) {

  if (!oko)
    return;


  const rect =
    container.getBoundingClientRect();


  const distance =
    getPointerDistance();


  // Two interaction rings:
  //
  // Near ring       = Oko notices you
  // Very near ring  = Oko gets shy

  const nearRadius =
    Math.min(
      rect.width,
      rect.height
    ) * 0.50;

  const veryNearRadius =
    Math.min(
      rect.width,
      rect.height
    ) * 0.25;


  pointerNear =
    pointerMoved &&
    distance <
    nearRadius;

  pointerVeryNear =
    pointerMoved &&
    distance <
    veryNearRadius;


  // ----------------------------------------------------------
  // NEW ARRIVAL / NOTICE
  // ----------------------------------------------------------

  if (
    pointerNear &&
    !wasNear
  ) {

    noticePulse =
      1;

    earReaction =
      1;

    earReactionStart =
      time;

  }


  // ----------------------------------------------------------
  // PERSONALITY PRIORITY
  // ----------------------------------------------------------

  // A boop temporarily overrides everything else.

  if (
    time <
    boopStart +
    boopDuration
  ) {

    behaviour =
      "boop";

  }

  else if (
    pointerVeryNear
  ) {

    behaviour =
      "shy";

  }

  else if (
    pointerNear
  ) {

    behaviour =
      "curious";

  }

  else {

    behaviour =
      "idle";

  }


  wasNear =
    pointerNear;


  // ----------------------------------------------------------
  // SHY AMOUNT
  // ----------------------------------------------------------

  const shyTarget =
    pointerVeryNear &&
    behaviour === "shy"
      ? 1
      : 0;


  shyAmount =
    damp(
      shyAmount,
      shyTarget,
      shyTarget > shyAmount
        ? 7
        : 4,
      delta
    );


  // ----------------------------------------------------------
  // CURIOUS AMOUNT
  // ----------------------------------------------------------

  const curiousTarget =
    pointerNear &&
    !pointerVeryNear &&
    behaviour === "curious"
      ? 1
      : 0;


  curiousAmount =
    damp(
      curiousAmount,
      curiousTarget,
      curiousTarget > curiousAmount
        ? 8
        : 5,
      delta
    );


  // ----------------------------------------------------------
  // IMPULSES
  // ----------------------------------------------------------

  noticePulse =
    damp(
      noticePulse,
      0,
      9,
      delta
    );

  boopPulse =
    damp(
      boopPulse,
      0,
      11,
      delta
    );

}


// ============================================================
// CLICK / BOOP
// ============================================================

container.addEventListener(
  "pointerdown",
  function(e) {

    if (!oko)
      return;


    const rect =
      container.getBoundingClientRect();


    const centreX =
      rect.left +
      rect.width / 2;

    const centreY =
      rect.top +
      rect.height / 2;


    const dx =
      e.clientX -
      centreX;

    const dy =
      e.clientY -
      centreY;


    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    // Only count an actual click on Oko,
    // not a click anywhere else in the embed.

    const hitRadius =
      Math.min(
        rect.width,
        rect.height
      ) * 0.42;


    if (
      distance >
      hitRadius
    ) {
      return;
    }


    const time =
      clock.elapsedTime;


    boopStart =
      time;

    boopPulse =
      1;

    noticePulse =
      0;

    earReaction =
      1;

    earReactionStart =
      time;


    // Cancel any idle performance immediately.

    idleAction =
      null;

    nextIdleAction =
      time + 1.2;

  }
);


// ============================================================
// IDLE ACTION CREATION
// ============================================================

function startIdleAction(
  time
) {

  if (
    behaviour !== "idle" ||
    idleAction
  ) {
    return;
  }


  const types = [
    "look",
    "look",
    "shuffle",
    "stretch",
    "weight",
    "curious",
    "listen",
    "bounce",
    "shake",
    "lookDown"
  ];


  const type =
    types[
      Math.floor(
        Math.random() *
        types.length
      )
    ];


  idleAction = {

    type,

    start:
      time,

    duration:
      THREE.MathUtils.randFloat(
        0.8,
        1.5
      ),

    headX: 0,
    headY: 0,
    headZ: 0,

    leftArmX: 0,
    leftArmY: 0,
    leftArmZ: 0,

    rightArmX: 0,
    rightArmY: 0,
    rightArmZ: 0,

    leftLegZ: 0,
    rightLegZ: 0,

    hipZ: 0,

    leftEarX: 0,
    rightEarX: 0,

    bodyY: 0,
    bodyZ: 0

  };


  // ----------------------------------------------------------
  // LOOK AROUND
  // ----------------------------------------------------------

  if (
    type === "look"
  ) {

    idleAction.headY =
      THREE.MathUtils.randFloat(
        -0.16,
        0.16
      );

    idleAction.headX =
      THREE.MathUtils.randFloat(
        -0.045,
        0.035
      );

    idleAction.headZ =
      THREE.MathUtils.randFloat(
        -0.025,
        0.025
      );

  }


  // ----------------------------------------------------------
  // LITTLE ARM SHUFFLE
  // ----------------------------------------------------------

  if (
    type === "shuffle"
  ) {

    idleAction.leftArmZ =
      THREE.MathUtils.randFloat(
        -0.07,
        0.07
      );

    idleAction.rightArmZ =
      THREE.MathUtils.randFloat(
        -0.07,
        0.07
      );


    idleAction.leftArmX =
      THREE.MathUtils.randFloat(
        -0.045,
        0.045
      );

    idleAction.rightArmX =
      THREE.MathUtils.randFloat(
        -0.045,
        0.045
      );

  }


  // ----------------------------------------------------------
  // LITTLE STRETCH
  // ----------------------------------------------------------

  if (
    type === "stretch"
  ) {

    idleAction.leftArmZ =
      THREE.MathUtils.randFloat(
        0.08,
        0.13
      );

    idleAction.rightArmZ =
      THREE.MathUtils.randFloat(
        -0.08,
        -0.13
      );

    idleAction.leftArmX =
      -0.035;

    idleAction.rightArmX =
      -0.035;


    idleAction.headX =
      -0.035;

  }


  // ----------------------------------------------------------
  // WEIGHT SHIFT
  // ----------------------------------------------------------

  if (
    type === "weight"
  ) {

    idleAction.leftLegZ =
      THREE.MathUtils.randFloat(
        0.08,
        0.13
      );

    idleAction.rightLegZ =
      THREE.MathUtils.randFloat(
        -0.08,
        -0.13
      );

    idleAction.hipZ =
      THREE.MathUtils.randFloat(
        0.015,
        0.025
      );

  }


  // ----------------------------------------------------------
  // CURIOUS LEAN
  // ----------------------------------------------------------

  if (
    type === "curious"
  ) {

    idleAction.headY =
      THREE.MathUtils.randFloat(
        -0.12,
        0.12
      );

    idleAction.headZ =
      THREE.MathUtils.randFloat(
        -0.06,
        0.06
      );

    idleAction.headX =
      THREE.MathUtils.randFloat(
        -0.025,
        0.015
      );

    idleAction.hipZ =
      idleAction.headY > 0
        ? -0.025
        : 0.025;

    idleAction.leftLegZ =
      idleAction.headY > 0
        ? -0.035
        : 0.035;

    idleAction.rightLegZ =
      idleAction.headY > 0
        ? 0.035
        : -0.035;

  }


  // ----------------------------------------------------------
  // LISTENING EAR
  // ----------------------------------------------------------

  if (
    type === "listen"
  ) {

    if (
      Math.random() < 0.5
    ) {

      idleAction.leftEarX =
        THREE.MathUtils.randFloat(
          -0.18,
          -0.12
        );

      idleAction.rightEarX =
        THREE.MathUtils.randFloat(
          0.015,
          0.04
        );

    } else {

      idleAction.leftEarX =
        THREE.MathUtils.randFloat(
          0.015,
          0.04
        );

      idleAction.rightEarX =
        THREE.MathUtils.randFloat(
          -0.18,
          -0.12
        );

    }

  }


  // ----------------------------------------------------------
  // LITTLE BOUNCE
  // ----------------------------------------------------------

  if (
    type === "bounce"
  ) {

    idleAction.bodyY =
      THREE.MathUtils.randFloat(
        0.035,
        0.055
      );

    idleAction.headX =
      -0.025;

    idleAction.leftArmX =
      -0.025;

    idleAction.rightArmX =
      -0.025;

  }


  // ----------------------------------------------------------
  // QUICK SHAKE-OFF
  // ----------------------------------------------------------

  if (
    type === "shake"
  ) {

    idleAction.headZ =
      THREE.MathUtils.randFloat(
        -0.16,
        0.16
      );

    idleAction.leftArmZ =
      THREE.MathUtils.randFloat(
        -0.07,
        0.07
      );

    idleAction.rightArmZ =
      THREE.MathUtils.randFloat(
        -0.07,
        0.07
      );

    idleAction.leftLegZ =
      THREE.MathUtils.randFloat(
        -0.04,
        0.04
      );

    idleAction.rightLegZ =
      THREE.MathUtils.randFloat(
        -0.04,
        0.04
      );

  }


  // ----------------------------------------------------------
  // LOOK DOWN
  // ----------------------------------------------------------

  if (
    type === "lookDown"
  ) {

    idleAction.headX =
      THREE.MathUtils.randFloat(
        0.09,
        0.15
      );

    idleAction.headZ =
      THREE.MathUtils.randFloat(
        -0.025,
        0.025
      );

  }

}


// ============================================================
// IDLE ACTION UPDATE
// ============================================================

function updateIdleAction(
  time
) {

  // ----------------------------------------------------------
  // START NEXT ACTION
  // ----------------------------------------------------------

  if (
    behaviour === "idle" &&
    !idleAction &&
    time >
    nextIdleAction
  ) {

    startIdleAction(
      time
    );

  }


  // ----------------------------------------------------------
  // NO ACTION
  // ----------------------------------------------------------

  if (!idleAction) {

    idleHeadX =
      damp(
        idleHeadX,
        0,
        5,
        1 / 60
      );

    idleHeadY =
      damp(
        idleHeadY,
        0,
        5,
        1 / 60
      );

    idleHeadZ =
      damp(
        idleHeadZ,
        0,
        5,
        1 / 60
      );

    idleLeftEarX =
      damp(
        idleLeftEarX,
        0,
        5,
        1 / 60
      );

    idleRightEarX =
      damp(
        idleRightEarX,
        0,
        5,
        1 / 60
      );

    idleBodyY =
      damp(
        idleBodyY,
        0,
        5,
        1 / 60
      );

    idleBodyZ =
      damp(
        idleBodyZ,
        0,
        5,
        1 / 60
      );

    return;

  }


  const elapsed =
    time -
    idleAction.start;


  const rawProgress =
    THREE.MathUtils.clamp(
      elapsed /
        idleAction.duration,
      0,
      1
    );


  // Smooth action envelope

  const actionAmount =
    Math.sin(
      rawProgress *
      Math.PI
    );


  // ----------------------------------------------------------
  // TARGET VALUES
  // ----------------------------------------------------------

  const targetHeadX =
    idleAction.headX *
    actionAmount;

  const targetHeadY =
    idleAction.headY *
    actionAmount;

  const targetHeadZ =
    idleAction.headZ *
    actionAmount;


  const targetLeftArmX =
    idleAction.leftArmX *
    actionAmount;

  const targetLeftArmY =
    idleAction.leftArmY *
    actionAmount;

  const targetLeftArmZ =
    idleAction.leftArmZ *
    actionAmount;


  const targetRightArmX =
    idleAction.rightArmX *
    actionAmount;

  const targetRightArmY =
    idleAction.rightArmY *
    actionAmount;

  const targetRightArmZ =
    idleAction.rightArmZ *
    actionAmount;


  const targetLeftLegZ =
    idleAction.leftLegZ *
    actionAmount;

  const targetRightLegZ =
    idleAction.rightLegZ *
    actionAmount;


  const targetHipZ =
    idleAction.hipZ *
    actionAmount;


  const targetLeftEarX =
    idleAction.leftEarX *
    actionAmount;

  const targetRightEarX =
    idleAction.rightEarX *
    actionAmount;

  const targetBodyY =
    idleAction.bodyY *
    actionAmount;

  const targetBodyZ =
    idleAction.bodyZ *
    actionAmount;


  // ----------------------------------------------------------
  // SMOOTH INTO ACTION
  // ----------------------------------------------------------

  idleHeadX =
    damp(
      idleHeadX,
      targetHeadX,
      12,
      1 / 60
    );

  idleHeadY =
    damp(
      idleHeadY,
      targetHeadY,
      12,
      1 / 60
    );

  idleHeadZ =
    damp(
      idleHeadZ,
      targetHeadZ,
      12,
      1 / 60
    );


  idleLeftArmX =
    damp(
      idleLeftArmX,
      targetLeftArmX,
      12,
      1 / 60
    );

  idleLeftArmY =
    damp(
      idleLeftArmY,
      targetLeftArmY,
      12,
      1 / 60
    );

  idleLeftArmZ =
    damp(
      idleLeftArmZ,
      targetLeftArmZ,
      12,
      1 / 60
    );


  idleRightArmX =
    damp(
      idleRightArmX,
      targetRightArmX,
      12,
      1 / 60
    );

  idleRightArmY =
    damp(
      idleRightArmY,
      targetRightArmY,
      12,
      1 / 60
    );

  idleRightArmZ =
    damp(
      idleRightArmZ,
      targetRightArmZ,
      12,
      1 / 60
    );


  // ----------------------------------------------------------
  // LEGS
  // ----------------------------------------------------------

  idleLeftLegZ =
    damp(
      idleLeftLegZ,
      targetLeftLegZ,
      12,
      1 / 60
    );

  idleRightLegZ =
    damp(
      idleRightLegZ,
      targetRightLegZ,
      12,
      1 / 60
    );


  idleHipZ =
    damp(
      idleHipZ,
      targetHipZ,
      12,
      1 / 60
    );


  idleLeftEarX =
    damp(
      idleLeftEarX,
      targetLeftEarX,
      12,
      1 / 60
    );

  idleRightEarX =
    damp(
      idleRightEarX,
      targetRightEarX,
      12,
      1 / 60
    );

  idleBodyY =
    damp(
      idleBodyY,
      targetBodyY,
      12,
      1 / 60
    );

  idleBodyZ =
    damp(
      idleBodyZ,
      targetBodyZ,
      12,
      1 / 60
    );


  // ----------------------------------------------------------
  // FINISH
  // ----------------------------------------------------------

  if (
    rawProgress >= 1
  ) {

    idleAction =
      null;


    nextIdleAction =
      time +
      THREE.MathUtils.randFloat(
        1.5,
        4.5
      );

  }

}


// ============================================================
// EYE DARTS
// ============================================================

function updateEyeDart(
  time
) {

  if (
    behaviour === "shy"
  ) {
    return;
  }


  if (
    time >
    nextEyeDart
  ) {

    eyeDartStart =
      time;

    eyeDartAmount =
      1;


    eyeDartTargetX =
      THREE.MathUtils.randFloat(
        -0.17,
        0.17
      );

    eyeDartTargetY =
      THREE.MathUtils.randFloat(
        -0.10,
        0.10
      );


    nextEyeDart =
      time +
      THREE.MathUtils.randFloat(
        2.5,
        6
      );

  }


  const progress =
    THREE.MathUtils.clamp(
      (
        time -
        eyeDartStart
      ) /
      eyeDartDuration,
      0,
      1
    );


  let amount;


  if (
    progress < 0.18
  ) {

    amount =
      easeOut(
        progress / 0.18
      );

  } else {

    amount =
      1 -
      easeInOut(
        (
          progress -
          0.18
        ) /
        0.82
      );

  }


  eyeDartX =
    eyeDartTargetX *
    amount *
    eyeDartAmount;

  eyeDartY =
    eyeDartTargetY *
    amount *
    eyeDartAmount;


  if (
    progress >= 1
  ) {

    eyeDartAmount =
      0;

  }

}


// ============================================================
// NERVOUS EYES
// ============================================================

function updateNervousEyes(
  time,
  delta
) {

  if (
    behaviour !== "shy"
  ) {

    nervousEyeX =
      damp(
        nervousEyeX,
        0,
        8,
        delta
      );

    nervousEyeY =
      damp(
        nervousEyeY,
        0,
        8,
        delta
      );

    return;

  }


  // ----------------------------------------------------------
  // NEW NERVOUS GLANCE
  // ----------------------------------------------------------

  if (
    time >
    nextNervousEyeMove
  ) {

    nervousEyeTargetX =
      THREE.MathUtils.randFloat(
        -0.18,
        0.18
      );

    nervousEyeTargetY =
      THREE.MathUtils.randFloat(
        -0.10,
        0.10
      );


    // Occasionally make the glance
    // noticeably sideways.

    if (
      Math.random() <
      0.35
    ) {

      nervousEyeTargetX =
        Math.random() >
        0.5
          ? 0.23
          : -0.23;

    }


    nextNervousEyeMove =
      time +
      THREE.MathUtils.randFloat(
        0.45,
        1.6
      );

  }


  nervousEyeX =
    damp(
      nervousEyeX,
      nervousEyeTargetX,
      18,
      delta
    );

  nervousEyeY =
    damp(
      nervousEyeY,
      nervousEyeTargetY,
      18,
      delta
    );


  // Tiny nervous tremble

  nervousEyeX +=
    Math.sin(
      time * 16
    ) *
    0.009;

  nervousEyeY +=
    Math.sin(
      time * 13 +
      1.2
    ) *
    0.006;

}


// ============================================================
// EARS
// ============================================================

function updateEars(
  time
) {

  if (
    !leftEar ||
    !rightEar
  ) {
    return;
  }


  // ----------------------------------------------------------
  // RANDOM TWITCH TIMING
  // ----------------------------------------------------------

  if (
    time >
    nextLeftEarTwitch
  ) {

    leftEarTwitchStart =
      time;

    earTwitchLeft =
      1;


    nextLeftEarTwitch =
      time +
      THREE.MathUtils.randFloat(
        2.5,
        6
      );

  }


  if (
    time >
    nextRightEarTwitch
  ) {

    rightEarTwitchStart =
      time;

    earTwitchRight =
      1;


    nextRightEarTwitch =
      time +
      THREE.MathUtils.randFloat(
        3,
        7
      );

  }


  // ----------------------------------------------------------
  // TWITCH ENVELOPES
  // ----------------------------------------------------------

  const leftProgress =
    THREE.MathUtils.clamp(
      (
        time -
        leftEarTwitchStart
      ) /
      earTwitchDuration,
      0,
      1
    );


  const rightProgress =
    THREE.MathUtils.clamp(
      (
        time -
        rightEarTwitchStart
      ) /
      earTwitchDuration,
      0,
      1
    );


  let leftTwitch =
    Math.sin(
      leftProgress *
      Math.PI
    ) *
    earTwitchLeft;


  let rightTwitch =
    Math.sin(
      rightProgress *
      Math.PI
    ) *
    earTwitchRight;


  // ----------------------------------------------------------
  // VERY SUBTLE CONSTANT LIFE
  // ----------------------------------------------------------

  const leftSway =
    Math.sin(
      time * 0.80
    ) *
    0.018;


  const rightSway =
    Math.sin(
      time * 0.72 +
      1.8
    ) *
    0.014;


  const leftSwayZ =
    Math.sin(
      time * 0.63 +
      0.5
    ) *
    0.012;


  const rightSwayZ =
    Math.sin(
      time * 0.68 +
      2.2
    ) *
    0.010;


  // ----------------------------------------------------------
  // BASE EAR MOVEMENT
  // ----------------------------------------------------------

  leftEar.rotation.x =
    leftEarBaseRotation.x +
    leftSway +
    leftTwitch * 0.13 +
    idleLeftEarX +
    noticePulse * 0.06 +
    boopPulse * 0.08;


  leftEar.rotation.z =
    leftEarBaseRotation.z +
    leftSwayZ +
    leftTwitch * 0.08;


  rightEar.rotation.x =
    rightEarBaseRotation.x +
    rightSway +
    rightTwitch * 0.11 +
    idleRightEarX +
    noticePulse * 0.05 +
    boopPulse * 0.06;


  rightEar.rotation.z =
    rightEarBaseRotation.z +
    rightSwayZ -
    rightTwitch * 0.07;


  // ----------------------------------------------------------
  // SHY EAR REACTION
  // ----------------------------------------------------------

  const reactionProgress =
    THREE.MathUtils.clamp(
      (
        time -
        earReactionStart
      ) /
      earReactionDuration,
      0,
      1
    );


  let reaction =
    0;


  if (
    reactionProgress < 0.35
  ) {

    reaction =
      easeOut(
        reactionProgress /
        0.35
      );

  } else {

    reaction =
      1 -
      easeInOut(
        (
          reactionProgress -
          0.35
        ) /
        0.65
      );

  }


  reaction *=
    earReaction;


  leftEar.rotation.x +=
    reaction *
    0.24;

  leftEar.rotation.z +=
    reaction *
    0.10;


  rightEar.rotation.x +=
    reaction *
    0.18;

  rightEar.rotation.z -=
    reaction *
    0.14;


  if (
    leftProgress >= 1
  ) {

    earTwitchLeft =
      0;

  }


  if (
    rightProgress >= 1
  ) {

    earTwitchRight =
      0;

  }

}


// ============================================================
// BREATHING
// ============================================================

function updateBreathing(
  time
) {

  if (!oko)
    return;


  // Slow, continuous breathing

  const breath =
    Math.sin(
      time * 1.15
    );


  const inhale =
    (breath + 1) /
    2;


  if (baseOkoScale) {

    const amount =
      inhale *
      0.006;


    oko.scale.x =
      baseOkoScale.x +
      amount;


    oko.scale.y =
      baseOkoScale.y +
      amount * 1.5;


    oko.scale.z =
      baseOkoScale.z +
      amount;

  }


  // Chest / shoulders

  if (
    leftShoulder &&
    rightShoulder
  ) {

    const shoulder =
      breath *
      0.012;


    leftShoulder.rotation.x =
      leftShoulderBaseRotation.x +
      shoulder;


    rightShoulder.rotation.x =
      rightShoulderBaseRotation.x +
      shoulder;

  }

}


// ============================================================
// MAIN ANIMATION
// ============================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  // ----------------------------------------------------------
  // TIME
  // ----------------------------------------------------------

  const delta =
    Math.min(
      clock.getDelta(),
      0.05
    );

  const time =
    clock.elapsedTime;


  // ----------------------------------------------------------
  // STATE
  // ----------------------------------------------------------

  updateShyState(
    delta,
    time
  );


  updateIdleAction(
    time
  );


  // ----------------------------------------------------------
  // EYE TRACKING
  // ----------------------------------------------------------

  // ----------------------------------------------------------
  // CHOOSE EYE TARGET
  // ----------------------------------------------------------

  const pointerIdle =
    time -
    lastPointerMoveTime >
    idleEyeDelay;


  if (
    behaviour !== "shy" &&
    pointerIdle
  ) {

    // After roughly two seconds without pointer
    // movement, stop following the last cursor
    // position and start wandering independently.

    updateIdleEye(
      time,
      delta
    );

    targetEyeX =
      idleEyeX;

    targetEyeY =
      idleEyeY;

  }


  // Smooth but responsive tracking.
  // The target is now based on the embed itself,
  // so this remains consistent at different sizes.

  currentEyeX =
    damp(
      currentEyeX,
      targetEyeX,
      14,
      delta
    );

  currentEyeY =
    damp(
      currentEyeY,
      targetEyeY,
      14,
      delta
    );


  updateEyeDart(
    time
  );


  updateNervousEyes(
    time,
    delta
  );


  if (!oko) {

    renderer.render(
      scene,
      camera
    );

    return;

  }


  // ==========================================================
  // BREATHING
  // ==========================================================

  updateBreathing(
    time
  );


  // ==========================================================
  // HEAD
  // ==========================================================

  if (head) {

    // Mouse tracking

    let headY =
      currentEyeX *
      0.18;

    let headX =
      -currentEyeY *
      0.10;


    // Idle personality

    headY +=
      idleHeadY;

    headX +=
      idleHeadX;

    const idleZ =
      idleHeadZ;


    // Curious response:
    // the head follows the pointer a little more strongly,
    // as if Oko is trying to work out what you are doing.

    headY +=
      currentEyeX *
      curiousAmount *
      0.10;

    headX +=
      -currentEyeY *
      curiousAmount *
      0.04;


    // Shy turn away

    headY +=
      -currentEyeX *
      shyAmount *
      0.16;


    headX +=
      shyAmount *
      0.06;


    // Notice / boop reactions

    const noticeZ =
      noticePulse *
      0.025;

    const boopZ =
      boopPulse *
      -0.055;


    // Startle

    const startleZ =
      shyPulse *
      0.035;


    // Breathing

    const breathing =
      Math.sin(
        time * 1.15
      ) *
      0.004;


    head.rotation.y =
      headBaseRotation.y +
      headY;


    head.rotation.x =
      headBaseRotation.x +
      headX +
      breathing;


    head.rotation.z =
      headBaseRotation.z +
      idleZ +
      startleZ +
      noticeZ +
      boopZ;

  }


  // ==========================================================
  // EYE
  // ==========================================================

  if (
    eyeball &&
    eyeMovementAmount > 0
  ) {

    let eyeX =
      currentEyeX;

    let eyeY =
      currentEyeY;


    // Normal idle dart

    eyeX +=
      eyeDartX *
      0.65;

    eyeY +=
      eyeDartY *
      0.65;


    // --------------------------------------------------------
    // CURIOUS EYES
    // --------------------------------------------------------

    if (
      behaviour === "curious"
    ) {

      eyeX +=
        currentEyeX *
        0.10;

      eyeY +=
        currentEyeY *
        0.08;

    }


    // --------------------------------------------------------
    // SHY EYES
    // --------------------------------------------------------

    if (
      behaviour === "shy"
    ) {

      // Don't stare directly at the cursor.

      eyeX =
        currentEyeX *
        0.42;


      eyeY =
        currentEyeY *
        0.42;


      // Nervous little glances

      eyeX +=
        nervousEyeX;

      eyeY +=
        nervousEyeY;

    }


    // Boop: quick little recoil away from the click.

    if (
      behaviour === "boop"
    ) {

      eyeX +=
        -currentEyeX *
        boopPulse *
        0.18;

      eyeY +=
        -currentEyeY *
        boopPulse *
        0.12;

    }


    eyeball.position.x =
      eyeballBasePosition.x +
      eyeX *
      eyeMovementAmount;


    eyeball.position.y =
      eyeballBasePosition.y -
      eyeY *
      eyeMovementAmount;


    eyeball.position.z =
      eyeballBasePosition.z;

  }


  // ==========================================================
  // EARS
  // ==========================================================

  updateEars(
    time
  );


  // ==========================================================
  // SHOULDERS
  // ==========================================================

  if (
    leftShoulder &&
    rightShoulder
  ) {

    const breathing =
      Math.sin(
        time * 1.15
      ) *
      0.012;


    leftShoulder.rotation.z =
      leftShoulderBaseRotation.z +
      shyAmount *
      0.025;


    rightShoulder.rotation.z =
      rightShoulderBaseRotation.z -
      shyAmount *
      0.025;


    leftShoulder.rotation.x =
      leftShoulderBaseRotation.x +
      breathing;


    rightShoulder.rotation.x =
      rightShoulderBaseRotation.x +
      breathing;

  }


  // ==========================================================
  // ARMS
  // ==========================================================

  if (
    leftArm &&
    rightArm
  ) {

    // Base

    leftArm.rotation.x =
      leftArmBaseRotation.x;

    leftArm.rotation.y =
      leftArmBaseRotation.y;

    leftArm.rotation.z =
      leftArmBaseRotation.z;


    rightArm.rotation.x =
      rightArmBaseRotation.x;

    rightArm.rotation.y =
      rightArmBaseRotation.y;

    rightArm.rotation.z =
      rightArmBaseRotation.z;


    // --------------------------------------------------------
    // IDLE
    // --------------------------------------------------------

    leftArm.rotation.x +=
      idleLeftArmX;

    leftArm.rotation.y +=
      idleLeftArmY;

    leftArm.rotation.z +=
      idleLeftArmZ;


    rightArm.rotation.x +=
      idleRightArmX;

    rightArm.rotation.y +=
      idleRightArmY;

    rightArm.rotation.z +=
      idleRightArmZ;


    // --------------------------------------------------------
    // CURIOUS
    // --------------------------------------------------------

    leftArm.rotation.z +=
      curiousAmount *
      -0.045;

    rightArm.rotation.z +=
      curiousAmount *
      0.045;


    // --------------------------------------------------------
    // SHY
    // --------------------------------------------------------

    leftArm.rotation.z +=
      shyAmount *
      0.16;

    rightArm.rotation.z -=
      shyAmount *
      0.16;


    leftArm.rotation.x +=
      shyAmount *
      0.08;

    rightArm.rotation.x +=
      shyAmount *
      0.08;


    // --------------------------------------------------------
    // STARTLE
    // --------------------------------------------------------

    leftArm.rotation.z +=
      shyPulse *
      0.10;

    rightArm.rotation.z -=
      shyPulse *
      0.10;


    // --------------------------------------------------------
    // NERVOUS FIDGET
    // --------------------------------------------------------

    if (
      behaviour === "shy"
    ) {

      leftArm.rotation.z +=
        Math.sin(
          time * 11.5
        ) *
        0.012 *
        shyAmount;


      rightArm.rotation.z -=
        Math.sin(
          time * 13.2 +
          1.7
        ) *
        0.010 *
        shyAmount;


      leftArm.rotation.x +=
        Math.sin(
          time * 8.5
        ) *
        0.006 *
        shyAmount;


      rightArm.rotation.x +=
        Math.sin(
          time * 9.7 +
          2
        ) *
        0.005 *
        shyAmount;

    }


    // --------------------------------------------------------
    // BREATHING
    // --------------------------------------------------------

    const armBreathing =
      Math.sin(
        time * 1.15
      ) *
      0.006;


    leftArm.rotation.x +=
      armBreathing;

    rightArm.rotation.x +=
      armBreathing;


    // --------------------------------------------------------
    // BOOP
    // --------------------------------------------------------

    // A tiny recoil, deliberately kept small so the arms
    // never try to intersect the body.

    leftArm.rotation.z +=
      boopPulse *
      -0.045;

    rightArm.rotation.z +=
      boopPulse *
      0.045;

    leftArm.rotation.x +=
      boopPulse *
      0.025;

    rightArm.rotation.x +=
      boopPulse *
      0.025;

  }


  // ==========================================================
  // LEGS
  // ==========================================================

  if (
    leftLeg &&
    rightLeg
  ) {

    leftLeg.rotation.x =
      leftLegBaseRotation.x;

    leftLeg.rotation.y =
      leftLegBaseRotation.y;

    leftLeg.rotation.z =
      leftLegBaseRotation.z;


    rightLeg.rotation.x =
      rightLegBaseRotation.x;

    rightLeg.rotation.y =
      rightLegBaseRotation.y;

    rightLeg.rotation.z =
      rightLegBaseRotation.z;


    // --------------------------------------------------------
    // IDLE WEIGHT SHIFT
    // --------------------------------------------------------

    leftLeg.rotation.z +=
      idleLeftLegZ;

    rightLeg.rotation.z +=
      idleRightLegZ;


    // --------------------------------------------------------
    // SHY WEIGHT SHIFT
    // --------------------------------------------------------

    leftLeg.rotation.z +=
      shyAmount *
      0.055;

    rightLeg.rotation.z -=
      shyAmount *
      0.055;


    leftLeg.rotation.x +=
      shyAmount *
      0.035;

    rightLeg.rotation.x +=
      shyAmount *
      0.035;


    // Curious stance.

    leftLeg.rotation.z +=
      curiousAmount *
      -0.018;

    rightLeg.rotation.z +=
      curiousAmount *
      0.018;


    // Tiny boop recoil.

    leftLeg.rotation.x +=
      boopPulse *
      0.018;

    rightLeg.rotation.x +=
      boopPulse *
      0.018;

  }


  // ==========================================================
  // HIPS
  // ==========================================================

  if (
    leftHip &&
    rightHip
  ) {

    leftHip.rotation.z =
      leftHipBaseRotation.z +
      idleHipZ +
      shyAmount *
      0.015;


    rightHip.rotation.z =
      rightHipBaseRotation.z -
      idleHipZ -
      shyAmount *
      0.015;


    leftHip.rotation.z +=
      curiousAmount *
      -0.012;

    rightHip.rotation.z +=
      curiousAmount *
      -0.012;

  }


  // ==========================================================
  // BODY
  // ==========================================================

  if (baseOkoScale) {

    const breath =
      (
        Math.sin(
          time * 1.15
        ) + 1
      ) /
      2 *
      0.006;


    const shySquash =
      shyAmount *
      0.035 +
      shyPulse *
      0.025;


    oko.scale.x =
      baseOkoScale.x +
      breath +
      shySquash *
      0.35;


    oko.scale.y =
      baseOkoScale.y +
      breath *
      1.5 -
      shySquash;


    oko.scale.z =
      baseOkoScale.z +
      breath +
      shySquash *
      0.35;


    // Small interaction squash on a boop.

    const boopSquash =
      boopPulse *
      0.035;

    oko.scale.x -=
      boopSquash;

    oko.scale.y +=
      boopSquash *
      0.65;

    oko.scale.z -=
      boopSquash;

  }


  // ==========================================================
  // BODY POSITION
  // ==========================================================

  if (baseOkoPosition) {

    const awayX =
      -currentEyeX *
      shyAmount *
      0.035;


    const crouch =
      shyAmount *
      -0.025;


    const startle =
      shyPulse *
      -0.015;


    const boopRecoil =
      boopPulse *
      -0.035;


    const breathing =
      Math.sin(
        time * 1.15
      ) *
      0.003;


    oko.position.x =
      baseOkoPosition.x +
      awayX;


    oko.position.y =
      baseOkoPosition.y +
      idleBodyY +
      crouch +
      startle +
      boopRecoil +
      breathing;

  }


  // ==========================================================
  // IDLE BODY LEAN
  // ==========================================================

  if (oko) {

    oko.rotation.z =
      idleBodyZ +
      curiousAmount *
      0.008 +
      boopPulse *
      0.018;

  }


  // ==========================================================
  // RENDER
  // ==========================================================

  renderer.render(
    scene,
    camera
  );

}


// ============================================================
// DAMPING
// ============================================================

function damp(
  current,
  target,
  smoothing,
  delta
) {

  return THREE.MathUtils.lerp(
    current,
    target,
    1 -
      Math.exp(
        -smoothing *
        delta
      )
  );

}


// ============================================================
// EASING
// ============================================================

function easeOut(t) {

  return 1 -
    Math.pow(
      1 - t,
      3
    );

}


function easeInOut(t) {

  return (
    t < 0.5

      ? 2 * t * t

      : 1 -
        Math.pow(
          -2 * t + 2,
          2
        ) / 2
  );

}


// ============================================================
// START
// ============================================================

animate();


// ============================================================
// RESIZE
// ============================================================

function resize() {

  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if (
    width === 0 ||
    height === 0
  ) {
    return;
  }


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height
  );

}


window.addEventListener(
  "resize",
  resize
);

</script>
