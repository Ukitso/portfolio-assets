<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oko Test</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1B1C1C;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ========================================
// SCENE
// ========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x1B1C1C);


// ========================================
// CAMERA
// ========================================

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);


// ========================================
// RENDERER
// ========================================

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);


// ========================================
// LIGHTING
// ========================================

const ambientLight = new THREE.AmbientLight(
  0xffffff,
  2
);

scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

directionalLight.position.set(3, 5, 5);

scene.add(directionalLight);


// ========================================
// OKO VARIABLES
// ========================================

let oko = null;

let eyeballBone = null;
let eyeballMesh = null;


// ========================================
// EYE POSITION
// ========================================

// How far the eyeball can move.

const eyeRangeX = 0.08;
const eyeRangeY = 0.06;


// Starting position of the bone.

const eyeBasePosition = new THREE.Vector3();


// Current and target movement.

let eyeTargetX = 0;
let eyeTargetY = 0;

let eyeCurrentX = 0;
let eyeCurrentY = 0;


// ========================================
// MOUSE
// ========================================

window.addEventListener("mousemove", (event) => {

  const normalizedX =
    (event.clientX - window.innerWidth / 2) /
    (window.innerWidth / 2);

  const normalizedY =
    (event.clientY - window.innerHeight / 2) /
    (window.innerHeight / 2);


  // Horizontal mouse movement
  // controls horizontal eye movement.

  eyeTargetX =
    normalizedX * eyeRangeX;


  // Vertical mouse movement
  // controls vertical eye movement.

  eyeTargetY =
    -normalizedY * eyeRangeY;

});


// ========================================
// LOAD GLB
// ========================================

const loader = new GLTFLoader();

loader.load(

  "./OKO.glb",

  (gltf) => {

    oko = gltf.scene;

    scene.add(oko);


    // ====================================
    // DEBUG
    // ====================================

    console.log("================================");
    console.log("OKO LOADED");
    console.log("================================");

    console.log("------ OBJECTS / BONES ------");


    oko.traverse((object) => {

      console.log(
        object.type,
        object.name
      );

    });


    console.log("-----------------------------");


    // ====================================
    // GET EYEBALL BONE
    // ====================================

    eyeballBone =
      oko.getObjectByName("Eyeball");


    // ====================================
    // GET ACTUAL EYEBALL MESH
    // ====================================

    eyeballMesh =
      oko.getObjectByName("EYEBALL");


    console.log(
      "Eyeball BONE:",
      eyeballBone
    );

    console.log(
      "Eyeball MESH:",
      eyeballMesh
    );


    // ====================================
    // SAVE ORIGINAL POSITION
    // ====================================

    if (eyeballBone) {

      eyeBasePosition.copy(
        eyeballBone.position
      );

    }


    // ====================================
    // CENTRE OKO
    // ====================================

    const box =
      new THREE.Box3().setFromObject(oko);


    const center =
      box.getCenter(
        new THREE.Vector3()
      );


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    console.log(
      "Oko size:",
      size
    );

    console.log(
      "Oko center:",
      center
    );


    oko.position.sub(center);


    // ====================================
    // CAMERA FRAMING
    // ====================================

    const maxDimension =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    const fitHeightDistance =
      maxDimension /
      (
        2 *
        Math.tan(
          THREE.MathUtils.degToRad(
            camera.fov / 2
          )
        )
      );


    const cameraDistance =
      fitHeightDistance * 1.5;


    camera.position.set(
      0,
      0,
      cameraDistance
    );


    camera.lookAt(
      0,
      0,
      0
    );


    console.log(
      "Camera distance:",
      cameraDistance
    );

    console.log("================================");

  },


  // ====================================
  // LOADING PROGRESS
  // ====================================

  (progress) => {

    if (progress.total) {

      const percent =
        (progress.loaded / progress.total) * 100;


      console.log(
        "Loading Oko:",
        percent.toFixed(0) + "%"
      );

    }

  },


  // ====================================
  // ERROR
  // ====================================

  (error) => {

    console.error(
      "COULD NOT LOAD OKO:",
      error
    );

  }

);


// ========================================
// ANIMATION LOOP
// ========================================

function animate() {

  requestAnimationFrame(animate);


  if (eyeballBone) {

    // ------------------------------------
    // SMOOTH MOVEMENT
    // ------------------------------------

    eyeCurrentX +=
      (
        eyeTargetX -
        eyeCurrentX
      ) * 0.08;


    eyeCurrentY +=
      (
        eyeTargetY -
        eyeCurrentY
      ) * 0.08;


    // ------------------------------------
    // MOVE EYEBALL
    // ------------------------------------

    eyeballBone.position.x =
      eyeBasePosition.x +
      eyeCurrentX;


    eyeballBone.position.y =
      eyeBasePosition.y +
      eyeCurrentY;

  }


  renderer.render(
    scene,
    camera
  );

}


// ========================================
// START
// ========================================

animate();


// ========================================
// RESIZE
// ========================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
