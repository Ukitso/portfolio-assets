<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>


  <style>

    html,
    body {

      margin: 0;
      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #1B1C1C;

    }


    #scene {

      width: 100%;
      height: 100%;

    }


    canvas {

      display: block;

    }

  </style>

</head>


<body>


  <div id="scene"></div>


  <script type="module">

    import * as THREE from "three";

    import {
      GLTFLoader
    } from "three/addons/loaders/GLTFLoader.js";


    /* ------------------------- */
    /* SCENE                     */
    /* ------------------------- */

    const container =
      document.getElementById("scene");


    const scene =
      new THREE.Scene();


    /* ------------------------- */
    /* CAMERA                    */
    /* ------------------------- */

    const camera =
      new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

      );


    camera.position.set(

      0,
      0,
      5

    );


    /* ------------------------- */
    /* RENDERER                  */
    /* ------------------------- */

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true

      });


    renderer.setSize(

      window.innerWidth,
      window.innerHeight

    );


    renderer.setPixelRatio(

      Math.min(
        window.devicePixelRatio,
        2
      )

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    container.appendChild(
      renderer.domElement
    );


    /* ------------------------- */
    /* LIGHTS                    */
    /* ------------------------- */

    const ambientLight =
      new THREE.AmbientLight(

        0xffffff,

        1.5

      );


    scene.add(
      ambientLight
    );


    const light =
      new THREE.DirectionalLight(

        0xffffff,

        3

      );


    light.position.set(

      3,
      5,
      5

    );


    scene.add(
      light
    );


    /* ------------------------- */
    /* LOAD OKO                  */
    /* ------------------------- */

    const loader =
      new GLTFLoader();


    loader.load(

      "./OKO.glb",


      (gltf) => {


        console.log(
          "OKO LOADED"
        );


        const oko =
          gltf.scene;


        scene.add(
          oko
        );


        /* --------------------- */
        /* FIND MODEL SIZE       */
        /* --------------------- */

        const box =
          new THREE.Box3()
          .setFromObject(
            oko
          );


        const size =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        /* --------------------- */
        /* CENTRE MODEL          */
        /* --------------------- */

        oko.position.sub(
          center
        );


        /* --------------------- */
        /* FIT CAMERA            */
        /* --------------------- */

        const maxSize =
          Math.max(

            size.x,
            size.y,
            size.z

          );


        const distance =
          maxSize * 1.8;


        camera.position.z =
          distance;


        camera.lookAt(

          0,
          0,
          0

        );


        console.log(
          "MODEL SIZE:",
          size
        );

      },


      undefined,


      (error) => {


        console.error(
          "FAILED TO LOAD OKO:",
          error
        );


      }

    );


    /* ------------------------- */
    /* RESIZE                    */
    /* ------------------------- */

    window.addEventListener(

      "resize",

      () => {


        camera.aspect =

          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,
          window.innerHeight

        );


      }

    );


    /* ------------------------- */
    /* RENDER                    */
    /* ------------------------- */

    function animate() {


      requestAnimationFrame(
        animate
      );


      renderer.render(

        scene,
        camera

      );


    }


    animate();

  </script>


</body>

</html>
