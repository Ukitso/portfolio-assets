<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oko</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #oko-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="oko-container"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// SETUP
// ============================================================

const container = document.getElementById("oko-container");

const scene = new THREE.Scene();


// ============================================================
// CAMERA
// ============================================================

const camera = new THREE.PerspectiveCamera(
  45,
  container.clientWidth / container.clientHeight,
  0.01,
  1000
);


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setClearColor(
  0x000000,
  0
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.NoToneMapping;

renderer.toneMappingExposure = 1.0;

container.appendChild(
  renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    0.45
  );

scene.add(
  ambientLight
);


const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    1.8
  );

directionalLight.position.set(
  4,
  5,
  6
);

scene.add(
  directionalLight
);


const fillLight =
  new THREE.DirectionalLight(
    0xffffff,
    0.15
  );

fillLight.position.set(
  -4,
  2,
  3
);

scene.add(
  fillLight
);


// ============================================================
// MODEL
// ============================================================

const loader =
  new GLTFLoader();

let oko = null;

let eyeball = null;

let eyeballBasePosition =
  new THREE.Vector3();

let eyeMovementAmount = 0;


// ============================================================
// BONES
// ============================================================

let leftEar = null;
let rightEar = null;

let leftArm = null;
let rightArm = null;

let leftShoulder = null;
let rightShoulder = null;

let head = null;


// ============================================================
// BASE ROTATIONS
// ============================================================

let leftEarBaseRotation = null;
let rightEarBaseRotation = null;

let leftArmBaseRotation = null;
let rightArmBaseRotation = null;

let leftShoulderBaseRotation = null;
let rightShoulderBaseRotation = null;

let headBaseRotation = null;


// ============================================================
// LOAD MODEL
// ============================================================

loader.load(

  "./OKO.glb",

  function(gltf) {

    console.log("OKO LOADED");

    oko = gltf.scene;


    // ========================================================
    // HIERARCHY
    // ========================================================

    console.log(
      "========== OKO HIERARCHY =========="
    );

    oko.traverse(function(object) {

      console.log(
        object.type,
        "|",
        object.name || "(unnamed)"
      );

    });

    console.log(
      "========== END HIERARCHY =========="
    );


    // ========================================================
    // FIND OBJECTS + BONES
    // ========================================================

    oko.traverse(function(object) {


      // ------------------------------------------------------
      // EYEBALL
      // ------------------------------------------------------

      if (
        object.name === "EYEBALL"
      ) {

        eyeball = object;

        eyeballBasePosition.copy(
          eyeball.position
        );

        console.log(
          "EYEBALL FOUND"
        );

      }


      // ------------------------------------------------------
      // LEFT EAR
      // ------------------------------------------------------

      if (
        object.isBone &&
        object.name === "left_ear"
      ) {

        leftEar = object;

        leftEarBaseRotation =
          object.rotation.clone();

        console.log(
          "LEFT EAR FOUND"
        );

      }


      // ------------------------------------------------------
      // RIGHT EAR
      // ------------------------------------------------------

      if (
        object.isBone &&
        object.name === "right_ear"
      ) {

        rightEar = object;

        rightEarBaseRotation =
          object.rotation.clone();

        console.log(
          "RIGHT EAR FOUND"
        );

      }


      // ------------------------------------------------------
      // LEFT ARM
      // ------------------------------------------------------

      if (
        object.isBone &&
        object.name === "left_arm"
      ) {

        leftArm = object;

        leftArmBaseRotation =
          object.rotation.clone();

        console.log(
          "LEFT ARM FOUND"
        );

      }


      // ------------------------------------------------------
      // RIGHT ARM
      // ------------------------------------------------------

      if (
        object.isBone &&
        object.name === "right_arm"
      ) {

        rightArm = object;

        rightArmBaseRotation =
          object.rotation.clone();

        console.log(
          "RIGHT ARM FOUND"
        );

      }


      // ------------------------------------------------------
      // LEFT SHOULDER
      // ------------------------------------------------------

      if (
        object.isBone &&
        object.name === "left_shoulder"
      ) {

        leftShoulder = object;

        leftShoulderBaseRotation =
          object.rotation.clone();

      }


      // ------------------------------------------------------
      // RIGHT SHOULDER
      // ------------------------------------------------------

      if (
        object.isBone &&
        object.name === "right_shoulder"
      ) {

        rightShoulder = object;

        rightShoulderBaseRotation =
          object.rotation.clone();

      }


      // ------------------------------------------------------
      // HEAD
      // ------------------------------------------------------

      if (
        object.isBone &&
        object.name === "HEAD"
      ) {

        head = object;

        headBaseRotation =
          object.rotation.clone();

        console.log(
          "HEAD FOUND"
        );

      }

    });


    // ========================================================
    // CENTRE MODEL
    // ========================================================

    const box =
      new THREE.Box3()
        .setFromObject(oko);

    const size =
      box.getSize(
        new THREE.Vector3()
      );

    const center =
      box.getCenter(
        new THREE.Vector3()
      );

    oko.position.sub(
      center
    );

    scene.add(
      oko
    );


    // ========================================================
    // EYE MOVEMENT SCALE
    // ========================================================

    eyeMovementAmount =
      Math.max(
        size.x,
        size.y,
        size.z
      ) * 0.045;


    // ========================================================
    // CAMERA
    // ========================================================

    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );

    const fov =
      THREE.MathUtils.degToRad(
        camera.fov
      );

    let distance =
      (maxSize / 2) /
      Math.tan(fov / 2);

    distance *= 1.35;


    camera.position.set(
      0,
      0,
      distance
    );

    camera.lookAt(
      0,
      0,
      0
    );


    camera.near =
      Math.max(
        0.01,
        distance / 100
      );

    camera.far =
      distance * 100;

    camera.updateProjectionMatrix();

  },

  undefined,

  function(error) {

    console.error(
      "FAILED TO LOAD OKO:",
      error
    );

  }

);


// ============================================================
// EYE TRACKING
// ============================================================

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;

let idle = true;

let idleTimer;


// ============================================================
// RESET IDLE
// ============================================================

function resetIdle() {

  clearTimeout(
    idleTimer
  );

  idle = false;

  idleTimer = setTimeout(
    function() {

      idle = true;

      chooseIdleTarget();

    },
    2500
  );

}


// ============================================================
// IDLE
// ============================================================

function chooseIdleTarget() {

  if (!idle) return;


  targetX =
    THREE.MathUtils.randFloat(
      -0.45,
      0.45
    );

  targetY =
    THREE.MathUtils.randFloat(
      -0.3,
      0.3
    );


  setTimeout(
    function() {

      if (idle) {
        chooseIdleTarget();
      }

    },
    THREE.MathUtils.randFloat(
      1000,
      2500
    )
  );

}


// ============================================================
// MOUSE
// ============================================================

document.addEventListener(
  "mousemove",
  function(e) {

    resetIdle();


    const mouseX =
      (
        e.clientX /
        window.innerWidth
      ) * 2 - 1;


    const mouseY =
      (
        e.clientY /
        window.innerHeight
      ) * 2 - 1;


    targetX =
      mouseX * 0.45;

    targetY =
      mouseY * 0.30;

  }
);


// ============================================================
// ANIMATION
// ============================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  const time =
    performance.now() * 0.001;


  // ==========================================================
  // EYE
  // ==========================================================

  currentX +=
    (
      targetX -
      currentX
    ) * 0.08;


  currentY +=
    (
      targetY -
      currentY
    ) * 0.08;


  if (
    eyeball &&
    eyeMovementAmount > 0
  ) {

    eyeball.position.x =
      eyeballBasePosition.x
      + currentX * eyeMovementAmount;


    eyeball.position.y =
      eyeballBasePosition.y
      - currentY * eyeMovementAmount;


    eyeball.position.z =
      eyeballBasePosition.z;

  }


  // ==========================================================
  // EARS
  // ==========================================================

  if (
    leftEar &&
    leftEarBaseRotation
  ) {

    leftEar.rotation.x =
      leftEarBaseRotation.x
      + Math.sin(
        time * 1.25
      ) * 0.12;


    leftEar.rotation.z =
      leftEarBaseRotation.z
      + Math.sin(
        time * 0.9
      ) * 0.15;

  }


  if (
    rightEar &&
    rightEarBaseRotation
  ) {

    rightEar.rotation.x =
      rightEarBaseRotation.x
      + Math.sin(
        time * 1.1 + 1.4
      ) * 0.12;


    rightEar.rotation.z =
      rightEarBaseRotation.z
      + Math.sin(
        time * 0.85 + 1.2
      ) * 0.15;

  }


  // ==========================================================
  // ARMS
  // ==========================================================

  if (
    leftArm &&
    leftArmBaseRotation
  ) {

    // Side-to-side movement
    leftArm.rotation.z =
      leftArmBaseRotation.z
      + Math.sin(
        time * 0.8
      ) * 0.07;


    // Forward/back movement
    leftArm.rotation.x =
      leftArmBaseRotation.x
      + Math.sin(
        time * 0.65 + 0.7
      ) * 0.045;


    // Slight 3D twist
    leftArm.rotation.y =
      leftArmBaseRotation.y
      + Math.sin(
        time * 0.55
      ) * 0.035;

  }


  if (
    rightArm &&
    rightArmBaseRotation
  ) {

    // Opposite side-to-side movement
    rightArm.rotation.z =
      rightArmBaseRotation.z
      - Math.sin(
        time * 0.8
      ) * 0.07;


    // Slightly different phase
    rightArm.rotation.x =
      rightArmBaseRotation.x
      - Math.sin(
        time * 0.65 + 0.7
      ) * 0.045;


    // 3D twist
    rightArm.rotation.y =
      rightArmBaseRotation.y
      - Math.sin(
        time * 0.55
      ) * 0.035;

  }


  // ==========================================================
  // SHOULDERS
  // ==========================================================

  // Very restrained shoulder movement.
  // Most of the animation comes from the arms.

  if (
    leftShoulder &&
    leftShoulderBaseRotation
  ) {

    leftShoulder.rotation.z =
      leftShoulderBaseRotation.z
      + Math.sin(
        time * 0.8
      ) * 0.012;

  }


  if (
    rightShoulder &&
    rightShoulderBaseRotation
  ) {

    rightShoulder.rotation.z =
      rightShoulderBaseRotation.z
      - Math.sin(
        time * 0.8
      ) * 0.012;

  }


  // ==========================================================
  // HEAD
  // ==========================================================

  if (
    head &&
    headBaseRotation
  ) {

    // Turn toward the direction of the mouse.
    //
    // Very small for the first test because we need
    // to establish which local axes correspond to
    // natural head movement on this rig.

    head.rotation.y =
      headBaseRotation.y
      + currentX * 0.18;


    head.rotation.x =
      headBaseRotation.x
      - currentY * 0.10;


    // Tiny natural head sway
    head.rotation.z =
      headBaseRotation.z
      + Math.sin(
        time * 0.45
      ) * 0.008;

  }


  // ==========================================================
  // RENDER
  // ==========================================================

  renderer.render(
    scene,
    camera
  );

}


// ============================================================
// RESIZE
// ============================================================

function resize() {

  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if (
    width === 0 ||
    height === 0
  ) {
    return;
  }


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height
  );

}


window.addEventListener(
  "resize",
  resize
);


// ============================================================
// START
// ============================================================

resize();

animate();

chooseIdleTarget();

</script>

</body>
</html>
