<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #kkzywz {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="kkzywz"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// SETUP
// ============================================================

const container = document.getElementById("kkzywz");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  container.clientWidth / container.clientHeight,
  0.01,
  1000
);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setClearColor(0x000000, 0);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.0;

container.appendChild(renderer.domElement);


// ============================================================
// LIGHTING
// ============================================================

const ambientLight = new THREE.AmbientLight(
  0xffffff,
  0.45
);

scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(
  0xffffff,
  1.8
);

directionalLight.position.set(4, 5, 6);

scene.add(directionalLight);


const fillLight = new THREE.DirectionalLight(
  0xffffff,
  0.15
);

fillLight.position.set(-4, 2, 3);

scene.add(fillLight);


// ============================================================
// CLOCK
// ============================================================

const clock = new THREE.Clock();


// ============================================================
// MODEL / RIG
// ============================================================

let oko = null;

let leftEar = null;
let rightEar = null;

let leftShoulder = null;
let leftArm = null;

let rightShoulder = null;
let rightArm = null;

let leftHip = null;
let leftLeg = null;

let rightHip = null;
let rightLeg = null;

let head = null;
let eyeBone = null;
let eyeMesh = null;


// ============================================================
// EYE VARIABLES
// ============================================================

let eyeMovementAmount = 0;

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;

let currentEyeX = 0;
let currentEyeY = 0;


// Head follows the eye slightly behind it.
// This makes the eye lead and the head subtly react.
let headEyeX = 0;
let headEyeY = 0;


// ============================================================
// MOUSE
// ============================================================

let mouseTargetX = 0;
let mouseTargetY = 0;

let lastMouseMoveTime = 0;

let mouseInside = false;


// Mouse movement
document.addEventListener("mousemove", (event) => {

  const mouseX =
    (event.clientX / window.innerWidth) * 2 - 1;

  const mouseY =
    (event.clientY / window.innerHeight) * 2 - 1;

  mouseTargetX = mouseX * 0.45;
  mouseTargetY = mouseY * 0.30;

  lastMouseMoveTime = clock.elapsedTime;

  mouseInside = true;
});


// ============================================================
// HELPERS
// ============================================================

function damp(current, target, speed, delta) {

  return THREE.MathUtils.damp(
    current,
    target,
    speed,
    delta
  );

}


function clamp(value, min, max) {

  return Math.max(
    min,
    Math.min(max, value)
  );

}


function easeOut(t) {

  t = clamp(t, 0, 1);

  return 1 - Math.pow(1 - t, 3);

}


// ============================================================
// LOAD MODEL
// ============================================================

const loader = new GLTFLoader();

loader.load(
  "./OKO.glb",

  function(gltf) {

    console.log("OKO LOADED");

    oko = gltf.scene;


    // ----------------------------------------------------------
    // FIND BONES / MESHES
    // ----------------------------------------------------------

    oko.traverse((object) => {

      if (object.name === "left_ear")
        leftEar = object;

      if (object.name === "right_ear")
        rightEar = object;

      if (object.name === "left_shoulder")
        leftShoulder = object;

      if (object.name === "left_arm")
        leftArm = object;

      if (object.name === "right_shoulder")
        rightShoulder = object;

      if (object.name === "right_arm")
        rightArm = object;

      if (object.name === "left_hip_bone")
        leftHip = object;

      if (object.name === "left_leg")
        leftLeg = object;

      if (object.name === "right_hip_bone")
        rightHip = object;

      if (object.name === "right_leg")
        rightLeg = object;

      if (object.name === "HEAD")
        head = object;

      if (object.name === "Eyeball")
        eyeBone = object;

      if (object.name === "EYEBALL")
        eyeMesh = object;

    });


    // ----------------------------------------------------------
    // CENTRE MODEL
    // ----------------------------------------------------------

    const box =
      new THREE.Box3().setFromObject(oko);

    const size =
      box.getSize(new THREE.Vector3());

    const center =
      box.getCenter(new THREE.Vector3());

    oko.position.sub(center);

    scene.add(oko);


    // ----------------------------------------------------------
    // CAMERA
    // ----------------------------------------------------------

    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );

    const fov =
      THREE.MathUtils.degToRad(
        camera.fov
      );

    let distance =
      (maxSize / 2) /
      Math.tan(fov / 2);

    distance *= 1.35;

    camera.position.set(
      0,
      0,
      distance
    );

    camera.lookAt(
      0,
      0,
      0
    );

    camera.near =
      Math.max(
        0.01,
        distance / 100
      );

    camera.far =
      distance * 100;

    camera.updateProjectionMatrix();


    // ----------------------------------------------------------
    // EYE MOVEMENT
    // ----------------------------------------------------------

    eyeMovementAmount =
      Math.max(
        size.x,
        size.y,
        size.z
      ) * 0.045;


    console.log("Bones found:", {
      leftEar,
      rightEar,
      leftShoulder,
      leftArm,
      rightShoulder,
      rightArm,
      leftHip,
      leftLeg,
      rightHip,
      rightLeg,
      head,
      eyeBone,
      eyeMesh
    });

  },

  undefined,

  function(error) {

    console.error(
      "ERROR LOADING OKO:",
      error
    );

  }
);


// ============================================================
// IDLE EYE WANDER
// ============================================================

let eyeIdleX = 0;
let eyeIdleY = 0;

let eyeIdleTargetX = 0;
let eyeIdleTargetY = 0;

let nextEyeIdleMove = 2.0;


// How long the mouse has to be still
// before Oko starts looking around.
const mouseIdleDelay = 2.0;


function updateIdleEye(time, delta) {

  const mouseIsIdle =
    time - lastMouseMoveTime >
    mouseIdleDelay;


  // ----------------------------------------------------------
  // MOUSE ACTIVE
  // ----------------------------------------------------------

  if (!mouseIsIdle) {

    eyeIdleTargetX = 0;
    eyeIdleTargetY = 0;

    eyeIdleX =
      damp(
        eyeIdleX,
        0,
        4,
        delta
      );

    eyeIdleY =
      damp(
        eyeIdleY,
        0,
        4,
        delta
      );

    return;

  }


  // ----------------------------------------------------------
  // CHOOSE A NEW PLACE TO LOOK
  // ----------------------------------------------------------

  if (time > nextEyeIdleMove) {

    const directions = [
      [-1, 0.35],
      [-0.8, 0.8],
      [0.9, 0.2],
      [0.7, -0.55],
      [-0.6, -0.65],
      [0.1, 0.75],
      [0.15, -0.65]
    ];

    const choice =
      directions[
        Math.floor(
          Math.random() *
          directions.length
        )
      ];


    eyeIdleTargetX =
      choice[0] *
      eyeMovementAmount *
      0.9;

    eyeIdleTargetY =
      choice[1] *
      eyeMovementAmount *
      0.75;


    // Sometimes settle for longer,
    // sometimes look around again quickly.
    nextEyeIdleMove =
      time +
      THREE.MathUtils.randFloat(
        1.2,
        2.8
      );

  }


  eyeIdleX =
    damp(
      eyeIdleX,
      eyeIdleTargetX,
      3.5,
      delta
    );

  eyeIdleY =
    damp(
      eyeIdleY,
      eyeIdleTargetY,
      3.5,
      delta
    );

}


// ============================================================
// SHY STATE
// ============================================================

let behaviour = "normal";

let shyAmount = 0;

let shyArmStart = -10;

let nervousEyeX = 0;
let nervousEyeY = 0;

let nextNervousEye = 0;


// ============================================================
// SHY ENTER / EXIT
// ============================================================

function enterShy(time) {

  if (behaviour === "shy")
    return;

  behaviour = "shy";

  shyArmStart = time;

  nextNervousEye =
    time + 0.05;

}


function exitShy(time) {

  if (behaviour !== "shy")
    return;

  behaviour = "normal";

}


// ============================================================
// SHY NERVOUS EYE
// ============================================================

function updateNervousEye(time) {

  if (behaviour !== "shy") {

    nervousEyeX *= 0.85;
    nervousEyeY *= 0.85;

    return;

  }


  if (time > nextNervousEye) {

    const directions = [
      [-1, 0.2],
      [0.9, 0.15],
      [-0.7, 0.7],
      [0.65, -0.5],
      [0.2, 0.75],
      [-0.3, -0.7]
    ];

    const choice =
      directions[
        Math.floor(
          Math.random() *
          directions.length
        )
      ];


    nervousEyeX =
      choice[0] *
      eyeMovementAmount *
      0.48;

    nervousEyeY =
      choice[1] *
      eyeMovementAmount *
      0.40;


    // Nervous darting happens quite quickly.
    nextNervousEye =
      time +
      THREE.MathUtils.randFloat(
        0.18,
        0.48
      );

  }

}


// ============================================================
// EARS
// ============================================================

let earReactionStart = -10;

function updateEars(time, delta) {

  if (!leftEar || !rightEar)
    return;


  // ----------------------------------------------------------
  // VERY SUBTLE CONSTANT IDLE MOVEMENT
  // ----------------------------------------------------------

  const leftSway =
    Math.sin(time * 0.80) *
    0.018;

  const rightSway =
    Math.sin(time * 0.72 + 1.8) *
    0.014;

  const leftSwayZ =
    Math.sin(time * 0.63 + 0.5) *
    0.012;

  const rightSwayZ =
    Math.sin(time * 0.68 + 2.2) *
    0.010;


  // ----------------------------------------------------------
  // OCCASIONAL EAR TWITCH
  // ----------------------------------------------------------

  let reaction = 0;

  const reactionTime =
    time - earReactionStart;

  if (
    reactionTime >= 0 &&
    reactionTime < 0.32
  ) {

    const progress =
      reactionTime / 0.32;

    reaction =
      Math.sin(
        progress * Math.PI
      );

  }


  leftEar.rotation.z =
    leftSway +
    reaction * 0.10;

  rightEar.rotation.z =
    rightSway -
    reaction * 0.075;


  leftEar.rotation.x =
    leftSwayZ;

  rightEar.rotation.x =
    rightSwayZ;


  // Small shy reaction
  if (behaviour === "shy") {

    leftEar.rotation.z +=
      Math.sin(time * 11) *
      0.025;

    rightEar.rotation.z +=
      Math.sin(time * 13 + 1) *
      0.020;

  }

}


// ============================================================
// IDLE BODY ACTIONS
// ============================================================

let idleAction = null;

let nextIdleAction = 3.5;


function chooseIdleAction(time) {

  const actions = [
    "look",
    "look",
    "ear",
    "body"
  ];

  idleAction =
    actions[
      Math.floor(
        Math.random() *
        actions.length
      )
    ];


  nextIdleAction =
    time +
    THREE.MathUtils.randFloat(
      3.0,
      6.0
    );

}


function updateIdleAction(time, delta) {

  if (
    behaviour !== "normal"
  ) {

    idleAction = null;

    return;

  }


  if (time > nextIdleAction) {

    chooseIdleAction(time);

  }

}


// ============================================================
// ANIMATION
// ============================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  const delta =
    Math.min(
      clock.getDelta(),
      0.05
    );

  const time =
    clock.elapsedTime;


  if (!oko) {

    renderer.render(
      scene,
      camera
    );

    return;

  }


  // ==========================================================
  // MOUSE / SHY DETECTION
  // ==========================================================

  const mouseIsIdle =
    time - lastMouseMoveTime >
    mouseIdleDelay;


  // If mouse is moving, Oko becomes shy.
  // This is intentionally based on the cursor being near
  // the character's interactive area.
  //
  // If your Readymag embed sends mouse movement normally,
  // this will trigger when the cursor is over the page.
  //
  // To avoid making the whole page shy, the container check
  // below can be used instead.

  const rect =
    container.getBoundingClientRect();

  const mouseOverCharacter =
    mouseInside &&
    lastMouseMoveTime > 0 &&
    true;


  // ----------------------------------------------------------
  // SHY WHEN MOUSE IS CLOSE / ACTIVE
  // ----------------------------------------------------------

  if (
    mouseOverCharacter &&
    !mouseIsIdle
  ) {

    enterShy(time);

  } else {

    exitShy(time);

  }


  // ==========================================================
  // EYE
  // ==========================================================

  updateIdleEye(
    time,
    delta
  );

  updateNervousEye(
    time
  );


  let eyeTargetX = 0;
  let eyeTargetY = 0;


  if (behaviour === "shy") {

    // Mouse direction + nervous darting.
    eyeTargetX =
      mouseTargetX * 0.42 +
      nervousEyeX;

    eyeTargetY =
      mouseTargetY * 0.42 +
      nervousEyeY;

  }

  else if (mouseIsIdle) {

    // Eye wanders independently.
    eyeTargetX =
      eyeIdleX;

    eyeTargetY =
      eyeIdleY;

  }

  else {

    // Follow cursor.
    eyeTargetX =
      mouseTargetX *
      eyeMovementAmount;

    eyeTargetY =
      mouseTargetY *
      eyeMovementAmount;

  }


  // ----------------------------------------------------------
  // SMOOTH EYE
  // ----------------------------------------------------------

  currentEyeX =
    damp(
      currentEyeX,
      eyeTargetX,
      behaviour === "shy"
        ? 12
        : 8,
      delta
    );

  currentEyeY =
    damp(
      currentEyeY,
      eyeTargetY,
      behaviour === "shy"
        ? 12
        : 8,
      delta
    );


  // ==========================================================
  // HEAD FOLLOWS EYE
  // ==========================================================

  headEyeX =
    damp(
      headEyeX,
      currentEyeX,
      4.5,
      delta
    );

  headEyeY =
    damp(
      headEyeY,
      currentEyeY,
      4.5,
      delta
    );


  // ==========================================================
  // EYE BONE
  // ==========================================================

  if (eyeBone) {

    eyeBone.rotation.y =
      currentEyeX;

    eyeBone.rotation.x =
      -currentEyeY;

  }


  // ==========================================================
  // HEAD
  // ==========================================================

  if (head) {

    // Eye leads.
    // Head follows more subtly.

    head.rotation.y =
      headEyeX * 0.18;

    head.rotation.x =
      -headEyeY * 0.10;


    // Slight shy tuck.
    if (behaviour === "shy") {

      head.rotation.x +=
        0.045;

    }

  }


  // ==========================================================
  // SHY ARM ANIMATION
  // ==========================================================

  let targetShyAmount =
    behaviour === "shy"
      ? 1
      : 0;


  shyAmount =
    damp(
      shyAmount,
      targetShyAmount,
      behaviour === "shy"
        ? 12
        : 7,
      delta
    );


  if (
    leftArm &&
    rightArm
  ) {

    const shyElapsed =
      time - shyArmStart;


    // --------------------------------------------------------
    // STARTLE
    // --------------------------------------------------------

    let startle = 0;

    if (
      behaviour === "shy" &&
      shyElapsed >= 0 &&
      shyElapsed < 0.28
    ) {

      const progress =
        shyElapsed / 0.28;

      startle =
        Math.sin(
          progress * Math.PI
        );

    }


    // --------------------------------------------------------
    // FACE COVER
    // --------------------------------------------------------

    let cover = 0;

    if (behaviour === "shy") {

      if (shyElapsed < 0.20) {

        cover = 0;

      }

      else if (
        shyElapsed >= 0.20 &&
        shyElapsed < 0.65
      ) {

        const progress =
          (shyElapsed - 0.20) /
          0.45;

        cover =
          easeOut(progress);

      }

      else {

        cover = 1;

      }

    }


    // --------------------------------------------------------
    // BASE ARM POSITION
    // --------------------------------------------------------

    const leftBaseZ = 0;
    const rightBaseZ = 0;


    // Arms shoot outward/upward first,
    // then swing inward toward the face.

    leftArm.rotation.z =
      leftBaseZ
      - cover * 0.24
      - startle * 0.28;

    rightArm.rotation.z =
      rightBaseZ
      + cover * 0.24
      + startle * 0.28;


    leftArm.rotation.x =
      -cover * 0.18
      -startle * 0.10;

    rightArm.rotation.x =
      -cover * 0.18
      -startle * 0.10;


    // Tiny nervous movement while hiding.
    if (
      behaviour === "shy" &&
      cover > 0.8
    ) {

      const nervousWiggle =
        Math.sin(
          time * 15
        ) * 0.035;

      leftArm.rotation.z +=
        nervousWiggle;

      rightArm.rotation.z -=
        nervousWiggle;

    }

  }


  // ==========================================================
  // SHOULDERS
  // ==========================================================

  if (
    leftShoulder &&
    rightShoulder
  ) {

    leftShoulder.rotation.z =
      -shyAmount * 0.10;

    rightShoulder.rotation.z =
      shyAmount * 0.10;


    // Little shoulder raise when shy.
    leftShoulder.rotation.x =
      -shyAmount * 0.08;

    rightShoulder.rotation.x =
      -shyAmount * 0.08;

  }


  // ==========================================================
  // LEGS
  // ==========================================================

  if (
    leftLeg &&
    rightLeg
  ) {

    // Subtle creature-like weight shift.
    const legShift =
      Math.sin(time * 1.1) *
      0.025;

    leftLeg.rotation.z =
      legShift;

    rightLeg.rotation.z =
      -legShift;

  }


  // ==========================================================
  // HIPS
  // ==========================================================

  if (
    leftHip &&
    rightHip
  ) {

    const hipShift =
      Math.sin(time * 0.9) *
      0.018;

    leftHip.rotation.z =
      hipShift;

    rightHip.rotation.z =
      -hipShift;

  }


  // ==========================================================
  // EARS
  // ==========================================================

  updateEars(
    time,
    delta
  );


  // ==========================================================
  // IDLE ACTIONS
  // ==========================================================

  updateIdleAction(
    time,
    delta
  );


  // ==========================================================
  // RENDER
  // ==========================================================

  renderer.render(
    scene,
    camera
  );

}


// ============================================================
// RESIZE
// ============================================================

function resize() {

  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if (
    width === 0 ||
    height === 0
  ) {

    return;

  }


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height
  );

}


window.addEventListener(
  "resize",
  resize
);


// ============================================================
// START
// ============================================================

resize();

animate();

</script>

</body>
</html>
