<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #kkzywz {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="kkzywz"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// SETUP
// ============================================================

const container =
  document.getElementById("kkzywz");

const scene =
  new THREE.Scene();


// ============================================================
// CAMERA
// ============================================================

const camera =
  new THREE.PerspectiveCamera(
    45,
    container.clientWidth /
      container.clientHeight,
    0.01,
    1000
  );


// ============================================================
// RENDERER
// ============================================================

const renderer =
  new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setClearColor(
  0x000000,
  0
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.NoToneMapping;

renderer.toneMappingExposure =
  1.0;

container.appendChild(
  renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    0.45
  );

scene.add(
  ambientLight
);


const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    1.8
  );

directionalLight.position.set(
  4,
  5,
  6
);

scene.add(
  directionalLight
);


const fillLight =
  new THREE.DirectionalLight(
    0xffffff,
    0.15
  );

fillLight.position.set(
  -4,
  2,
  3
);

scene.add(
  fillLight
);


// ============================================================
// MODEL
// ============================================================

const loader =
  new GLTFLoader();

let oko;


// ============================================================
// BONES
// ============================================================

let leftEar;
let rightEar;

let leftShoulder;
let rightShoulder;

let leftArm;
let rightArm;

let leftHip;
let rightHip;

let leftLeg;
let rightLeg;

let head;
let eyeball;


// ============================================================
// BASE TRANSFORMS
// ============================================================

let leftEarBaseRotation;
let rightEarBaseRotation;

let leftShoulderBaseRotation;
let rightShoulderBaseRotation;

let leftArmBaseRotation;
let rightArmBaseRotation;

let leftHipBaseRotation;
let rightHipBaseRotation;

let leftLegBaseRotation;
let rightLegBaseRotation;

let headBaseRotation;

let eyeballBasePosition;

let baseOkoPosition;
let baseOkoScale;


// ============================================================
// CLOCK
// ============================================================

const clock =
  new THREE.Clock();


// ============================================================
// POINTER
// ============================================================

let pointerScreenX = 0;
let pointerScreenY = 0;

let pointerMoved = false;

let lastMouseMoveTime = 0;

const mouseIdleDelay =
  2.0;


// ============================================================
// MOUSE TARGET
// ============================================================

let mouseTargetX = 0;
let mouseTargetY = 0;

let currentEyeX = 0;
let currentEyeY = 0;


// ============================================================
// EYE TARGET
// ============================================================

// The actual target the eyeball moves toward.
// This can be mouse-controlled OR idle-controlled.

let eyeTargetX = 0;
let eyeTargetY = 0;


// ============================================================
// EYE IDLE WANDER
// ============================================================

let eyeIdleX = 0;
let eyeIdleY = 0;

let eyeIdleTargetX = 0;
let eyeIdleTargetY = 0;

let nextEyeIdleMove = 2.0;

let eyeIdleHold = 0;


// ============================================================
// BEHAVIOUR
// ============================================================

let behaviour =
  "idle";

let shyAmount = 0;

let shyPulse = 0;

let wasNear = false;


// ============================================================
// IDLE BODY ACTION
// ============================================================

let idleAction = null;

let nextIdleAction = 3;


// ============================================================
// IDLE BODY TARGETS
// ============================================================

let idleHeadX = 0;
let idleHeadY = 0;
let idleHeadZ = 0;

let idleLeftArmX = 0;
let idleLeftArmY = 0;
let idleLeftArmZ = 0;

let idleRightArmX = 0;
let idleRightArmY = 0;
let idleRightArmZ = 0;

let idleLeftLegZ = 0;
let idleRightLegZ = 0;

let idleHipZ = 0;


// ============================================================
// NERVOUS EYES
// ============================================================

let nervousEyeX = 0;
let nervousEyeY = 0;

let nervousEyeTargetX = 0;
let nervousEyeTargetY = 0;

let nextNervousEyeMove = 0;


// ============================================================
// EARS
// ============================================================

let earReaction = 0;

let earReactionStart = -10;

const earReactionDuration =
  0.42;


// Random ear twitches

let earTwitchLeft = 0;
let earTwitchRight = 0;

let nextLeftEarTwitch = 2.5;
let nextRightEarTwitch = 4;

let leftEarTwitchStart = -10;
let rightEarTwitchStart = -10;

const earTwitchDuration =
  0.28;


// ============================================================
// SHY ARM REACTION
// ============================================================

// Short burst when Oko first notices the cursor.

let shyArmStart =
  -10;

const shyArmDuration =
  0.35;


// ============================================================
// EASING
// ============================================================

function damp(
  current,
  target,
  smoothing,
  delta
) {

  return THREE.MathUtils.lerp(
    current,
    target,
    1 -
      Math.exp(
        -smoothing *
        delta
      )
  );

}


function easeOut(t) {

  return 1 -
    Math.pow(
      1 - t,
      3
    );

}


function easeInOut(t) {

  return (
    t < 0.5

      ? 2 * t * t

      : 1 -
        Math.pow(
          -2 * t + 2,
          2
        ) / 2
  );

}


// ============================================================
// LOAD MODEL
// ============================================================

loader.load(
  "./OKO.glb",

  function(gltf) {

    console.log(
      "OKO LOADED"
    );

    oko =
      gltf.scene;


    // --------------------------------------------------------
    // CENTER MODEL
    // --------------------------------------------------------

    const box =
      new THREE.Box3()
        .setFromObject(
          oko
        );

    const size =
      box.getSize(
        new THREE.Vector3()
      );

    const center =
      box.getCenter(
        new THREE.Vector3()
      );

    oko.position.sub(
      center
    );

    scene.add(
      oko
    );


    // --------------------------------------------------------
    // BASE
    // --------------------------------------------------------

    baseOkoPosition =
      oko.position.clone();

    baseOkoScale =
      oko.scale.clone();


    // --------------------------------------------------------
    // BONES
    // --------------------------------------------------------

    leftEar =
      oko.getObjectByName(
        "left_ear"
      );

    rightEar =
      oko.getObjectByName(
        "right_ear"
      );


    leftShoulder =
      oko.getObjectByName(
        "left_shoulder"
      );

    rightShoulder =
      oko.getObjectByName(
        "right_shoulder"
      );


    leftArm =
      oko.getObjectByName(
        "left_arm"
      );

    rightArm =
      oko.getObjectByName(
        "right_arm"
      );


    leftHip =
      oko.getObjectByName(
        "left_hip_bone"
      );

    rightHip =
      oko.getObjectByName(
        "right_hip_bone"
      );


    leftLeg =
      oko.getObjectByName(
        "left_leg"
      );

    rightLeg =
      oko.getObjectByName(
        "right_leg"
      );


    head =
      oko.getObjectByName(
        "HEAD"
      );

    eyeball =
      oko.getObjectByName(
        "Eyeball"
      );


    // --------------------------------------------------------
    // BASE ROTATIONS
    // --------------------------------------------------------

    if (leftEar)
      leftEarBaseRotation =
        leftEar.rotation.clone();

    if (rightEar)
      rightEarBaseRotation =
        rightEar.rotation.clone();


    if (leftShoulder)
      leftShoulderBaseRotation =
        leftShoulder.rotation.clone();

    if (rightShoulder)
      rightShoulderBaseRotation =
        rightShoulder.rotation.clone();


    if (leftArm)
      leftArmBaseRotation =
        leftArm.rotation.clone();

    if (rightArm)
      rightArmBaseRotation =
        rightArm.rotation.clone();


    if (leftHip)
      leftHipBaseRotation =
        leftHip.rotation.clone();

    if (rightHip)
      rightHipBaseRotation =
        rightHip.rotation.clone();


    if (leftLeg)
      leftLegBaseRotation =
        leftLeg.rotation.clone();

    if (rightLeg)
      rightLegBaseRotation =
        rightLeg.rotation.clone();


    if (head)
      headBaseRotation =
        head.rotation.clone();


    if (eyeball)
      eyeballBasePosition =
        eyeball.position.clone();


    // --------------------------------------------------------
    // EYE RANGE
    // --------------------------------------------------------

    eyeMovementAmount =
      Math.max(
        size.x,
        size.y,
        size.z
      ) * 0.045;


    // --------------------------------------------------------
    // CAMERA
    // --------------------------------------------------------

    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );

    const fov =
      THREE.MathUtils.degToRad(
        camera.fov
      );

    let distance =
      (maxSize / 2) /
      Math.tan(
        fov / 2
      );

    distance *=
      1.35;


    camera.position.set(
      0,
      0,
      distance
    );

    camera.lookAt(
      0,
      0,
      0
    );

    camera.near =
      Math.max(
        0.01,
        distance / 100
      );

    camera.far =
      distance * 100;

    camera.updateProjectionMatrix();

  },

  undefined,

  function(error) {

    console.error(
      "ERROR LOADING OKO:",
      error
    );

  }
);


// ============================================================
// MOUSE
// ============================================================

document.addEventListener(
  "mousemove",
  function(e) {

    pointerScreenX =
      e.clientX;

    pointerScreenY =
      e.clientY;

    pointerMoved =
      true;


    lastMouseMoveTime =
      clock.getElapsedTime();


    const mouseX =
      (e.clientX /
        window.innerWidth) *
      2 - 1;

    const mouseY =
      (e.clientY /
        window.innerHeight) *
      2 - 1;


    mouseTargetX =
      mouseX * 0.45;

    mouseTargetY =
      mouseY * 0.30;

  }
);


// ============================================================
// SHY DETECTION
// ============================================================

function updateShyState(
  delta,
  time
) {

  if (!oko)
    return;


  const rect =
    container.getBoundingClientRect();


  const centreX =
    rect.left +
    rect.width / 2;

  const centreY =
    rect.top +
    rect.height / 2;


  const dx =
    pointerScreenX -
    centreX;

  const dy =
    pointerScreenY -
    centreY;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  const hoverRadius =
    Math.min(
      rect.width,
      rect.height
    ) * 0.38;


  const pointerNear =
    pointerMoved &&
    distance <
    hoverRadius;


  // ----------------------------------------------------------
  // ENTER SHY
  // ----------------------------------------------------------

  if (
    pointerNear &&
    !wasNear
  ) {

    behaviour =
      "shy";


    shyPulse =
      1;


    // Start the arm reaction

    shyArmStart =
      time;


    // Ear reaction

    earReaction =
      1;

    earReactionStart =
      time;


    // Nervous eye starts

    nervousEyeX =
      0;

    nervousEyeY =
      0;


    nervousEyeTargetX =
      THREE.MathUtils.randFloat(
        -0.15,
        0.15
      );

    nervousEyeTargetY =
      THREE.MathUtils.randFloat(
        -0.08,
        0.08
      );


    nextNervousEyeMove =
      time +
      THREE.MathUtils.randFloat(
        0.45,
        1
      );

  }


  // ----------------------------------------------------------
  // LEAVE SHY
  // ----------------------------------------------------------

  if (
    !pointerNear &&
    wasNear
  ) {

    behaviour =
      "idle";


    nervousEyeTargetX =
      0;

    nervousEyeTargetY =
      0;

  }


  wasNear =
    pointerNear;


  // ----------------------------------------------------------
  // SMOOTH SHY TRANSITION
  // ----------------------------------------------------------

  const shyTarget =
    pointerNear
      ? 1
      : 0;


  shyAmount =
    damp(
      shyAmount,
      shyTarget,
      pointerNear
        ? 7
        : 3.5,
      delta
    );


  // ----------------------------------------------------------
  // STARTLE DECAY
  // ----------------------------------------------------------

  shyPulse =
    damp(
      shyPulse,
      0,
      10,
      delta
    );

}


// ============================================================
// IDLE EYE WANDER
// ============================================================

function updateIdleEye(
  time,
  delta
) {

  // ----------------------------------------------------------
  // MOUSE ACTIVE
  // ----------------------------------------------------------

  const mouseActive =
    time -
    lastMouseMoveTime <
    mouseIdleDelay;


  if (
    mouseActive ||
    behaviour === "shy"
  ) {

    eyeIdleX =
      damp(
        eyeIdleX,
        0,
        10,
        delta
      );

    eyeIdleY =
      damp(
        eyeIdleY,
        0,
        10,
        delta
      );

    return;

  }


  // ----------------------------------------------------------
  // PICK NEW PLACE TO LOOK
  // ----------------------------------------------------------

  if (
    time >
    nextEyeIdleMove
  ) {

    eyeIdleTargetX =
      THREE.MathUtils.randFloat(
        -0.20,
        0.20
      );


    eyeIdleTargetY =
      THREE.MathUtils.randFloat(
        -0.12,
        0.12
      );


    // Occasionally make a bigger glance.

    if (
      Math.random() <
      0.3
    ) {

      eyeIdleTargetX =
        Math.random() >
        0.5
          ? 0.25
          : -0.25;

    }


    nextEyeIdleMove =
      time +
      THREE.MathUtils.randFloat(
        1.2,
        3.0
      );

  }


  // ----------------------------------------------------------
  // SMOOTH EYE WANDER
  // ----------------------------------------------------------

  eyeIdleX =
    damp(
      eyeIdleX,
      eyeIdleTargetX,
      7,
      delta
    );


  eyeIdleY =
    damp(
      eyeIdleY,
      eyeIdleTargetY,
      7,
      delta
    );

}


// ============================================================
// EYE TARGET
// ============================================================

function updateEyeTarget(
  time,
  delta
) {

  const mouseActive =
    time -
    lastMouseMoveTime <
    mouseIdleDelay;


  // ----------------------------------------------------------
  // SHY
  // ----------------------------------------------------------

  if (
    behaviour === "shy"
  ) {

    eyeTargetX =
      mouseTargetX *
      0.42 +
      nervousEyeX;


    eyeTargetY =
      mouseTargetY *
      0.42 +
      nervousEyeY;

    return;

  }


  // ----------------------------------------------------------
  // MOUSE ACTIVE
  // ----------------------------------------------------------

  if (
    mouseActive
  ) {

    eyeTargetX =
      mouseTargetX;


    eyeTargetY =
      mouseTargetY;

    return;

  }


  // ----------------------------------------------------------
  // IDLE WANDER
  // ----------------------------------------------------------

  eyeTargetX =
    eyeIdleX;


  eyeTargetY =
    eyeIdleY;

}


// ============================================================
// NERVOUS EYES
// ============================================================

function updateNervousEyes(
  time,
  delta
) {

  if (
    behaviour !== "shy"
  ) {

    nervousEyeX =
      damp(
        nervousEyeX,
        0,
        8,
        delta
      );

    nervousEyeY =
      damp(
        nervousEyeY,
        0,
        8,
        delta
      );

    return;

  }


  // ----------------------------------------------------------
  // NEW NERVOUS GLANCE
  // ----------------------------------------------------------

  if (
    time >
    nextNervousEyeMove
  ) {

    nervousEyeTargetX =
      THREE.MathUtils.randFloat(
        -0.18,
        0.18
      );


    nervousEyeTargetY =
      THREE.MathUtils.randFloat(
        -0.10,
        0.10
      );


    if (
      Math.random() <
      0.35
    ) {

      nervousEyeTargetX =
        Math.random() >
        0.5
          ? 0.23
          : -0.23;

    }


    nextNervousEyeMove =
      time +
      THREE.MathUtils.randFloat(
        0.45,
        1.6
      );

  }


  nervousEyeX =
    damp(
      nervousEyeX,
      nervousEyeTargetX,
      18,
      delta
    );


  nervousEyeY =
    damp(
      nervousEyeY,
      nervousEyeTargetY,
      18,
      delta
    );


  // Tiny nervous micro movement

  nervousEyeX +=
    Math.sin(
      time * 16
    ) *
    0.008;


  nervousEyeY +=
    Math.sin(
      time * 13 +
      1.2
    ) *
    0.006;

}


// ============================================================
// IDLE BODY ACTION
// ============================================================

function startIdleAction(
  time
) {

  if (
    behaviour !== "idle" ||
    idleAction
  ) {
    return;
  }


  const types = [
    "look",
    "shuffle",
    "stretch",
    "weight"
  ];


  const type =
    types[
      Math.floor(
        Math.random() *
        types.length
      )
    ];


  idleAction = {

    type,

    start:
      time,

    duration:
      THREE.MathUtils.randFloat(
        0.9,
        1.5
      ),

    headX: 0,
    headY: 0,
    headZ: 0,

    leftArmX: 0,
    leftArmY: 0,
    leftArmZ: 0,

    rightArmX: 0,
    rightArmY: 0,
    rightArmZ: 0,

    leftLegZ: 0,
    rightLegZ: 0,

    hipZ: 0

  };


  // ----------------------------------------------------------
  // LOOK
  // ----------------------------------------------------------

  if (
    type === "look"
  ) {

    idleAction.headY =
      THREE.MathUtils.randFloat(
        -0.20,
        0.20
      );

    idleAction.headX =
      THREE.MathUtils.randFloat(
        -0.05,
        0.04
      );

    idleAction.headZ =
      THREE.MathUtils.randFloat(
        -0.03,
        0.03
      );

  }


  // ----------------------------------------------------------
  // SHUFFLE
  // ----------------------------------------------------------

  if (
    type === "shuffle"
  ) {

    idleAction.leftArmZ =
      THREE.MathUtils.randFloat(
        -0.09,
        0.09
      );

    idleAction.rightArmZ =
      THREE.MathUtils.randFloat(
        -0.09,
        0.09
      );


    idleAction.leftArmX =
      THREE.MathUtils.randFloat(
        -0.05,
        0.05
      );

    idleAction.rightArmX =
      THREE.MathUtils.randFloat(
        -0.05,
        0.05
      );

  }


  // ----------------------------------------------------------
  // STRETCH
  // ----------------------------------------------------------

  if (
    type === "stretch"
  ) {

    idleAction.leftArmZ =
      0.11;

    idleAction.rightArmZ =
      -0.11;

    idleAction.leftArmX =
      -0.04;

    idleAction.rightArmX =
      -0.04;

    idleAction.headX =
      -0.04;

  }


  // ----------------------------------------------------------
  // WEIGHT
  // ----------------------------------------------------------

  if (
    type === "weight"
  ) {

    idleAction.leftLegZ =
      THREE.MathUtils.randFloat(
        0.09,
        0.14
      );

    idleAction.rightLegZ =
      THREE.MathUtils.randFloat(
        -0.09,
        -0.14
      );

    idleAction.hipZ =
      THREE.MathUtils.randFloat(
        0.018,
        0.028
      );

  }

}


// ============================================================
// UPDATE IDLE BODY ACTION
// ============================================================

function updateIdleAction(
  time,
  delta
) {

  if (
    behaviour !== "idle"
  ) {

    idleAction =
      null;

    idleHeadX =
      damp(
        idleHeadX,
        0,
        7,
        delta
      );

    idleHeadY =
      damp(
        idleHeadY,
        0,
        7,
        delta
      );

    idleHeadZ =
      damp(
        idleHeadZ,
        0,
        7,
        delta
      );

    idleLeftArmX =
      damp(
        idleLeftArmX,
        0,
        7,
        delta
      );

    idleLeftArmY =
      damp(
        idleLeftArmY,
        0,
        7,
        delta
      );

    idleLeftArmZ =
      damp(
        idleLeftArmZ,
        0,
        7,
        delta
      );

    idleRightArmX =
      damp(
        idleRightArmX,
        0,
        7,
        delta
      );

    idleRightArmY =
      damp(
        idleRightArmY,
        0,
        7,
        delta
      );

    idleRightArmZ =
      damp(
        idleRightArmZ,
        0,
        7,
        delta
      );

    idleLeftLegZ =
      damp(
        idleLeftLegZ,
        0,
        7,
        delta
      );

    idleRightLegZ =
      damp(
        idleRightLegZ,
        0,
        7,
        delta
      );

    idleHipZ =
      damp(
        idleHipZ,
        0,
        7,
        delta
      );

    return;

  }


  if (
    !idleAction &&
    time >
    nextIdleAction
  ) {

    startIdleAction(
      time
    );

  }


  if (!idleAction)
    return;


  const progress =
    THREE.MathUtils.clamp(
      (
        time -
        idleAction.start
      ) /
      idleAction.duration,
      0,
      1
    );


  const amount =
    Math.sin(
      progress *
      Math.PI
    );


  idleHeadX =
    damp(
      idleHeadX,
      idleAction.headX *
      amount,
      12,
      delta
    );

  idleHeadY =
    damp(
      idleHeadY,
      idleAction.headY *
      amount,
      12,
      delta
    );

  idleHeadZ =
    damp(
      idleHeadZ,
      idleAction.headZ *
      amount,
      12,
      delta
    );


  idleLeftArmX =
    damp(
      idleLeftArmX,
      idleAction.leftArmX *
      amount,
      12,
      delta
    );

  idleLeftArmY =
    damp(
      idleLeftArmY,
      idleAction.leftArmY *
      amount,
      12,
      delta
    );

  idleLeftArmZ =
    damp(
      idleLeftArmZ,
      idleAction.leftArmZ *
      amount,
      12,
      delta
    );


  idleRightArmX =
    damp(
      idleRightArmX,
      idleAction.rightArmX *
      amount,
      12,
      delta
    );

  idleRightArmY =
    damp(
      idleRightArmY,
      idleAction.rightArmY *
      amount,
      12,
      delta
    );

  idleRightArmZ =
    damp(
      idleRightArmZ,
      idleAction.rightArmZ *
      amount,
      12,
      delta
    );


  idleLeftLegZ =
    damp(
      idleLeftLegZ,
      idleAction.leftLegZ *
      amount,
      12,
      delta
    );

  idleRightLegZ =
    damp(
      idleRightLegZ,
      idleAction.rightLegZ *
      amount,
      12,
      delta
    );


  idleHipZ =
    damp(
      idleHipZ,
      idleAction.hipZ *
      amount,
      12,
      delta
    );


  if (
    progress >= 1
  ) {

    idleAction =
      null;


    nextIdleAction =
      time +
      THREE.MathUtils.randFloat(
        1.5,
        4.5
      );

  }

}


// ============================================================
// EARS
// ============================================================

function updateEars(
  time
) {

  if (
    !leftEar ||
    !rightEar
  ) {
    return;
  }


  // ----------------------------------------------------------
  // RANDOM TWITCHES
  // ----------------------------------------------------------

  if (
    time >
    nextLeftEarTwitch
  ) {

    leftEarTwitchStart =
      time;

    earTwitchLeft =
      1;


    nextLeftEarTwitch =
      time +
      THREE.MathUtils.randFloat(
        2.5,
        6
      );

  }


  if (
    time >
    nextRightEarTwitch
  ) {

    rightEarTwitchStart =
      time;

    earTwitchRight =
      1;


    nextRightEarTwitch =
      time +
      THREE.MathUtils.randFloat(
        3,
        7
      );

  }


  const leftProgress =
    THREE.MathUtils.clamp(
      (
        time -
        leftEarTwitchStart
      ) /
      earTwitchDuration,
      0,
      1
    );


  const rightProgress =
    THREE.MathUtils.clamp(
      (
        time -
        rightEarTwitchStart
      ) /
      earTwitchDuration,
      0,
      1
    );


  const leftTwitch =
    Math.sin(
      leftProgress *
      Math.PI
    ) *
    earTwitchLeft;


  const rightTwitch =
    Math.sin(
      rightProgress *
      Math.PI
    ) *
    earTwitchRight;


  // ----------------------------------------------------------
  // SUBTLE IDLE EAR LIFE
  // ----------------------------------------------------------

  const leftSway =
    Math.sin(
      time * 0.80
    ) *
    0.018;


  const rightSway =
    Math.sin(
      time * 0.72 +
      1.8
    ) *
    0.014;


  const leftSwayZ =
    Math.sin(
      time * 0.63 +
      0.5
    ) *
    0.012;


  const rightSwayZ =
    Math.sin(
      time * 0.68 +
      2.2
    ) *
    0.010;


  // ----------------------------------------------------------
  // BASE
  // ----------------------------------------------------------

  leftEar.rotation.x =
    leftEarBaseRotation.x +
    leftSway +
    leftTwitch *
    0.13;


  leftEar.rotation.z =
    leftEarBaseRotation.z +
    leftSwayZ +
    leftTwitch *
    0.08;


  rightEar.rotation.x =
    rightEarBaseRotation.x +
    rightSway +
    rightTwitch *
    0.11;


  rightEar.rotation.z =
    rightEarBaseRotation.z +
    rightSwayZ -
    rightTwitch *
    0.07;


  // ----------------------------------------------------------
  // SHY REACTION
  // ----------------------------------------------------------

  const reactionProgress =
    THREE.MathUtils.clamp(
      (
        time -
        earReactionStart
      ) /
      earReactionDuration,
      0,
      1
    );


  let reaction =
    0;


  if (
    reactionProgress < 0.35
  ) {

    reaction =
      easeOut(
        reactionProgress /
        0.35
      );

  } else {

    reaction =
      1 -
      easeInOut(
        (
          reactionProgress -
          0.35
        ) /
        0.65
      );

  }


  reaction *=
    earReaction;


  leftEar.rotation.x +=
    reaction *
    0.24;


  leftEar.rotation.z +=
    reaction *
    0.10;


  rightEar.rotation.x +=
    reaction *
    0.18;


  rightEar.rotation.z -=
    reaction *
    0.14;


  if (
    leftProgress >= 1
  ) {

    earTwitchLeft =
      0;

  }


  if (
    rightProgress >= 1
  ) {

    earTwitchRight =
      0;

  }

}


// ============================================================
// BREATHING
// ============================================================

function updateBreathing(
  time
) {

  if (!oko)
    return;


  const breath =
    Math.sin(
      time * 1.15
    );


  const inhale =
    (
      breath + 1
    ) / 2;


  if (baseOkoScale) {

    const amount =
      inhale *
      0.006;


    oko.scale.x =
      baseOkoScale.x +
      amount;


    oko.scale.y =
      baseOkoScale.y +
      amount * 1.5;


    oko.scale.z =
      baseOkoScale.z +
      amount;

  }


  if (
    leftShoulder &&
    rightShoulder
  ) {

    const shoulder =
      breath *
      0.012;


    leftShoulder.rotation.x =
      leftShoulderBaseRotation.x +
      shoulder;


    rightShoulder.rotation.x =
      rightShoulderBaseRotation.x +
      shoulder;

  }

}


// ============================================================
// MAIN ANIMATION
// ============================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  const delta =
    Math.min(
      clock.getDelta(),
      0.05
    );


  const time =
    clock.elapsedTime;


  // ----------------------------------------------------------
  // STATE
  // ----------------------------------------------------------

  updateShyState(
    delta,
    time
  );


  updateIdleAction(
    time,
    delta
  );


  // ----------------------------------------------------------
  // EYE
  // ----------------------------------------------------------

  updateIdleEye(
    time,
    delta
  );


  updateNervousEyes(
    time,
    delta
  );


  updateEyeTarget(
    time,
    delta
  );


  currentEyeX =
    damp(
      currentEyeX,
      eyeTargetX,
      12,
      delta
    );


  currentEyeY =
    damp(
      currentEyeY,
      eyeTargetY,
      12,
      delta
    );


  if (!oko) {

    renderer.render(
      scene,
      camera
    );

    return;

  }


  // ==========================================================
  // BREATHING
  // ==========================================================

  updateBreathing(
    time
  );


  // ==========================================================
  // HEAD
  // ==========================================================

  if (head) {

    // Mouse / idle eye influence

    let headY =
      currentEyeX *
      0.18;


    let headX =
      -currentEyeY *
      0.10;


    // Idle action

    headY +=
      idleHeadY;

    headX +=
      idleHeadX;


    const headZ =
      idleHeadZ;


    // Shy turn away

    headY +=
      -mouseTargetX *
      shyAmount *
      0.16;


    headX +=
      shyAmount *
      0.06;


    // Startle

    const startle =
      shyPulse *
      0.035;


    // Breathing

    const breathing =
      Math.sin(
        time * 1.15
      ) *
      0.004;


    head.rotation.y =
      headBaseRotation.y +
      headY;


    head.rotation.x =
      headBaseRotation.x +
      headX +
      breathing;


    head.rotation.z =
      headBaseRotation.z +
      headZ +
      startle;

  }


  // ==========================================================
  // EYE
  // ==========================================================

  if (
    eyeball &&
    eyeMovementAmount > 0
  ) {

    eyeball.position.x =
      eyeballBasePosition.x +
      currentEyeX *
      eyeMovementAmount;


    eyeball.position.y =
      eyeballBasePosition.y -
      currentEyeY *
      eyeMovementAmount;


    eyeball.position.z =
      eyeballBasePosition.z;

  }


  // ==========================================================
  // EARS
  // ==========================================================

  updateEars(
    time
  );


  // ==========================================================
  // SHOULDERS
  // ==========================================================

  if (
    leftShoulder &&
    rightShoulder
  ) {

    leftShoulder.rotation.z =
      leftShoulderBaseRotation.z +
      shyAmount *
      0.025;


    rightShoulder.rotation.z =
      rightShoulderBaseRotation.z -
      shyAmount *
      0.025;

  }


  // ==========================================================
  // ARMS
  // ==========================================================

  if (
    leftArm &&
    rightArm
  ) {

    // --------------------------------------------------------
    // RESET TO BASE
    // --------------------------------------------------------

    leftArm.rotation.x =
      leftArmBaseRotation.x;

    leftArm.rotation.y =
      leftArmBaseRotation.y;

    leftArm.rotation.z =
      leftArmBaseRotation.z;


    rightArm.rotation.x =
      rightArmBaseRotation.x;

    rightArm.rotation.y =
      rightArmBaseRotation.y;

    rightArm.rotation.z =
      rightArmBaseRotation.z;


    // --------------------------------------------------------
    // IDLE MOVEMENT
    // --------------------------------------------------------

    leftArm.rotation.x +=
      idleLeftArmX;

    leftArm.rotation.y +=
      idleLeftArmY;

    leftArm.rotation.z +=
      idleLeftArmZ;


    rightArm.rotation.x +=
      idleRightArmX;

    rightArm.rotation.y +=
      idleRightArmY;

    rightArm.rotation.z +=
      idleRightArmZ;


    // --------------------------------------------------------
    // SHY FACE COVER
    // --------------------------------------------------------

    // Arms gradually come inward/upward.

    leftArm.rotation.z +=
      shyAmount *
      0.24;


    rightArm.rotation.z -=
      shyAmount *
      0.24;


    leftArm.rotation.x +=
      shyAmount *
      -0.16;


    rightArm.rotation.x +=
      shyAmount *
      -0.16;


    // --------------------------------------------------------
    // SURPRISE ARM FLUTTER
    // --------------------------------------------------------

    const armReactionProgress =
      THREE.MathUtils.clamp(
        (
          time -
          shyArmStart
        ) /
        shyArmDuration,
        0,
        1
      );


    if (
      behaviour === "shy" &&
      armReactionProgress <
      1
    ) {

      const reaction =
        Math.sin(
          armReactionProgress *
          Math.PI
        );


      // Quick outward "AH!"

      leftArm.rotation.z +=
        reaction *
        -0.20;


      rightArm.rotation.z +=
        reaction *
        0.20;


      leftArm.rotation.x +=
        reaction *
        0.14;


      rightArm.rotation.x +=
        reaction *
        0.14;


      // Slightly offset timing
      // gives the arms a less robotic flutter.

      leftArm.rotation.y +=
        Math.sin(
          armReactionProgress *
          Math.PI *
          2
        ) *
        0.06;


      rightArm.rotation.y +=
        Math.sin(
          armReactionProgress *
          Math.PI *
          2 +
          0.8
        ) *
        0.06;

    }


    // --------------------------------------------------------
    // NERVOUS FIDGET
    // --------------------------------------------------------

    if (
      behaviour === "shy" &&
      armReactionProgress >= 1
    ) {

      leftArm.rotation.z +=
        Math.sin(
          time * 8
        ) *
        0.008 *
        shyAmount;


      rightArm.rotation.z -=
        Math.sin(
          time * 9.5 +
          1.5
        ) *
        0.007 *
        shyAmount;

    }


    // --------------------------------------------------------
    // STARTLE
    // --------------------------------------------------------

    leftArm.rotation.z +=
      shyPulse *
      -0.08;


    rightArm.rotation.z +=
      shyPulse *
      0.08;


    // --------------------------------------------------------
    // BREATHING
    // --------------------------------------------------------

    const armBreathing =
      Math.sin(
        time * 1.15
      ) *
      0.006;


    leftArm.rotation.x +=
      armBreathing;


    rightArm.rotation.x +=
      armBreathing;

  }


  // ==========================================================
  // LEGS
  // ==========================================================

  if (
    leftLeg &&
    rightLeg
  ) {

    leftLeg.rotation.x =
      leftLegBaseRotation.x;

    leftLeg.rotation.y =
      leftLegBaseRotation.y;

    leftLeg.rotation.z =
      leftLegBaseRotation.z;


    rightLeg.rotation.x =
      rightLegBaseRotation.x;

    rightLeg.rotation.y =
      rightLegBaseRotation.y;

    rightLeg.rotation.z =
      rightLegBaseRotation.z;


    // Idle

    leftLeg.rotation.z +=
      idleLeftLegZ;


    rightLeg.rotation.z +=
      idleRightLegZ;


    // Shy

    leftLeg.rotation.z +=
      shyAmount *
      0.055;


    rightLeg.rotation.z -=
      shyAmount *
      0.055;


    leftLeg.rotation.x +=
      shyAmount *
      0.035;


    rightLeg.rotation.x +=
      shyAmount *
      0.035;

  }


  // ==========================================================
  // HIPS
  // ==========================================================

  if (
    leftHip &&
    rightHip
  ) {

    leftHip.rotation.z =
      leftHipBaseRotation.z +
      idleHipZ +
      shyAmount *
      0.015;


    rightHip.rotation.z =
      rightHipBaseRotation.z -
      idleHipZ -
      shyAmount *
      0.015;

  }


  // ==========================================================
  // BODY SCALE
  // ==========================================================

  if (baseOkoScale) {

    const breath =
      (
        Math.sin(
          time * 1.15
        ) + 1
      ) /
      2 *
      0.006;


    const shySquash =
      shyAmount *
      0.035 +
      shyPulse *
      0.025;


    oko.scale.x =
      baseOkoScale.x +
      breath +
      shySquash *
      0.35;


    oko.scale.y =
      baseOkoScale.y +
      breath *
      1.5 -
      shySquash;


    oko.scale.z =
      baseOkoScale.z +
      breath +
      shySquash *
      0.35;

  }


  // ==========================================================
  // BODY POSITION
  // ==========================================================

  if (baseOkoPosition) {

    const awayX =
      -mouseTargetX *
      shyAmount *
      0.035;


    const crouch =
      shyAmount *
      -0.025;


    const startle =
      shyPulse *
      -0.015;


    const breathing =
      Math.sin(
        time * 1.15
      ) *
      0.003;


    oko.position.x =
      baseOkoPosition.x +
      awayX;


    oko.position.y =
      baseOkoPosition.y +
      crouch +
      startle +
      breathing;

  }


  // ==========================================================
  // RENDER
  // ==========================================================

  renderer.render(
    scene,
    camera
  );

}


// ============================================================
// START
// ============================================================

animate();


// ============================================================
// RESIZE
// ============================================================

function resize() {

  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if (
    width === 0 ||
    height === 0
  ) {
    return;
  }


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height
  );

}


window.addEventListener(
  "resize",
  resize
);

</script>
