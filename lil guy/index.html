<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #kkzywz {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="kkzywz"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// SETUP
// ============================================================

const container = document.getElementById("kkzywz");

const scene = new THREE.Scene();


// ============================================================
// CAMERA
// ============================================================

const camera = new THREE.PerspectiveCamera(
  45,
  container.clientWidth / container.clientHeight,
  0.01,
  1000
);


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setClearColor(
  0x000000,
  0
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.NoToneMapping;

renderer.toneMappingExposure = 1.0;

container.appendChild(
  renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    0.45
  );

scene.add(
  ambientLight
);


const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    1.8
  );

directionalLight.position.set(
  4,
  5,
  6
);

scene.add(
  directionalLight
);


const fillLight =
  new THREE.DirectionalLight(
    0xffffff,
    0.15
  );

fillLight.position.set(
  -4,
  2,
  3
);

scene.add(
  fillLight
);


// ============================================================
// MODEL
// ============================================================

const loader =
  new GLTFLoader();

let oko;


// ============================================================
// BONES
// ============================================================

let leftEar;
let rightEar;

let leftShoulder;
let rightShoulder;

let leftArm;
let rightArm;

let leftHip;
let rightHip;

let leftLeg;
let rightLeg;

let head;
let eyeball;


// ============================================================
// BASE TRANSFORMS
// ============================================================

let leftEarBaseRotation;
let rightEarBaseRotation;

let leftShoulderBaseRotation;
let rightShoulderBaseRotation;

let leftArmBaseRotation;
let rightArmBaseRotation;

let leftHipBaseRotation;
let rightHipBaseRotation;

let leftLegBaseRotation;
let rightLegBaseRotation;

let headBaseRotation;

let eyeballBasePosition;

let baseOkoPosition;
let baseOkoScale;


// ============================================================
// EYE
// ============================================================

let eyeMovementAmount = 0;

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;


// ============================================================
// POINTER
// ============================================================

let pointerX = 0;
let pointerY = 0;

let pointerScreenX = 0;
let pointerScreenY = 0;

let pointerMoved = false;


// ============================================================
// BEHAVIOUR
// ============================================================

let behaviour = "idle";

let shyAmount = 0;

let shyPulse = 0;

let wasNear = false;


// ============================================================
// EAR REACTION
// ============================================================

let earReaction = 0;
let earReactionStart = -10;

const earReactionDuration = 0.42;


// ============================================================
// EAR IDLE TWITCH
// ============================================================

let earTwitchLeft = 0;
let earTwitchRight = 0;

let nextLeftEarTwitch = 2.5;
let nextRightEarTwitch = 4.0;

let leftEarTwitchStart = -10;
let rightEarTwitchStart = -10;

const earTwitchDuration = 0.28;


// ============================================================
// IDLE SYSTEM
// ============================================================

let idleAction = null;

let nextIdleAction = 2.5;


// ============================================================
// LOAD MODEL
// ============================================================

loader.load(
  "./OKO.glb",

  function(gltf) {

    console.log("OKO LOADED");

    oko = gltf.scene;


    // --------------------------------------------------------
    // CENTER MODEL
    // --------------------------------------------------------

    const box =
      new THREE.Box3()
        .setFromObject(oko);

    const size =
      box.getSize(
        new THREE.Vector3()
      );

    const center =
      box.getCenter(
        new THREE.Vector3()
      );

    oko.position.sub(
      center
    );

    scene.add(
      oko
    );


    // --------------------------------------------------------
    // BASE TRANSFORMS
    // --------------------------------------------------------

    baseOkoPosition =
      oko.position.clone();

    baseOkoScale =
      oko.scale.clone();


    // --------------------------------------------------------
    // BONES
    // --------------------------------------------------------

    leftEar =
      oko.getObjectByName(
        "left_ear"
      );

    rightEar =
      oko.getObjectByName(
        "right_ear"
      );


    leftShoulder =
      oko.getObjectByName(
        "left_shoulder"
      );

    rightShoulder =
      oko.getObjectByName(
        "right_shoulder"
      );


    leftArm =
      oko.getObjectByName(
        "left_arm"
      );

    rightArm =
      oko.getObjectByName(
        "right_arm"
      );


    leftHip =
      oko.getObjectByName(
        "left_hip_bone"
      );

    rightHip =
      oko.getObjectByName(
        "right_hip_bone"
      );


    leftLeg =
      oko.getObjectByName(
        "left_leg"
      );

    rightLeg =
      oko.getObjectByName(
        "right_leg"
      );


    head =
      oko.getObjectByName(
        "HEAD"
      );

    eyeball =
      oko.getObjectByName(
        "Eyeball"
      );


    // --------------------------------------------------------
    // BASE ROTATIONS
    // --------------------------------------------------------

    if (leftEar)
      leftEarBaseRotation =
        leftEar.rotation.clone();

    if (rightEar)
      rightEarBaseRotation =
        rightEar.rotation.clone();


    if (leftShoulder)
      leftShoulderBaseRotation =
        leftShoulder.rotation.clone();

    if (rightShoulder)
      rightShoulderBaseRotation =
        rightShoulder.rotation.clone();


    if (leftArm)
      leftArmBaseRotation =
        leftArm.rotation.clone();

    if (rightArm)
      rightArmBaseRotation =
        rightArm.rotation.clone();


    if (leftHip)
      leftHipBaseRotation =
        leftHip.rotation.clone();

    if (rightHip)
      rightHipBaseRotation =
        rightHip.rotation.clone();


    if (leftLeg)
      leftLegBaseRotation =
        leftLeg.rotation.clone();

    if (rightLeg)
      rightLegBaseRotation =
        rightLeg.rotation.clone();


    if (head)
      headBaseRotation =
        head.rotation.clone();


    if (eyeball)
      eyeballBasePosition =
        eyeball.position.clone();


    // --------------------------------------------------------
    // EYE MOVEMENT
    // --------------------------------------------------------

    eyeMovementAmount =
      Math.max(
        size.x,
        size.y,
        size.z
      ) * 0.045;


    // --------------------------------------------------------
    // CAMERA
    // --------------------------------------------------------

    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );

    const fov =
      THREE.MathUtils.degToRad(
        camera.fov
      );

    let distance =
      (maxSize / 2) /
      Math.tan(fov / 2);

    distance *= 1.35;

    camera.position.set(
      0,
      0,
      distance
    );

    camera.lookAt(
      0,
      0,
      0
    );

    camera.near =
      Math.max(
        0.01,
        distance / 100
      );

    camera.far =
      distance * 100;

    camera.updateProjectionMatrix();

  },

  undefined,

  function(error) {

    console.error(
      "ERROR LOADING OKO:",
      error
    );

  }
);


// ============================================================
// MOUSE
// ============================================================

document.addEventListener(
  "mousemove",
  function(e) {

    pointerScreenX =
      e.clientX;

    pointerScreenY =
      e.clientY;

    pointerMoved = true;


    const mouseX =
      (e.clientX /
      window.innerWidth) *
      2 - 1;

    const mouseY =
      (e.clientY /
      window.innerHeight) *
      2 - 1;


    pointerX = mouseX;
    pointerY = mouseY;


    targetX =
      mouseX * 0.45;

    targetY =
      mouseY * 0.30;

  }
);


// ============================================================
// SHY DETECTION
// ============================================================

function updateShyState() {

  if (!oko)
    return;


  const rect =
    container.getBoundingClientRect();


  const centreX =
    rect.left +
    rect.width / 2;

  const centreY =
    rect.top +
    rect.height / 2;


  const dx =
    pointerScreenX -
    centreX;

  const dy =
    pointerScreenY -
    centreY;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  const hoverRadius =
    Math.min(
      rect.width,
      rect.height
    ) * 0.38;


  const pointerNear =
    pointerMoved &&
    distance <
    hoverRadius;


  // ----------------------------------------------------------
  // ENTER SHY
  // ----------------------------------------------------------

  if (
    pointerNear &&
    !wasNear
  ) {

    behaviour =
      "shy";

    shyPulse =
      1;


    // Big ear reaction

    earReaction =
      1;

    earReactionStart =
      clock.getElapsedTime();

  }


  // ----------------------------------------------------------
  // LEAVE SHY
  // ----------------------------------------------------------

  if (
    !pointerNear &&
    wasNear
  ) {

    behaviour =
      "idle";

  }


  wasNear =
    pointerNear;


  // ----------------------------------------------------------
  // SHY AMOUNT
  // ----------------------------------------------------------

  const targetShy =
    pointerNear
      ? 1
      : 0;


  shyAmount =
    THREE.MathUtils.damp(
      shyAmount,
      targetShy,
      pointerNear
        ? 9
        : 4,
      1 / 60
    );


  // ----------------------------------------------------------
  // STARTLE
  // ----------------------------------------------------------

  shyPulse =
    THREE.MathUtils.damp(
      shyPulse,
      0,
      12,
      1 / 60
    );

}


// ============================================================
// RANDOM EAR TWITCHES
// ============================================================

function updateEarTwitches(time) {

  if (
    !leftEar ||
    !rightEar
  ) {
    return;
  }


  // ----------------------------------------------------------
  // LEFT EAR
  // ----------------------------------------------------------

  if (
    time >
    nextLeftEarTwitch
  ) {

    leftEarTwitchStart =
      time;

    earTwitchLeft =
      1;


    nextLeftEarTwitch =
      time +
      THREE.MathUtils.randFloat(
        2.5,
        6
      );

  }


  // ----------------------------------------------------------
  // RIGHT EAR
  // ----------------------------------------------------------

  if (
    time >
    nextRightEarTwitch
  ) {

    rightEarTwitchStart =
      time;

    earTwitchRight =
      1;


    nextRightEarTwitch =
      time +
      THREE.MathUtils.randFloat(
        3,
        7
      );

  }


  // ----------------------------------------------------------
  // LEFT TWITCH
  // ----------------------------------------------------------

  const leftElapsed =
    time -
    leftEarTwitchStart;


  let leftProgress =
    THREE.MathUtils.clamp(
      leftElapsed /
      earTwitchDuration,
      0,
      1
    );


  let leftTwitch =
    0;


  if (
    leftProgress < 0.25
  ) {

    leftTwitch =
      easeOut(
        leftProgress / 0.25
      );

  } else {

    leftTwitch =
      1 -
      easeInOut(
        (leftProgress - 0.25) /
        0.75
      );

  }


  leftTwitch *=
    earTwitchLeft;


  // ----------------------------------------------------------
  // RIGHT TWITCH
  // ----------------------------------------------------------

  const rightElapsed =
    time -
    rightEarTwitchStart;


  let rightProgress =
    THREE.MathUtils.clamp(
      rightElapsed /
      earTwitchDuration,
      0,
      1
    );


  let rightTwitch =
    0;


  if (
    rightProgress < 0.25
  ) {

    rightTwitch =
      easeOut(
        rightProgress / 0.25
      );

  } else {

    rightTwitch =
      1 -
      easeInOut(
        (rightProgress - 0.25) /
        0.75
      );

  }


  rightTwitch *=
    earTwitchRight;


  // ----------------------------------------------------------
  // VERY SUBTLE CONSTANT EAR LIFE
  // ----------------------------------------------------------

  const leftSway =
    Math.sin(
      time * 0.80
    ) * 0.018;


  const rightSway =
    Math.sin(
      time * 0.72 +
      1.8
    ) * 0.014;


  const leftSwayZ =
    Math.sin(
      time * 0.63 +
      0.5
    ) * 0.012;


  const rightSwayZ =
    Math.sin(
      time * 0.68 +
      2.2
    ) * 0.010;


  // ----------------------------------------------------------
  // APPLY LEFT EAR
  // ----------------------------------------------------------

  leftEar.rotation.x =
    leftEarBaseRotation.x +
    leftSway +
    leftTwitch * 0.13;


  leftEar.rotation.z =
    leftEarBaseRotation.z +
    leftSwayZ +
    leftTwitch * 0.08;


  // ----------------------------------------------------------
  // APPLY RIGHT EAR
  // ----------------------------------------------------------

  rightEar.rotation.x =
    rightEarBaseRotation.x +
    rightSway +
    rightTwitch * 0.11;


  rightEar.rotation.z =
    rightEarBaseRotation.z +
    rightSwayZ -
    rightTwitch * 0.07;


  // ----------------------------------------------------------
  // FINISH TWITCHES
  // ----------------------------------------------------------

  if (
    leftProgress >= 1
  ) {

    earTwitchLeft = 0;

  }


  if (
    rightProgress >= 1
  ) {

    earTwitchRight = 0;

  }

}


// ============================================================
// BIG SHY EAR REACTION
// ============================================================

function updateEarReaction(time) {

  if (
    !leftEar ||
    !rightEar
  ) {
    return;
  }


  const elapsed =
    time -
    earReactionStart;


  let progress =
    elapsed /
    earReactionDuration;


  progress =
    THREE.MathUtils.clamp(
      progress,
      0,
      1
    );


  let reaction = 0;


  // Quick movement in,
  // then sharp settle.

  if (
    progress < 0.35
  ) {

    const p =
      progress / 0.35;

    reaction =
      easeOut(p);

  } else {

    const p =
      (progress - 0.35) /
      0.65;

    reaction =
      1 -
      easeInOut(p);

  }


  reaction *=
    earReaction;


  // ----------------------------------------------------------
  // ADD ON TOP OF BASE EAR LIFE
  // ----------------------------------------------------------

  leftEar.rotation.x +=
    reaction * 0.24;


  leftEar.rotation.z +=
    reaction * 0.10;


  rightEar.rotation.x +=
    reaction * 0.18;


  rightEar.rotation.z -=
    reaction * 0.14;


  // ----------------------------------------------------------
  // FINISH
  // ----------------------------------------------------------

  if (
    progress >= 1
  ) {

    earReaction = 0;

  }

}


// ============================================================
// IDLE ACTIONS
// ============================================================

function startIdleAction(time) {

  if (
    behaviour !== "idle" ||
    idleAction
  ) {
    return;
  }


  const actions = [
    "look",
    "weight",
    "ear"
  ];


  const type =
    actions[
      Math.floor(
        Math.random() *
        actions.length
      )
    ];


  idleAction = {

    type: type,

    start: time,

    duration:
      type === "ear"
        ? 0.45
        : type === "look"
          ? 1.1
          : 0.9

  };

}


// ============================================================
// EASING
// ============================================================

function easeInOut(t) {

  return (
    t < 0.5

      ? 2 * t * t

      : 1 -
        Math.pow(
          -2 * t + 2,
          2
        ) / 2
  );

}


function easeOut(t) {

  return 1 -
    Math.pow(
      1 - t,
      3
    );

}


// ============================================================
// IDLE ACTION UPDATE
// ============================================================

function updateIdleAction(time) {

  if (!oko)
    return;


  if (
    behaviour !== "idle"
  ) {

    idleAction = null;

    return;

  }


  if (
    !idleAction &&
    time >
    nextIdleAction
  ) {

    startIdleAction(
      time
    );

  }


  if (!idleAction)
    return;


  const elapsed =
    time -
    idleAction.start;


  const progress =
    Math.min(
      elapsed /
      idleAction.duration,
      1
    );


  // ----------------------------------------------------------
  // LOOK
  // ----------------------------------------------------------

  if (
    idleAction.type === "look"
  ) {

    const p =
      Math.sin(
        progress *
        Math.PI
      );


    const direction =
      Math.random() > 0.5
        ? 1
        : -1;


    if (head) {

      head.rotation.y =
        headBaseRotation.y +
        direction *
        p *
        0.12;

    }

  }


  // ----------------------------------------------------------
  // WEIGHT
  // ----------------------------------------------------------

  if (
    idleAction.type === "weight"
  ) {

    const p =
      Math.sin(
        progress *
        Math.PI
      );


    if (leftLeg) {

      leftLeg.rotation.z =
        leftLegBaseRotation.z +
        p * 0.14;

    }


    if (rightLeg) {

      rightLeg.rotation.z =
        rightLegBaseRotation.z -
        p * 0.14;

    }


    if (leftHip) {

      leftHip.rotation.z =
        leftHipBaseRotation.z +
        p * 0.025;

    }


    if (rightHip) {

      rightHip.rotation.z =
        rightHipBaseRotation.z -
        p * 0.025;

    }

  }


  // ----------------------------------------------------------
  // IDLE EAR TWITCH
  // ----------------------------------------------------------

  // The dedicated ear twitch system handles
  // the ears now, so this action does nothing
  // to avoid competing animations.

  if (
    idleAction.type === "ear"
  ) {

    // Intentionally empty.

  }


  // ----------------------------------------------------------
  // FINISH
  // ----------------------------------------------------------

  if (
    progress >= 1
  ) {

    idleAction = null;


    nextIdleAction =
      time +
      THREE.MathUtils.randFloat(
        1.8,
        4.5
      );

  }

}


// ============================================================
// MAIN ANIMATION
// ============================================================

const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  const time =
    clock.getElapsedTime();


  // ----------------------------------------------------------
  // BEHAVIOUR
  // ----------------------------------------------------------

  updateShyState();

  updateIdleAction(
    time
  );


  // ----------------------------------------------------------
  // EYES
  // ----------------------------------------------------------

  currentX +=
    (
      targetX -
      currentX
    ) * 0.08;


  currentY +=
    (
      targetY -
      currentY
    ) * 0.08;


  if (!oko) {

    renderer.render(
      scene,
      camera
    );

    return;

  }


  // ==========================================================
  // HEAD
  // ==========================================================

  if (head) {

    head.rotation.y =
      headBaseRotation.y +
      currentX * 0.18;


    head.rotation.x =
      headBaseRotation.x -
      currentY * 0.10;


    head.rotation.z =
      headBaseRotation.z;


    // Turn away slightly when shy

    head.rotation.y +=
      -currentX *
      shyAmount *
      0.16;


    // Small downward tuck

    head.rotation.x +=
      shyAmount *
      0.06;


    // Startle

    head.rotation.z +=
      shyPulse *
      0.035;

  }


  // ==========================================================
  // EYEBALL
  // ==========================================================

  if (
    eyeball &&
    eyeMovementAmount > 0
  ) {

    eyeball.position.x =
      eyeballBasePosition.x +
      currentX *
      eyeMovementAmount;


    eyeball.position.y =
      eyeballBasePosition.y -
      currentY *
      eyeMovementAmount;


    eyeball.position.z =
      eyeballBasePosition.z;

  }


  // ==========================================================
  // EARS
  // ==========================================================

  // Constant subtle life + occasional twitches

  updateEarTwitches(
    time
  );


  // Bigger shy reaction layered on top

  updateEarReaction(
    time
  );


  // ==========================================================
  // SHOULDERS
  // ==========================================================

  if (
    leftShoulder &&
    rightShoulder
  ) {

    leftShoulder.rotation.z =
      leftShoulderBaseRotation.z;

    rightShoulder.rotation.z =
      rightShoulderBaseRotation.z;


    leftShoulder.rotation.z +=
      shyAmount *
      0.025;

    rightShoulder.rotation.z -=
      shyAmount *
      0.025;

  }


  // ==========================================================
  // ARMS
  // ==========================================================

  if (
    leftArm &&
    rightArm
  ) {

    leftArm.rotation.z =
      leftArmBaseRotation.z;

    rightArm.rotation.z =
      rightArmBaseRotation.z;


    leftArm.rotation.x =
      leftArmBaseRotation.x;

    rightArm.rotation.x =
      rightArmBaseRotation.x;


    leftArm.rotation.y =
      leftArmBaseRotation.y;

    rightArm.rotation.y =
      rightArmBaseRotation.y;


    // Shy tuck

    leftArm.rotation.z +=
      shyAmount *
      0.16;

    rightArm.rotation.z -=
      shyAmount *
      0.16;


    leftArm.rotation.x +=
      shyAmount *
      0.08;

    rightArm.rotation.x +=
      shyAmount *
      0.08;


    // Startle

    leftArm.rotation.z +=
      shyPulse *
      0.10;

    rightArm.rotation.z -=
      shyPulse *
      0.10;

  }


  // ==========================================================
  // LEGS
  // ==========================================================

  if (
    leftLeg &&
    rightLeg
  ) {

    leftLeg.rotation.z =
      leftLegBaseRotation.z;

    rightLeg.rotation.z =
      rightLegBaseRotation.z;


    leftLeg.rotation.x =
      leftLegBaseRotation.x;

    rightLeg.rotation.x =
      rightLegBaseRotation.x;


    leftLeg.rotation.y =
      leftLegBaseRotation.y;

    rightLeg.rotation.y =
      rightLegBaseRotation.y;


    // Shy weight shift

    leftLeg.rotation.z +=
      shyAmount *
      0.055;

    rightLeg.rotation.z -=
      shyAmount *
      0.055;


    // Tiny crouch

    leftLeg.rotation.x +=
      shyAmount *
      0.035;

    rightLeg.rotation.x +=
      shyAmount *
      0.035;

  }


  // ==========================================================
  // HIPS
  // ==========================================================

  if (
    leftHip &&
    rightHip
  ) {

    leftHip.rotation.z =
      leftHipBaseRotation.z;

    rightHip.rotation.z =
      rightHipBaseRotation.z;


    leftHip.rotation.z +=
      shyAmount *
      0.015;

    rightHip.rotation.z -=
      shyAmount *
      0.015;

  }


  // ==========================================================
  // BODY SQUASH
  // ==========================================================

  const shySquash =
    shyAmount *
    0.035 +
    shyPulse *
    0.025;


  if (baseOkoScale) {

    oko.scale.x =
      baseOkoScale.x +
      shySquash *
      0.35;

    oko.scale.y =
      baseOkoScale.y -
      shySquash;

    oko.scale.z =
      baseOkoScale.z +
      shySquash *
      0.35;

  }


  // ==========================================================
  // BODY MOVEMENT
  // ==========================================================

  if (baseOkoPosition) {

    const awayX =
      -currentX *
      shyAmount *
      0.035;


    const crouch =
      shyAmount *
      -0.025;


    const startle =
      shyPulse *
      -0.015;


    oko.position.x =
      baseOkoPosition.x +
      awayX;


    oko.position.y =
      baseOkoPosition.y +
      crouch +
      startle;

  }


  // ==========================================================
  // RENDER
  // ==========================================================

  renderer.render(
    scene,
    camera
  );

}


animate();


// ============================================================
// RESIZE
// ============================================================

function resize() {

  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if (
    width === 0 ||
    height === 0
  ) {
    return;
  }


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height
  );

}


window.addEventListener(
  "resize",
  resize
);

</script>

</body>
</html>
