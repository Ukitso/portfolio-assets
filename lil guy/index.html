<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<style>

html,
body {

  margin: 0;
  width: 100%;
  height: 100%;

  overflow: hidden;

  background: transparent;

}

.scene {

  width: 100%;
  height: 100%;

}

canvas {

  display: block;

  width: 100%;
  height: 100%;

}

</style>

</head>


<body>


<div
  class="scene"
  id="scene"
></div>


<script type="module">


import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js";


import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/loaders/GLTFLoader.js";


/* ------------------------- */
/* SCENE                     */
/* ------------------------- */


const container =
document.getElementById("scene");


const scene =
new THREE.Scene();


/* ------------------------- */
/* CAMERA                    */
/* ------------------------- */


const camera =
new THREE.PerspectiveCamera(

  35,

  container.clientWidth /
  container.clientHeight,

  0.01,

  1000

);


/* ------------------------- */
/* RENDERER                  */
/* ------------------------- */


const renderer =
new THREE.WebGLRenderer({

  alpha: true,

  antialias: true

});


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);


renderer.setSize(

  container.clientWidth,

  container.clientHeight

);


renderer.setClearColor(
  0x000000,
  0
);


renderer.outputColorSpace =
THREE.SRGBColorSpace;


renderer.toneMapping =
THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
1.2;


container.appendChild(
  renderer.domElement
);


/* ------------------------- */
/* LIGHTING                  */
/* ------------------------- */


const ambientLight =
new THREE.AmbientLight(

  0xffffff,

  0.6

);


scene.add(
  ambientLight
);


const keyLight =
new THREE.DirectionalLight(

  0xffffff,

  3

);


keyLight.position.set(
  -3,
  5,
  6
);


scene.add(
  keyLight
);


const fillLight =
new THREE.DirectionalLight(

  0xffffff,

  1

);


fillLight.position.set(
  4,
  1,
  4
);


scene.add(
  fillLight
);


/* ------------------------- */
/* MODEL                     */
/* ------------------------- */


const loader =
new GLTFLoader();


let oko;


loader.load(

  "./OKO.glb",


  function (gltf) {


    oko =
    gltf.scene;


    /*
      MAKE SURE MATERIALS
      RENDER CORRECTLY
    */


    oko.traverse(

      (object) => {


        if (
          object.isMesh
        ) {


          object.frustumCulled =
          false;


          object.castShadow =
          true;


          object.receiveShadow =
          true;


        }


      }

    );


    /*
      CALCULATE MODEL SIZE
    */


    const box =
    new THREE.Box3()
    .setFromObject(
      oko
    );


    const size =
    box.getSize(
      new THREE.Vector3()
    );


    const center =
    box.getCenter(
      new THREE.Vector3()
    );


    /*
      CENTER THE MODEL
      AT WORLD ORIGIN
    */


    oko.position.sub(
      center
    );


    scene.add(
      oko
    );


    /*
      FRAME THE MODEL
      AUTOMATICALLY
    */


    const maxDimension =
    Math.max(

      size.x,

      size.y,

      size.z

    );


    const fov =
    camera.fov *
    (
      Math.PI / 180
    );


    let cameraZ =
    Math.abs(
      maxDimension /
      2 /
      Math.tan(
        fov / 2
      )
    );


    cameraZ *=
    1.5;


    camera.position.set(

      0,

      0,

      cameraZ

    );


    camera.lookAt(
      0,
      0,
      0
    );


    /*
      UPDATE CAMERA CLIPPING
    */


    camera.near =
    cameraZ /
    100;


    camera.far =
    cameraZ *
    100;


    camera.updateProjectionMatrix();


    console.log(
      "OKO LOADED"
    );


    console.log(
      "MODEL SIZE:",
      size
    );


    /*
      PRINT BONES
      FOR NEXT STEP
    */


    oko.traverse(

      (object) => {


        if (
          object.isBone
        ) {


          console.log(
            "BONE:",
            object.name
          );


        }


      }

    );


  },


  function (progress) {


    console.log(

      "LOADING OKO:",

      progress.loaded,

      progress.total

    );


  },


  function (error) {


    console.error(

      "ERROR LOADING OKO:",

      error

    );


  }

);


/* ------------------------- */
/* RESIZE                    */
/* ------------------------- */


function resize() {


  const width =
  container.clientWidth;


  const height =
  container.clientHeight;


  camera.aspect =
  width /
  height;


  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height
  );


}


window.addEventListener(
  "resize",
  resize
);


/* ------------------------- */
/* RENDER LOOP               */
/* ------------------------- */


function animate() {


  requestAnimationFrame(
    animate
  );


  renderer.render(
    scene,
    camera
  );


}


animate();


</script>


</body>

</html>
