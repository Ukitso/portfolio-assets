<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    #scene {

      width: 100%;
      height: 100%;

    }


    canvas {

      display: block;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <div id="scene"></div>


  <script type="module">


    /* ------------------------- */
    /* IMPORTS                   */
    /* ------------------------- */


    import * as THREE from "three";


    import {

      GLTFLoader

    } from "three/addons/loaders/GLTFLoader.js";


    /* ------------------------- */
    /* SCENE                     */
    /* ------------------------- */


    const container =
      document.getElementById(
        "scene"
      );


    const scene =
      new THREE.Scene();


    /* ------------------------- */
    /* CAMERA                    */
    /* ------------------------- */


    const camera =
      new THREE.PerspectiveCamera(

        45,

        container.clientWidth /
        container.clientHeight,

        0.01,

        1000

      );


    /* ------------------------- */
    /* RENDERER                  */
    /* ------------------------- */


    const renderer =
      new THREE.WebGLRenderer({

        alpha: true,

        antialias: true

      );


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio,

        2

      )

    );


    renderer.setSize(

      container.clientWidth,

      container.clientHeight

    );


    renderer.setClearColor(

      0x000000,

      0

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.NoToneMapping;


    renderer.toneMappingExposure =
      1.0;


    container.appendChild(

      renderer.domElement

    );


    /* ------------------------- */
    /* LIGHTING                  */
    /* ------------------------- */


    /*
      LOW AMBIENT LIGHT

      Keeps the deep brown shadow
      areas while preventing them
      from becoming pure black.
    */


    const ambientLight =
      new THREE.AmbientLight(

        0xffffff,

        0.10

      );


    scene.add(

      ambientLight

    );


    /* ------------------------- */
    /* MAIN LIGHT                */
    /* ------------------------- */


    /*
      MAIN KEY LIGHT

      This provides the general
      shape and overall shading.
    */


    const keyLight =
      new THREE.DirectionalLight(

        0xffffff,

        2.4

      );


    keyLight.position.set(

      -2,

      5,

      9

    );


    keyLight.target.position.set(

      0,

      0,

      0

    );


    scene.add(

      keyLight

    );


    scene.add(

      keyLight.target

    );


    /* ------------------------- */
    /* LEFT EAR HIGHLIGHT        */
    /* ------------------------- */


    /*
      Deliberately aimed at the
      upper-left ear and the
      transition into the head.

      This creates the pale,
      almost creamy hotspot seen
      in the Illustrator version.
    */


    const leftHighlight =
      new THREE.SpotLight(

        0xffffff,

        5.0,

        0,

        0.38,

        0.55,

        1.5

      );


    leftHighlight.position.set(

      -4,

      5,

      7

    );


    leftHighlight.target.position.set(

      -1.5,

      1.5,

      0

    );


    scene.add(

      leftHighlight

    );


    scene.add(

      leftHighlight.target

    );


    /* ------------------------- */
    /* RIGHT EAR HIGHLIGHT       */
    /* ------------------------- */


    /*
      Separate spotlight for the
      upper-right ear.

      Slightly softer and weaker
      so it doesn't make both
      sides look perfectly
      symmetrical.
    */


    const rightHighlight =
      new THREE.SpotLight(

        0xffffff,

        4.5,

        0,

        0.42,

        0.6,

        1.5

      );


    rightHighlight.position.set(

      4,

      5,

      7

    );


    rightHighlight.target.position.set(

      1.7,

      1.8,

      0

    );


    scene.add(

      rightHighlight

    );


    scene.add(

      rightHighlight.target

    );


    /* ------------------------- */
    /* UPPER BODY HIGHLIGHT      */
    /* ------------------------- */


    /*
      Very subtle broad spotlight
      aimed at the upper body.

      This gives the body a soft
      light roll rather than
      leaving it completely flat.
    */


    const bodyHighlight =
      new THREE.SpotLight(

        0xffffff,

        1.8,

        0,

        0.65,

        0.8,

        1.2

      );


    bodyHighlight.position.set(

      -1,

      3,

      8

    );


    bodyHighlight.target.position.set(

      0,

      -1,

      0

    );


    scene.add(

      bodyHighlight

    );


    scene.add(

      bodyHighlight.target

    );


    /* ------------------------- */
    /* LOAD MODEL                */
    /* ------------------------- */


    const loader =
      new GLTFLoader();


    let oko;


    loader.load(

      "./OKO.glb",


      function (

        gltf

      ) {


        console.log(

          "OKO LOADED"

        );


        oko =
          gltf.scene;


        /* --------------------- */
        /* MATERIAL PREPARATION  */
        /* --------------------- */


        oko.traverse(

          function (

            object

          ) {


            if (

              object.isMesh

            ) {


              object.frustumCulled =
                false;


              const materials =
                Array.isArray(
                  object.material
                )

                ?

                object.material

                :

                [

                  object.material

                ];


              materials.forEach(

                function (

                  material

                ) {


                  if (

                    !material

                  ) {

                    return;

                  }


                  /*
                    SMOOTHER SURFACE

                    Allows the targeted
                    spotlights to create
                    visible highlights.
                  */


                  material.metalness =
                    0;


                  material.roughness =
                    0.28;


                  /*
                    Strong specular
                    response for the
                    creamy highlight
                    areas.
                  */


                  if (

                    "specularIntensity"
                    in material

                  ) {


                    material.specularIntensity =
                      1;


                  }


                  material.needsUpdate =
                    true;


                }

              );


            }


          }

        );


        /* --------------------- */
        /* MODEL BOUNDS          */
        /* --------------------- */


        const box =
          new THREE.Box3()
          .setFromObject(

            oko

          );


        const size =
          box.getSize(

            new THREE.Vector3()

          );


        const center =
          box.getCenter(

            new THREE.Vector3()

          );


        /*
          CENTRE MODEL
        */


        oko.position.sub(

          center

        );


        scene.add(

          oko

        );


        /* --------------------- */
        /* CAMERA FRAMING        */
        /* --------------------- */


        const maxSize =
          Math.max(

            size.x,

            size.y,

            size.z

          );


        const fov =
          THREE.MathUtils.degToRad(

            camera.fov

          );


        let distance =

          (

            maxSize / 2

          )

          /

          Math.tan(

            fov / 2

          );


        /*
          Slight breathing room
          around the character.
        */


        distance *=
          1.35;


        camera.position.set(

          0,

          0,

          distance

        );


        camera.lookAt(

          0,

          0,

          0

        );


        camera.near =
          Math.max(

            0.01,

            distance / 100

          );


        camera.far =
          distance * 100;


        camera.updateProjectionMatrix();


        console.log(

          "MODEL SIZE:",

          size

        );


      },


      function (

        progress

      ) {


        if (

          progress.total

        ) {


          console.log(

            "LOADING:",

            Math.round(

              (

                progress.loaded /

                progress.total

              )

              *

              100

            )

            +

            "%"

          );


        }


      },


      function (

        error

      ) {


        console.error(

          "FAILED TO LOAD OKO:",

          error

        );


      }

    );


    /* ------------------------- */
    /* RESIZE                    */
    /* ------------------------- */


    function resize() {


      const width =
        container.clientWidth;


      const height =
        container.clientHeight;


      if (

        width === 0 ||

        height === 0

      ) {

        return;

      }


      camera.aspect =

        width /

        height;


      camera.updateProjectionMatrix();


      renderer.setSize(

        width,

        height

      );


    }


    window.addEventListener(

      "resize",

      resize

    );


    /* ------------------------- */
    /* RENDER LOOP               */
    /* ------------------------- */


    function animate() {


      requestAnimationFrame(

        animate

      );


      renderer.render(

        scene,

        camera

      );


    }


    animate();


  </script>


</body>

</html>
