<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* FULL PAGE INTERACTION AREA */

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* THE LITTLE GUY */

    .character {
      position: absolute;

      width: 350px;
      height: 350px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
    }


    /* BODY WRAPPER */

    .body-wrapper {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      /*
        Anchor him towards
        the bottom so stretching
        feels less like floating.
      */

      transform-origin: center bottom;

      will-change: transform;
    }


    /* BODY */

    .body {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;
    }


    /* EYEBALL */

    .eye {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;

      will-change: transform;
    }

  </style>

</head>


<body>


  <div
    class="scene"
    id="scene"
  >

    <div
      class="character"
      id="character"
    >


      <!-- BODY -->

      <div
        class="body-wrapper"
        id="bodyWrapper"
      >

        <img
          src="body.png"
          class="body"
          alt=""
        >

      </div>


      <!-- EYEBALL -->

      <img
        src="eyeball.png"
        class="eye"
        id="eye"
        alt=""
      >

    </div>

  </div>


  <script>


    /* ELEMENTS */

    const scene =
      document.getElementById("scene");

    const eye =
      document.getElementById("eye");

    const bodyWrapper =
      document.getElementById("bodyWrapper");


    /* ------------------------- */
    /* EYE POSITION              */
    /* ------------------------- */


    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;


    /*
      MAXIMUM CURSOR
      EYE MOVEMENT
    */

    const maxMove = 18;


    /* ------------------------- */
    /* IDLE STATE                */
    /* ------------------------- */


    let idle = true;
    let idleTimer;


    /*
      AWARENESS RADIUS
    */

    const closeDistance = 180;
    const farDistance = 1400;


    /*
      RETURN TO IDLE
      AFTER INTERACTION STOPS
    */

    function resetIdle() {

      clearTimeout(idleTimer);

      idle = false;


      idleTimer = setTimeout(() => {

        idle = true;

        chooseIdleTarget();

      }, 2500);

    }


    /*
      PICK ACTIVE
      IDLE POSITION
    */

    function chooseIdleTarget() {

      if (!idle) return;


      targetX =
        (Math.random() * 28) - 14;


      targetY =
        (Math.random() * 20) - 10;


      setTimeout(() => {

        if (idle) {

          chooseIdleTarget();

        }

      },

      700 + Math.random() * 1300

      );

    }


    /* ------------------------- */
    /* CURSOR TRACKING           */
    /* ------------------------- */


    scene.addEventListener(
      "mousemove",
      (event) => {


        const rect =
          eye.getBoundingClientRect();


        const centerX =
          rect.left +
          rect.width / 2;


        const centerY =
          rect.top +
          rect.height / 2;


        const deltaX =
          event.clientX -
          centerX;


        const deltaY =
          event.clientY -
          centerY;


        const distance =
          Math.sqrt(
            deltaX * deltaX +
            deltaY * deltaY
          );


        let attention = 0;


        if (
          distance <= closeDistance
        ) {

          attention = 1;

        }


        else if (
          distance < farDistance
        ) {


          const progress =
            (distance - closeDistance) /
            (farDistance - closeDistance);


          const smoothProgress =
            progress *
            progress *
            (3 - 2 * progress);


          attention =
            1 -
            smoothProgress;

        }


        /*
          INTERRUPT IDLE
          WHEN HE NOTICES YOU
        */

        if (
          attention > 0.02
        ) {

          resetIdle();


          const angle =
            Math.atan2(
              deltaY,
              deltaX
            );


          targetX =
            Math.cos(angle) *
            maxMove *
            attention;


          targetY =
            Math.sin(angle) *
            maxMove *
            attention;

        }

      }
    );


    /*
      CURSOR LEAVES PAGE
    */

    scene.addEventListener(
      "mouseleave",
      () => {

        resetIdle();

      }
    );


    /* ------------------------- */
    /* BODY REACTION             */
    /* ------------------------- */


    /*
      DELAYED BODY RESPONSE

      This follows the eye
      more slowly.
    */

    let bodyFollowX = 0;
    let bodyFollowY = 0;


    function animate() {


      /* --------------------- */
      /* EYE MOVEMENT          */
      /* --------------------- */


      currentX +=
        (
          targetX -
          currentX
        ) *
        0.08;


      currentY +=
        (
          targetY -
          currentY
        ) *
        0.08;


      eye.style.transform =
        `translate(
          ${currentX}px,
          ${currentY}px
        )`;


      /* --------------------- */
      /* BODY RESPONSE         */
      /* --------------------- */


      /*
        Slower than the eye,
        giving the body weight.
      */

      bodyFollowX +=
        (
          currentX -
          bodyFollowX
        ) *
        0.035;


      bodyFollowY +=
        (
          currentY -
          bodyFollowY
        ) *
        0.035;


      /*
        LEFT / RIGHT LEAN

        No translation, only
        rotation.
      */

      const rotate =
        bodyFollowX *
        0.18;


      /*
        UP / DOWN STRETCH

        Normalise the eye
        movement to roughly
        -1 to +1.
      */

      const verticalLook =
        bodyFollowY /
        maxMove;


      /*
        Eye looking up:

        verticalLook is negative
        → scaleY increases.

        Eye looking down:

        verticalLook is positive
        → scaleY decreases.
      */

      const scaleY =
        1 -
        (
          verticalLook *
          0.12
        );


      /*
        Opposite horizontal
        squash keeps him feeling
        more organic.
      */

      const scaleX =
        1 +
        (
          verticalLook *
          0.07
        );


      /*
        APPLY BODY TRANSFORM

        No translateY.
        No floating.
      */

      bodyWrapper.style.transform =
        `
          rotate(${rotate}deg)
          scale(${scaleX}, ${scaleY})
        `;


      requestAnimationFrame(
        animate
      );

    }


    /* START */

    animate();
    chooseIdleTarget();


  </script>


</body>

</html>
