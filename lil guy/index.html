<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>

    /* PAGE */

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* FULL INTERACTION AREA */

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* THE LITTLE GUY */

    .character {
      position: absolute;

      width: 350px;
      height: 350px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
    }


    /* BODY + EYEBALL */

    .body,
    .eye {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;
    }


    /* EYEBALL */

    .eye {
      will-change: transform;
    }

  </style>

</head>


<body>


  <!-- FULL PAGE INTERACTION AREA -->

  <div
    class="scene"
    id="scene"
  >


    <!-- CHARACTER -->

    <div
      class="character"
      id="character"
    >


      <!-- BODY -->

      <img
        src="body.png"
        class="body"
        alt=""
      >


      <!-- EYEBALL -->

      <img
        src="eyeball.png"
        class="eye"
        id="eye"
        alt=""
      >


    </div>


  </div>


  <script>


    /* ELEMENTS */

    const scene =
      document.getElementById("scene");

    const eye =
      document.getElementById("eye");


    /* EYE POSITION */

    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;


    /* HOW FAR THE EYE CAN MOVE */

    const maxMove = 18;


    /*
      AWARENESS RADIUS

      Inside closeDistance:
      fully focused.

      Between closeDistance
      and farDistance:
      gradually becomes aware.

      Outside farDistance:
      idle.
    */

    const closeDistance = 180;
    const farDistance = 800;


    /* IDLE POSITION */

    let idleX = 0;
    let idleY = 0;

    let idleTargetX = 0;
    let idleTargetY = 0;


    /* CURSOR POSITION */

    let cursorX = null;
    let cursorY = null;


    /* ATTENTION */

    let attention = 0;
    let targetAttention = 0;


    /*
      PICK A NEW IDLE
      LOOKING DIRECTION
    */

    function chooseIdleDirection() {

      const angle =
        Math.random() *
        Math.PI *
        2;


      /*
        Random distance means
        he doesn't always look
        all the way to the edge.
      */

      const distance =
        Math.random() *
        maxMove *
        0.8;


      idleTargetX =
        Math.cos(angle) *
        distance;


      idleTargetY =
        Math.sin(angle) *
        distance;

    }


    /*
      WAIT, THEN LOOK
      SOMEWHERE ELSE
    */

    function scheduleIdleLook() {

      const delay =
        2000 +
        Math.random() *
        3000;


      setTimeout(() => {

        chooseIdleDirection();

        scheduleIdleLook();

      }, delay);

    }


    /* START IDLE */

    chooseIdleDirection();
    scheduleIdleLook();


    /*
      TRACK CURSOR
    */

    scene.addEventListener(
      "mousemove",
      (event) => {

        cursorX =
          event.clientX;

        cursorY =
          event.clientY;

      }
    );


    /*
      CURSOR LEAVES
      INTERACTION AREA
    */

    scene.addEventListener(
      "mouseleave",
      () => {

        cursorX = null;
        cursorY = null;

        targetAttention = 0;

      }
    );


    /*
      CALCULATE
      HOW AWARE HE IS
    */

    function updateAttention() {


      if (
        cursorX === null ||
        cursorY === null
      ) {

        targetAttention = 0;
        return;

      }


      /*
        USE ACTUAL EYE
        AS THE CENTRE
      */

      const rect =
        eye.getBoundingClientRect();


      const centerX =
        rect.left +
        rect.width / 2;


      const centerY =
        rect.top +
        rect.height / 2;


      const deltaX =
        cursorX -
        centerX;


      const deltaY =
        cursorY -
        centerY;


      /*
        TRUE STRAIGHT-LINE
        DISTANCE
      */

      const distance =
        Math.sqrt(
          deltaX * deltaX +
          deltaY * deltaY
        );


      /*
        ATTENTION VALUE

        1 = fully watching
        0 = fully idle
      */

      if (
        distance <= closeDistance
      ) {

        targetAttention = 1;

      }


      else if (
        distance >= farDistance
      ) {

        targetAttention = 0;

      }


      else {


        /*
          NORMALISE DISTANCE

          0 = close
          1 = far
        */

        const progress =
          (distance - closeDistance) /
          (farDistance - closeDistance);


        /*
          SMOOTHSTEP EASING
        */

        const smoothProgress =
          progress *
          progress *
          (3 - 2 * progress);


        targetAttention =
          1 -
          smoothProgress;

      }

    }


    /*
      MAIN ANIMATION
    */

    function animateEye() {


      /* UPDATE AWARENESS */

      updateAttention();


      /*
        SMOOTHLY FADE
        BETWEEN IDLE
        AND CURSOR TRACKING
      */

      attention +=
        (
          targetAttention -
          attention
        ) *
        0.03;


      /*
        SMOOTHLY MOVE
        TOWARDS IDLE TARGET
      */

      idleX +=
        (
          idleTargetX -
          idleX
        ) *
        0.01;


      idleY +=
        (
          idleTargetY -
          idleY
        ) *
        0.01;


      /*
        CURSOR LOOKING TARGET
      */

      let cursorTargetX = 0;
      let cursorTargetY = 0;


      if (
        cursorX !== null &&
        cursorY !== null
      ) {


        const rect =
          eye.getBoundingClientRect();


        const centerX =
          rect.left +
          rect.width / 2;


        const centerY =
          rect.top +
          rect.height / 2;


        const deltaX =
          cursorX -
          centerX;


        const deltaY =
          cursorY -
          centerY;


        const angle =
          Math.atan2(
            deltaY,
            deltaX
          );


        cursorTargetX =
          Math.cos(angle) *
          maxMove;


        cursorTargetY =
          Math.sin(angle) *
          maxMove;

      }


      /*
        BLEND IDLE + CURSOR

        attention = 0
        → fully idle

        attention = 1
        → fully watching
      */

      targetX =
        idleX *
        (1 - attention) +

        cursorTargetX *
        attention;


      targetY =
        idleY *
        (1 - attention) +

        cursorTargetY *
        attention;


      /*
        FINAL SMOOTH
        EYE MOVEMENT
      */

      currentX +=
        (
          targetX -
          currentX
        ) *
        0.05;


      currentY +=
        (
          targetY -
          currentY
        ) *
        0.05;


      eye.style.transform =
        `translate(${currentX}px, ${currentY}px)`;


      requestAnimationFrame(
        animateEye
      );

    }


    /* START */

    animateEye();


  </script>


</body>

</html>
