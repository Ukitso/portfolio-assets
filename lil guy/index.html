<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* FULL INTERACTION AREA */

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* CHARACTER */

    .character {
      position: absolute;

      width: 350px;
      height: 350px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
    }

    /* BODY + EYE */

    .body,
    .eye {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;
    }

    .eye {
      will-change: transform;
    }

  </style>

</head>


<body>

  <div class="scene" id="scene">

    <div class="character" id="character">

      <img
        src="body.png"
        class="body"
        alt=""
      >

      <img
        src="eyeball.png"
        class="eye"
        id="eye"
        alt=""
      >

    </div>

  </div>


  <script>

    const scene = document.getElementById("scene");
    const character = document.getElementById("character");
    const eye = document.getElementById("eye");


    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;


    /* MAXIMUM EYE MOVEMENT */

    const maxMove = 18;


    /* ATTENTION RANGE */

    const closeDistance = 250;
    const farDistance = 600;


    scene.addEventListener("mousemove", (event) => {

      const rect = character.getBoundingClientRect();

      const centerX =
        rect.left + rect.width / 2;

      const centerY =
        rect.top + rect.height / 2;


      const deltaX =
        event.clientX - centerX;

      const deltaY =
        event.clientY - centerY;


      const distance =
        Math.sqrt(
          deltaX * deltaX +
          deltaY * deltaY
        );


      let attention;


      if (distance <= closeDistance) {

        attention = 1;

      } else if (distance >= farDistance) {

        attention = 0;

      } else {

        attention =
          1 -
          (
            (distance - closeDistance) /
            (farDistance - closeDistance)
          );

      }


      const angle =
        Math.atan2(deltaY, deltaX);


      targetX =
        Math.cos(angle) *
        maxMove *
        attention;


      targetY =
        Math.sin(angle) *
        maxMove *
        attention;

    });


    scene.addEventListener("mouseleave", () => {

      targetX = 0;
      targetY = 0;

    });


    function animateEye() {

      currentX +=
        (targetX - currentX) * 0.06;

      currentY +=
        (targetY - currentY) * 0.06;


      eye.style.transform =
        `translate(${currentX}px, ${currentY}px)`;


      requestAnimationFrame(animateEye);

    }


    animateEye();

  </script>

</body>

</html>
