<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- THREE.JS IMPORT MAP -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    #scene {

      width: 100%;
      height: 100%;

    }


    canvas {

      display: block;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <div id="scene"></div>


  <script type="module">


    import * as THREE from "three";


    import {
      GLTFLoader
    } from "three/addons/loaders/GLTFLoader.js";


    /* ------------------------- */
    /* SCENE                     */
    /* ------------------------- */


    const container =
      document.getElementById("scene");


    const scene =
      new THREE.Scene();


    /* ------------------------- */
    /* CAMERA                    */
    /* ------------------------- */


    const camera =
      new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

      );


    /* ------------------------- */
    /* RENDERER                  */
    /* ------------------------- */


    const renderer =
      new THREE.WebGLRenderer({

        alpha: true,

        antialias: true

      });


    renderer.setSize(

      window.innerWidth,
      window.innerHeight

    );


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio,

        2

      )

    );


    /*
      TRANSPARENT BACKGROUND
    */


    renderer.setClearColor(

      0x000000,

      0

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    /*
      SOFT HIGHLIGHT / SHADOW
      RESPONSE
    */


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.0;


    container.appendChild(
      renderer.domElement
    );


    /* ------------------------- */
    /* LIGHTING                  */
    /* ------------------------- */


    /*
      VERY LOW AMBIENT LIGHT

      Keeps the shadow areas
      genuinely dark, closer
      to the Illustrator logo.
    */


    const ambientLight =
      new THREE.AmbientLight(

        0xffe0d0,

        0.08

      );


    scene.add(
      ambientLight
    );


    /*
      MAIN LIGHT

      High and to the
      right/front of Oko.

      This should create the
      bright top/right surfaces
      and strong shadow on the
      opposite side.
    */


    const keyLight =
      new THREE.PointLight(

        0xffd0b5,

        100,

        0

      );


    keyLight.position.set(

      4,

      5,

      6

    );


    scene.add(
      keyLight
    );


    /*
      VERY SUBTLE EDGE FILL

      Just enough to keep the
      dark side visible without
      flattening the shadows.
    */


    const edgeLight =
      new THREE.PointLight(

        0xff5c28,

        6,

        0

      );


    edgeLight.position.set(

      -4,

      1,

      3

    );


    scene.add(
      edgeLight
    );


    /* ------------------------- */
    /* LOAD OKO                  */
    /* ------------------------- */


    const loader =
      new GLTFLoader();


    let oko;


    loader.load(

      "./OKO.glb",


      (gltf) => {


        console.log(
          "OKO LOADED"
        );


        oko =
          gltf.scene;


        /*
          PREPARE MODEL
        */


        oko.traverse(

          (object) => {


            if (
              object.isMesh
            ) {


              object.frustumCulled =
                false;


            }


          }

        );


        /*
          FIND MODEL SIZE
        */


        const box =
          new THREE.Box3()
          .setFromObject(
            oko
          );


        const size =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        /*
          CENTRE OKO
        */


        oko.position.sub(
          center
        );


        scene.add(
          oko
        );


        /*
          FIT CAMERA TO MODEL
        */


        const maxSize =
          Math.max(

            size.x,

            size.y,

            size.z

          );


        const fov =
          camera.fov *
          (
            Math.PI /
            180
          );


        let distance =
          (
            maxSize /
            2
          ) /
          Math.tan(
            fov /
            2
          );


        /*
          LEAVE SOME SPACE
          AROUND OKO
        */


        distance *=
          1.35;


        camera.position.set(

          0,

          0,

          distance

        );


        camera.lookAt(

          0,

          0,

          0

        );


        camera.near =
          Math.max(

            0.01,

            distance /
            100

          );


        camera.far =
          distance *
          100;


        camera.updateProjectionMatrix();


        console.log(
          "MODEL SIZE:",
          size
        );


      },


      undefined,


      (error) => {


        console.error(

          "FAILED TO LOAD OKO:",

          error

        );


      }

    );


    /* ------------------------- */
    /* RESIZE                    */
    /* ------------------------- */


    window.addEventListener(

      "resize",

      () => {


        camera.aspect =

          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );


      }

    );


    /* ------------------------- */
    /* RENDER LOOP               */
    /* ------------------------- */


    function animate() {


      requestAnimationFrame(
        animate
      );


      renderer.render(

        scene,

        camera

      );


    }


    animate();


  </script>


</body>

</html>
