<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oko</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #oko-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="oko-container"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// SETUP
// ============================================================

const container = document.getElementById("oko-container");

const scene = new THREE.Scene();


// ============================================================
// CAMERA
// ============================================================

const camera = new THREE.PerspectiveCamera(
  45,
  container.clientWidth / container.clientHeight,
  0.01,
  1000
);


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setClearColor(
  0x000000,
  0
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.NoToneMapping;

renderer.toneMappingExposure = 1.0;

container.appendChild(
  renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

// Ambient
const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    0.45
  );

scene.add(
  ambientLight
);


// Main light
const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    1.8
  );

directionalLight.position.set(
  4,
  5,
  6
);

scene.add(
  directionalLight
);


// Small fill
const fillLight =
  new THREE.DirectionalLight(
    0xffffff,
    0.15
  );

fillLight.position.set(
  -4,
  2,
  3
);

scene.add(
  fillLight
);


// ============================================================
// MODEL
// ============================================================

const loader =
  new GLTFLoader();

let oko = null;

let eyeball = null;

let eyeballBasePosition =
  new THREE.Vector3();


// This will be calculated from the model
let eyeMovementAmount = 0;


// ------------------------------------------------------------
// LOAD
// ------------------------------------------------------------

loader.load(

  "./OKO.glb",

  function(gltf) {

    console.log("OKO LOADED");


    oko = gltf.scene;


    // ========================================================
    // OKO HIERARCHY LOGGER
    // ========================================================

    console.log(
      "========== OKO HIERARCHY =========="
    );

    oko.traverse(function(object) {

      console.log(
        object.type,
        "|",
        object.name || "(unnamed)"
      );

    });

    console.log(
      "========== END HIERARCHY =========="
    );


    // --------------------------------------------------------
    // FIND EYEBALL
    // --------------------------------------------------------

    oko.traverse(function(object) {

      if (
        object.name === "EYEBALL"
      ) {

        eyeball = object;

        eyeballBasePosition.copy(
          eyeball.position
        );

        console.log(
          "EYEBALL FOUND:",
          eyeball.name
        );

      }

    });


    // --------------------------------------------------------
    // CENTRE MODEL
    // --------------------------------------------------------

    const box =
      new THREE.Box3()
        .setFromObject(oko);

    const size =
      box.getSize(
        new THREE.Vector3()
      );

    const center =
      box.getCenter(
        new THREE.Vector3()
      );

    oko.position.sub(
      center
    );


    scene.add(
      oko
    );


    // --------------------------------------------------------
    // EYE MOVEMENT SCALE
    // --------------------------------------------------------

    eyeMovementAmount =
      Math.max(
        size.x,
        size.y,
        size.z
      ) * 0.045;


    console.log(
      "Eye movement amount:",
      eyeMovementAmount
    );


    // --------------------------------------------------------
    // CAMERA FRAMING
    // --------------------------------------------------------

    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );

    const fov =
      THREE.MathUtils.degToRad(
        camera.fov
      );

    let distance =
      (maxSize / 2) /
      Math.tan(fov / 2);

    distance *= 1.35;


    camera.position.set(
      0,
      0,
      distance
    );

    camera.lookAt(
      0,
      0,
      0
    );


    camera.near =
      Math.max(
        0.01,
        distance / 100
      );

    camera.far =
      distance * 100;

    camera.updateProjectionMatrix();

  },

  undefined,

  function(error) {

    console.error(
      "FAILED TO LOAD OKO:",
      error
    );

  }

);


// ============================================================
// EYE TRACKING
// ============================================================

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;

let idle = true;

let idleTimer;


// ============================================================
// RESET IDLE
// ============================================================

function resetIdle() {

  clearTimeout(
    idleTimer
  );

  idle = false;


  idleTimer = setTimeout(
    function() {

      idle = true;

      chooseIdleTarget();

    },
    2500
  );

}


// ============================================================
// IDLE EYE MOVEMENT
// ============================================================

function chooseIdleTarget() {

  if (!idle) return;


  targetX =
    THREE.MathUtils.randFloat(
      -0.45,
      0.45
    );

  targetY =
    THREE.MathUtils.randFloat(
      -0.3,
      0.3
    );


  setTimeout(
    function() {

      if (idle) {
        chooseIdleTarget();
      }

    },
    THREE.MathUtils.randFloat(
      1000,
      2500
    )
  );

}


// ============================================================
// MOUSE
// ============================================================

document.addEventListener(
  "mousemove",
  function(e) {

    resetIdle();


    // Normalised mouse position
    // between roughly -1 and +1.

    const mouseX =
      (
        e.clientX /
        window.innerWidth
      ) * 2 - 1;


    const mouseY =
      (
        e.clientY /
        window.innerHeight
      ) * 2 - 1;


    // Keep movement small.

    targetX =
      mouseX * 0.45;

    targetY =
      mouseY * 0.30;

  }
);


// ============================================================
// ANIMATION
// ============================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  // ----------------------------------------------------------
  // SMOOTH EYE MOVEMENT
  // ----------------------------------------------------------

  currentX +=
    (
      targetX -
      currentX
    ) * 0.08;


  currentY +=
    (
      targetY -
      currentY
    ) * 0.08;


  // ----------------------------------------------------------
  // EYEBALL
  // ----------------------------------------------------------

  if (
    eyeball &&
    eyeMovementAmount > 0
  ) {

    // These are the axis directions
    // that worked with your model.

    eyeball.position.x =
      eyeballBasePosition.x
      + currentX * eyeMovementAmount;


    eyeball.position.y =
      eyeballBasePosition.y
      - currentY * eyeMovementAmount;


    eyeball.position.z =
      eyeballBasePosition.z;

  }


  // ----------------------------------------------------------
  // RENDER
  // ----------------------------------------------------------

  renderer.render(
    scene,
    camera
  );

}


// ============================================================
// RESIZE
// ============================================================

function resize() {

  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if (
    width === 0 ||
    height === 0
  ) {
    return;
  }


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height
  );

}


window.addEventListener(
  "resize",
  resize
);


// ============================================================
// START
// ============================================================

resize();

animate();

chooseIdleTarget();

</script>

</body>
</html>
