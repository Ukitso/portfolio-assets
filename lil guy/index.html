<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oko Test</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1B1C1C;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ========================================
// SCENE
// ========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x1B1C1C);


// ========================================
// CAMERA
// ========================================

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);


// ========================================
// RENDERER
// ========================================

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);


// ========================================
// LIGHTING
// ========================================

const ambientLight = new THREE.AmbientLight(
  0xffffff,
  2
);

scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

directionalLight.position.set(3, 5, 5);

scene.add(directionalLight);


// ========================================
// OKO VARIABLES
// ========================================

let oko = null;

let eyeballBone = null;
let eyeballMesh = null;
let head = null;


// ========================================
// EYE SETTINGS
// ========================================

const eyeRangeX = 0.16;
const eyeRangeY = 0.12;

const eyeOffsetY = 0.05;

const eyeBasePosition = new THREE.Vector3();

let eyeCurrentX = 0;
let eyeCurrentY = 0;

let eyeTargetX = 0;
let eyeTargetY = 0;


// ========================================
// IDLE SETTINGS
// ========================================

const idleDelay = 2500;

const idleRangeX = 0.10;
const idleRangeY = 0.07;

let isIdle = false;

let idleTimer = null;
let idleLookTimer = null;


// ========================================
// HEAD SETTINGS
// ========================================

const headBaseRotation = new THREE.Euler();

let headCurrentX = 0;
let headCurrentY = 0;
let headCurrentZ = 0;


// ========================================
// HEAD IDLE SETTINGS
// ========================================

// Maximum amount of independent idle head movement.

const headIdleRangeX = 0.025;
const headIdleRangeY = 0.035;
const headIdleRangeZ = 0.045;


// Current idle head offset.

let headIdleTargetX = 0;
let headIdleTargetY = 0;
let headIdleTargetZ = 0;

let headIdleCurrentX = 0;
let headIdleCurrentY = 0;
let headIdleCurrentZ = 0;


// Timer for the next little head movement.

let headIdleTimer = null;


// ========================================
// CHOOSE HEAD IDLE MOVEMENT
// ========================================

function chooseHeadIdleMovement() {

  if (!isIdle) {
    return;
  }


  // Random tiny movement.

  headIdleTargetX =
    THREE.MathUtils.randFloat(
      -headIdleRangeX,
      headIdleRangeX
    );


  headIdleTargetY =
    THREE.MathUtils.randFloat(
      -headIdleRangeY,
      headIdleRangeY
    );


  headIdleTargetZ =
    THREE.MathUtils.randFloat(
      -headIdleRangeZ,
      headIdleRangeZ
    );


  // Wait before the next movement.

  const delay =
    THREE.MathUtils.randFloat(
      2500,
      5000
    );


  clearTimeout(headIdleTimer);


  headIdleTimer = setTimeout(
    chooseHeadIdleMovement,
    delay
  );

}


// ========================================
// START IDLE
// ========================================

function startIdle() {

  if (isIdle) {
    return;
  }

  isIdle = true;

  chooseIdleLook();

  chooseHeadIdleMovement();

}


// ========================================
// CHOOSE IDLE EYE LOOK
// ========================================

function chooseIdleLook() {

  if (!isIdle) {
    return;
  }


  eyeTargetX =
    THREE.MathUtils.randFloat(
      -idleRangeX,
      idleRangeX
    );


  eyeTargetY =
    THREE.MathUtils.randFloat(
      -idleRangeY,
      idleRangeY
    );


  const delay =
    THREE.MathUtils.randFloat(
      1000,
      2500
    );


  clearTimeout(idleLookTimer);


  idleLookTimer = setTimeout(
    chooseIdleLook,
    delay
  );

}


// ========================================
// EXIT IDLE
// ========================================

function exitIdle() {

  if (!isIdle) {
    return;
  }

  isIdle = false;


  clearTimeout(idleLookTimer);
  clearTimeout(headIdleTimer);


  // Return idle head movement to neutral.

  headIdleTargetX = 0;
  headIdleTargetY = 0;
  headIdleTargetZ = 0;

}


// ========================================
// MOUSE
// ========================================

window.addEventListener(
  "mousemove",
  (event) => {


    // Mouse movement wakes Oko.

    exitIdle();


    // Reset idle timer.

    clearTimeout(idleTimer);


    idleTimer = setTimeout(
      startIdle,
      idleDelay
    );


    // ------------------------------------
    // NORMALIZED MOUSE POSITION
    // ------------------------------------

    const normalizedX =
      (event.clientX - window.innerWidth / 2) /
      (window.innerWidth / 2);


    const normalizedY =
      (event.clientY - window.innerHeight / 2) /
      (window.innerHeight / 2);


    // ------------------------------------
    // EYE TARGET
    // ------------------------------------

    eyeTargetX =
      normalizedX * eyeRangeX;


    eyeTargetY =
      -normalizedY * eyeRangeY;

  }
);


// ========================================
// LOAD GLB
// ========================================

const loader = new GLTFLoader();

loader.load(

  "./OKO.glb",

  (gltf) => {

    oko = gltf.scene;

    scene.add(oko);


    console.log("================================");
    console.log("OKO LOADED");
    console.log("================================");


    oko.traverse((object) => {

      console.log(
        object.type,
        object.name
      );

    });


    // ------------------------------------
    // GET BONES
    // ------------------------------------

    eyeballBone =
      oko.getObjectByName("Eyeball");


    eyeballMesh =
      oko.getObjectByName("EYEBALL");


    head =
      oko.getObjectByName("HEAD");


    console.log(
      "Eyeball BONE:",
      eyeballBone
    );

    console.log(
      "Eyeball MESH:",
      eyeballMesh
    );

    console.log(
      "Head:",
      head
    );


    // ------------------------------------
    // SAVE EYE POSITION
    // ------------------------------------

    if (eyeballBone) {

      eyeBasePosition.copy(
        eyeballBone.position
      );

    }


    // ------------------------------------
    // SAVE HEAD ROTATION
    // ------------------------------------

    if (head) {

      headBaseRotation.copy(
        head.rotation
      );

    }


    // ------------------------------------
    // CENTRE OKO
    // ------------------------------------

    const box =
      new THREE.Box3().setFromObject(oko);


    const center =
      box.getCenter(
        new THREE.Vector3()
      );


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    oko.position.sub(center);


    // ------------------------------------
    // CAMERA
    // ------------------------------------

    const maxDimension =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    const fitHeightDistance =
      maxDimension /
      (
        2 *
        Math.tan(
          THREE.MathUtils.degToRad(
            camera.fov / 2
          )
        )
      );


    const cameraDistance =
      fitHeightDistance * 1.5;


    camera.position.set(
      0,
      0,
      cameraDistance
    );


    camera.lookAt(
      0,
      0,
      0
    );

  },


  // --------------------------------------
  // LOADING
  // --------------------------------------

  (progress) => {

    if (progress.total) {

      const percent =
        (progress.loaded / progress.total) * 100;


      console.log(
        "Loading Oko:",
        percent.toFixed(0) + "%"
      );

    }

  },


  // --------------------------------------
  // ERROR
  // --------------------------------------

  (error) => {

    console.error(
      "COULD NOT LOAD OKO:",
      error
    );

  }

);


// ========================================
// ANIMATION LOOP
// ========================================

function animate() {

  requestAnimationFrame(animate);


  // ======================================
  // EYE
  // ======================================

  if (eyeballBone) {

    eyeCurrentX +=
      (
        eyeTargetX -
        eyeCurrentX
      ) * 0.08;


    eyeCurrentY +=
      (
        eyeTargetY -
        eyeCurrentY
      ) * 0.08;


    eyeballBone.position.x =
      eyeBasePosition.x +
      eyeCurrentX;


    eyeballBone.position.y =
      eyeBasePosition.y +
      eyeOffsetY +
      eyeCurrentY;

  }


  // ======================================
  // HEAD
  // ======================================

  if (head) {


    // ------------------------------------
    // HEAD FOLLOWS EYE
    // ------------------------------------

    const headTargetY =
      eyeCurrentX * 1.4;


    const headTargetX =
      -eyeCurrentY * 1.0;


    const headTargetZ =
      eyeCurrentX * -0.5;


    // ------------------------------------
    // NORMAL HEAD FOLLOW
    // ------------------------------------

    headCurrentY +=
      (
        headTargetY -
        headCurrentY
      ) * 0.035;


    headCurrentX +=
      (
        headTargetX -
        headCurrentX
      ) * 0.035;


    headCurrentZ +=
      (
        headTargetZ -
        headCurrentZ
      ) * 0.035;


    // ------------------------------------
    // IDLE HEAD
    // ------------------------------------

    headIdleCurrentX +=
      (
        headIdleTargetX -
        headIdleCurrentX
      ) * 0.015;


    headIdleCurrentY +=
      (
        headIdleTargetY -
        headIdleCurrentY
      ) * 0.015;


    headIdleCurrentZ +=
      (
        headIdleTargetZ -
        headIdleCurrentZ
      ) * 0.015;


    // ------------------------------------
    // COMBINE HEAD MOVEMENT
    // ------------------------------------

    head.rotation.x =
      headBaseRotation.x +
      headCurrentX +
      headIdleCurrentX;


    head.rotation.y =
      headBaseRotation.y +
      headCurrentY +
      headIdleCurrentY;


    head.rotation.z =
      headBaseRotation.z +
      headCurrentZ +
      headIdleCurrentZ;

  }


  // ======================================
  // RENDER
  // ======================================

  renderer.render(
    scene,
    camera
  );

}


// ========================================
// START
// ========================================

animate();


// ========================================
// RESIZE
// ========================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
