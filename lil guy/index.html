<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>


<!-- ------------------------- -->
<!-- THREE.JS IMPORT MAP       -->
<!-- ------------------------- -->

<script type="importmap">

{
  "imports": {

    "three":
    "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",

    "three/addons/":
    "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"

  }
}

</script>


<style>

html,
body {

  margin: 0;
  width: 100%;
  height: 100%;

  overflow: hidden;

  background: transparent;

}


.scene {

  width: 100%;
  height: 100%;

}


canvas {

  display: block;

  width: 100%;
  height: 100%;

}

</style>

</head>


<body>


<div
  class="scene"
  id="scene"
></div>


<script type="module">


/* ------------------------- */
/* IMPORT THREE.JS           */
/* ------------------------- */


import * as THREE from
"three";


import { GLTFLoader } from
"three/addons/loaders/GLTFLoader.js";


/* ------------------------- */
/* CONTAINER                 */
/* ------------------------- */


const container =
document.getElementById("scene");


/* ------------------------- */
/* SCENE                     */
/* ------------------------- */


const scene =
new THREE.Scene();


/* ------------------------- */
/* CAMERA                    */
/* ------------------------- */


const camera =
new THREE.PerspectiveCamera(

  35,

  container.clientWidth /
  container.clientHeight,

  0.01,

  1000

);


/* ------------------------- */
/* RENDERER                  */
/* ------------------------- */


const renderer =
new THREE.WebGLRenderer({

  alpha: true,

  antialias: true

});


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);


renderer.setSize(

  container.clientWidth,

  container.clientHeight

);


renderer.setClearColor(

  0x000000,

  0

);


renderer.outputColorSpace =
THREE.SRGBColorSpace;


renderer.toneMapping =
THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
1.2;


container.appendChild(
  renderer.domElement
);


/* ------------------------- */
/* LIGHTING                  */
/* ------------------------- */


/*
  GENERAL LIGHT

  Keeps the model visible
  without making it flat.
*/


const ambientLight =
new THREE.AmbientLight(

  0xffffff,

  0.6

);


scene.add(
  ambientLight
);


/*
  MAIN LIGHT

  Above and slightly
  camera-left.
*/


const keyLight =
new THREE.DirectionalLight(

  0xffffff,

  3

);


keyLight.position.set(

  -3,

  5,

  6

);


scene.add(
  keyLight
);


/*
  SOFT FILL LIGHT
*/


const fillLight =
new THREE.DirectionalLight(

  0xffffff,

  1

);


fillLight.position.set(

  4,

  1,

  4

);


scene.add(
  fillLight
);


/* ------------------------- */
/* LOAD OKO                  */
/* ------------------------- */


const loader =
new GLTFLoader();


let oko;


loader.load(

  "./OKO.glb",


  function (gltf) {


    console.log(
      "OKO LOADED"
    );


    oko =
    gltf.scene;


    /*
      PREPARE MESHES
    */


    oko.traverse(

      (object) => {


        if (
          object.isMesh
        ) {


          object.frustumCulled =
          false;


          object.castShadow =
          true;


          object.receiveShadow =
          true;


        }


      }

    );


    /*
      GET MODEL BOUNDS
    */


    const box =
    new THREE.Box3()
    .setFromObject(
      oko
    );


    const size =
    box.getSize(
      new THREE.Vector3()
    );


    const center =
    box.getCenter(
      new THREE.Vector3()
    );


    console.log(
      "MODEL SIZE:",
      size
    );


    /*
      CENTER OKO
    */


    oko.position.sub(
      center
    );


    /*
      ADD TO SCENE
    */


    scene.add(
      oko
    );


    /*
      AUTOMATIC CAMERA
      POSITIONING
    */


    const maxDimension =
    Math.max(

      size.x,

      size.y,

      size.z

    );


    const fov =
    camera.fov *
    (
      Math.PI /
      180
    );


    let cameraZ =
    Math.abs(

      maxDimension /
      2 /

      Math.tan(
        fov / 2
      )

    );


    /*
      GIVE OKO SOME
      BREATHING ROOM
    */


    cameraZ *=
    1.6;


    camera.position.set(

      0,

      0,

      cameraZ

    );


    camera.lookAt(

      0,

      0,

      0

    );


    /*
      UPDATE CAMERA
      CLIPPING
    */


    camera.near =
    Math.max(

      cameraZ / 100,

      0.001

    );


    camera.far =
    cameraZ *
    100;


    camera.updateProjectionMatrix();


    /*
      PRINT BONE NAMES
      FOR THE NEXT STEP
    */


    oko.traverse(

      (object) => {


        if (
          object.isBone
        ) {


          console.log(

            "BONE:",

            object.name

          );


        }


      }

    );


  },


  function (progress) {


    if (
      progress.total
    ) {


      console.log(

        "LOADING:",

        Math.round(

          (
            progress.loaded /
            progress.total
          ) * 100

        ) + "%"

      );


    }


  },


  function (error) {


    console.error(

      "ERROR LOADING OKO:",

      error

    );


  }

);


/* ------------------------- */
/* RESIZE                    */
/* ------------------------- */


function resize() {


  const width =
  container.clientWidth;


  const height =
  container.clientHeight;


  camera.aspect =
  width /
  height;


  camera.updateProjectionMatrix();


  renderer.setSize(

    width,

    height

  );


}


window.addEventListener(

  "resize",

  resize

);


/* ------------------------- */
/* ANIMATION LOOP            */
/* ------------------------- */


function animate() {


  requestAnimationFrame(
    animate
  );


  renderer.render(

    scene,

    camera

  );


}


animate();


</script>


</body>

</html>
