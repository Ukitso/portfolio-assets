<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* FULL PAGE INTERACTION AREA */

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* THE LITTLE GUY */

    .character {
      position: absolute;

      width: 350px;
      height: 350px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
    }


    /* BODY + EYEBALL */

    .body,
    .eye {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;
    }


    .eye {
      will-change: transform;
    }

  </style>

</head>


<body>


  <div
    class="scene"
    id="scene"
  >


    <div
      class="character"
      id="character"
    >


      <!-- BODY -->

      <img
        src="body.png"
        class="body"
        alt=""
      >


      <!-- EYEBALL -->

      <img
        src="eyeball.png"
        class="eye"
        id="eye"
        alt=""
      >


    </div>


  </div>


  <script>


    /* ELEMENTS */

    const scene =
      document.getElementById("scene");

    const eye =
      document.getElementById("eye");


    /* EYE POSITION */

    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;


    /*
      IDLE STATE

      Starts true so he begins
      looking around immediately.
    */

    let idle = true;
    let idleTimer;


    /*
      AWARENESS RADIUS

      closeDistance =
      fully interested

      farDistance =
      fully idle
    */

    const closeDistance = 180;
    const farDistance = 800;


    /*
      MAXIMUM EYE MOVEMENT
    */

    const maxMove = 18;


    /*
      SMOOTHLY RETURN
      TO IDLE AFTER
      LOSING INTEREST
    */

    function resetIdle() {

      clearTimeout(idleTimer);

      idle = false;


      idleTimer = setTimeout(() => {

        idle = true;

        chooseIdleTarget();

      }, 2500);

    }


    /*
      PICK A RANDOM
      IDLE LOOKING POSITION

      Based directly on the
      smaller logo behaviour.
    */

    function chooseIdleTarget() {

      if (!idle) return;


      targetX =
        (Math.random() * 12) - 6;


      targetY =
        (Math.random() * 8) - 4;


      setTimeout(() => {

        if (idle) {

          chooseIdleTarget();

        }

      },

      1000 + Math.random() * 1500

      );

    }


    /*
      TRACK CURSOR
      ACROSS FULL LANDING AREA
    */

    scene.addEventListener(
      "mousemove",
      (event) => {


        /*
          GET ACTUAL POSITION
          OF THE EYE
        */

        const rect =
          eye.getBoundingClientRect();


        const centerX =
          rect.left +
          rect.width / 2;


        const centerY =
          rect.top +
          rect.height / 2;


        /*
          CURSOR DISTANCE
          FROM EYE
        */

        const deltaX =
          event.clientX -
          centerX;


        const deltaY =
          event.clientY -
          centerY;


        const distance =
          Math.sqrt(
            deltaX * deltaX +
            deltaY * deltaY
          );


        /*
          NORMALISE DISTANCE
          INTO ATTENTION
        */

        let attention = 0;


        if (
          distance <= closeDistance
        ) {

          attention = 1;

        }


        else if (
          distance < farDistance
        ) {


          const progress =
            (distance - closeDistance) /
            (farDistance - closeDistance);


          /*
            SMOOTHSTEP

            Makes the radius
            feel softer.
          */

          const smoothProgress =
            progress *
            progress *
            (3 - 2 * progress);


          attention =
            1 -
            smoothProgress;

        }


        /*
          ONLY INTERRUPT IDLE
          WHEN HE ACTUALLY
          NOTICES YOU
        */

        if (
          attention > 0.05
        ) {

          resetIdle();


          /*
            DIRECTION
            TOWARDS CURSOR
          */

          const angle =
            Math.atan2(
              deltaY,
              deltaX
            );


          /*
            CURSOR MOVEMENT
            SCALES WITH
            ATTENTION
          */

          targetX =
            Math.cos(angle) *
            maxMove *
            attention;


          targetY =
            Math.sin(angle) *
            maxMove *
            attention;

        }

      }
    );


    /*
      WHEN CURSOR LEAVES
      THE LANDING AREA
    */

    scene.addEventListener(
      "mouseleave",
      () => {

        resetIdle();

      }
    );


    /*
      MAIN ANIMATION

      Same smooth easing
      as your smaller logo.
    */

    function animate() {


      currentX +=
        (targetX - currentX) *
        0.08;


      currentY +=
        (targetY - currentY) *
        0.08;


      eye.style.transform =
        `translate(${currentX}px, ${currentY}px)`;


      requestAnimationFrame(
        animate
      );

    }


    /* START */

    animate();
    chooseIdleTarget();


  </script>


</body>

</html>
