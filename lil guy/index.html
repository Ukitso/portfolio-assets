<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* FULL INTERACTION AREA */

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* THE LITTLE GUY */

    .character {
      position: absolute;

      width: 350px;
      height: 350px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
    }


    /* BODY + EYEBALL */

    .body,
    .eye {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;
    }


    /* EYEBALL */

    .eye {
      will-change: transform;
    }

  </style>

</head>


<body>


  <!-- FULL PAGE INTERACTION AREA -->

  <div
    class="scene"
    id="scene"
  >


    <!-- CHARACTER -->

    <div
      class="character"
      id="character"
    >


      <!-- BODY -->

      <img
        src="body.png"
        class="body"
        alt=""
      >


      <!-- EYEBALL -->

      <img
        src="eyeball.png"
        class="eye"
        id="eye"
        alt=""
      >


    </div>


  </div>


  <script>


    /* ELEMENTS */

    const scene =
      document.getElementById("scene");

    const eye =
      document.getElementById("eye");


    /* EYE POSITION */

    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;


    /* HOW FAR THE EYE CAN MOVE */

    const maxMove = 18;


    /*
      AWARENESS RADIUS

      Inside closeDistance:
      fully focused.

      Between closeDistance
      and farDistance:
      gradually loses interest.

      Outside farDistance:
      completely idle.
    */

    const closeDistance = 180;
    const farDistance = 800;


    /* TRACK CURSOR */

    scene.addEventListener(
      "mousemove",
      (event) => {


        /*
          USE THE ACTUAL EYE
          AS THE CENTRE POINT
        */

        const rect =
          eye.getBoundingClientRect();


        const centerX =
          rect.left +
          rect.width / 2;


        const centerY =
          rect.top +
          rect.height / 2;


        /* DISTANCE FROM EYE */

        const deltaX =
          event.clientX -
          centerX;


        const deltaY =
          event.clientY -
          centerY;


        const distance =
          Math.sqrt(
            deltaX * deltaX +
            deltaY * deltaY
          );


        /*
          ATTENTION LEVEL

          1 = fully focused
          0 = not interested
        */

        let attention;


        if (
          distance <= closeDistance
        ) {

          attention = 1;

        }


        else if (
          distance >= farDistance
        ) {

          attention = 0;

        }


        else {


          /*
            NORMALISE DISTANCE

            0 = close radius
            1 = far radius
          */

          const progress =
            (distance - closeDistance) /
            (farDistance - closeDistance);


          /*
            SMOOTHSTEP EASING

            Creates a soft,
            gradual transition.
          */

          const smoothProgress =
            progress *
            progress *
            (3 - 2 * progress);


          attention =
            1 -
            smoothProgress;

        }


        /* DIRECTION TO CURSOR */

        const angle =
          Math.atan2(
            deltaY,
            deltaX
          );


        /*
          EYE MOVEMENT

          Movement strength
          depends on attention.
        */

        targetX =
          Math.cos(angle) *
          maxMove *
          attention;


        targetY =
          Math.sin(angle) *
          maxMove *
          attention;

      }
    );


    /*
      CURSOR LEAVES
      THE FULL INTERACTION AREA
    */

    scene.addEventListener(
      "mouseleave",
      () => {

        targetX = 0;
        targetY = 0;

      }
    );


    /*
      SMOOTH EYE MOVEMENT
    */

    function animateEye() {


      currentX +=
        (targetX - currentX) *
        0.05;


      currentY +=
        (targetY - currentY) *
        0.05;


      eye.style.transform =
        `translate(${currentX}px, ${currentY}px)`;


      requestAnimationFrame(
        animateEye
      );

    }


    /* START */

    animateEye();


  </script>


</body>

</html>
