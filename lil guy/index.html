<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oko Test</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1B1C1C;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ========================================
// SCENE
// ========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x1B1C1C);


// ========================================
// CAMERA
// ========================================

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);


// ========================================
// RENDERER
// ========================================

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);


// ========================================
// LIGHTING
// ========================================

const ambientLight = new THREE.AmbientLight(
  0xffffff,
  2
);

scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

directionalLight.position.set(3, 5, 5);

scene.add(directionalLight);


// ========================================
// OKO VARIABLES
// ========================================

let oko = null;

let eyeballBone = null;
let eyeballMesh = null;
let head = null;


// ========================================
// EYE SETTINGS
// ========================================

const eyeRangeX = 0.16;
const eyeRangeY = 0.12;

const eyeOffsetY = 0.05;


// Original eye position.

const eyeBasePosition = new THREE.Vector3();


// Current eye movement.

let eyeCurrentX = 0;
let eyeCurrentY = 0;


// ========================================
// EYE TARGET
// ========================================

let eyeTargetX = 0;
let eyeTargetY = 0;


// ========================================
// IDLE SETTINGS
// ========================================

// How long the mouse must be still
// before Oko starts looking around.

const idleDelay = 2500;


// How far idle looking can wander.

const idleRangeX = 0.10;
const idleRangeY = 0.07;


// Whether Oko is currently idle.

let isIdle = false;


// Timer used to enter idle.

let idleTimer = null;


// Timer used to choose the next idle look.

let idleLookTimer = null;


// ========================================
// HEAD SETTINGS
// ========================================

const headBaseRotation = new THREE.Euler();

let headCurrentX = 0;
let headCurrentY = 0;
let headCurrentZ = 0;


// ========================================
// ENTER IDLE
// ========================================

function startIdle() {

  if (isIdle) {
    return;
  }

  isIdle = true;

  chooseIdleLook();

}


// ========================================
// CHOOSE IDLE LOOK
// ========================================

function chooseIdleLook() {

  if (!isIdle) {
    return;
  }


  // Random position for Oko to look at.

  eyeTargetX =
    THREE.MathUtils.randFloat(
      -idleRangeX,
      idleRangeX
    );


  eyeTargetY =
    THREE.MathUtils.randFloat(
      -idleRangeY,
      idleRangeY
    );


  // Wait somewhere between 1 and 2.5 seconds
  // before looking somewhere else.

  const delay =
    THREE.MathUtils.randFloat(
      1000,
      2500
    );


  clearTimeout(idleLookTimer);


  idleLookTimer = setTimeout(
    chooseIdleLook,
    delay
  );

}


// ========================================
// EXIT IDLE
// ========================================

function exitIdle() {

  if (!isIdle) {
    return;
  }

  isIdle = false;


  clearTimeout(idleLookTimer);

}


// ========================================
// MOUSE
// ========================================

window.addEventListener(
  "mousemove",
  (event) => {


    // ------------------------------------
    // Mouse movement immediately wakes Oko.
    // ------------------------------------

    exitIdle();


    // Reset the idle timer.

    clearTimeout(idleTimer);


    idleTimer = setTimeout(
      startIdle,
      idleDelay
    );


    // ------------------------------------
    // NORMALIZED MOUSE POSITION
    // ------------------------------------

    const normalizedX =
      (event.clientX - window.innerWidth / 2) /
      (window.innerWidth / 2);


    const normalizedY =
      (event.clientY - window.innerHeight / 2) /
      (window.innerHeight / 2);


    // ------------------------------------
    // EYE TARGET
    // ------------------------------------

    eyeTargetX =
      normalizedX * eyeRangeX;


    eyeTargetY =
      -normalizedY * eyeRangeY;

  }
);


// ========================================
// LOAD GLB
// ========================================

const loader = new GLTFLoader();

loader.load(

  "./OKO.glb",

  (gltf) => {

    oko = gltf.scene;

    scene.add(oko);


    // ====================================
    // DEBUG
    // ====================================

    console.log("================================");
    console.log("OKO LOADED");
    console.log("================================");

    console.log("------ OBJECTS / BONES ------");


    oko.traverse((object) => {

      console.log(
        object.type,
        object.name
      );

    });


    console.log("-----------------------------");


    // ====================================
    // GET EYEBALL BONE
    // ====================================

    eyeballBone =
      oko.getObjectByName("Eyeball");


    // ====================================
    // GET EYEBALL MESH
    // ====================================

    eyeballMesh =
      oko.getObjectByName("EYEBALL");


    // ====================================
    // GET HEAD
    // ====================================

    head =
      oko.getObjectByName("HEAD");


    console.log(
      "Eyeball BONE:",
      eyeballBone
    );

    console.log(
      "Eyeball MESH:",
      eyeballMesh
    );

    console.log(
      "Head:",
      head
    );


    // ====================================
    // SAVE ORIGINAL EYE POSITION
    // ====================================

    if (eyeballBone) {

      eyeBasePosition.copy(
        eyeballBone.position
      );

    }


    // ====================================
    // SAVE ORIGINAL HEAD ROTATION
    // ====================================

    if (head) {

      headBaseRotation.copy(
        head.rotation
      );

    }


    // ====================================
    // CENTRE OKO
    // ====================================

    const box =
      new THREE.Box3().setFromObject(oko);


    const center =
      box.getCenter(
        new THREE.Vector3()
      );


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    console.log(
      "Oko size:",
      size
    );


    console.log(
      "Oko center:",
      center
    );


    oko.position.sub(center);


    // ====================================
    // CAMERA FRAMING
    // ====================================

    const maxDimension =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    const fitHeightDistance =
      maxDimension /
      (
        2 *
        Math.tan(
          THREE.MathUtils.degToRad(
            camera.fov / 2
          )
        )
      );


    const cameraDistance =
      fitHeightDistance * 1.5;


    camera.position.set(
      0,
      0,
      cameraDistance
    );


    camera.lookAt(
      0,
      0,
      0
    );


    console.log(
      "Camera distance:",
      cameraDistance
    );


    console.log("================================");

  },


  // ====================================
  // LOADING PROGRESS
  // ====================================

  (progress) => {

    if (progress.total) {

      const percent =
        (progress.loaded / progress.total) * 100;


      console.log(
        "Loading Oko:",
        percent.toFixed(0) + "%"
      );

    }

  },


  // ====================================
  // ERROR
  // ====================================

  (error) => {

    console.error(
      "COULD NOT LOAD OKO:",
      error
    );

  }

);


// ========================================
// ANIMATION LOOP
// ========================================

function animate() {

  requestAnimationFrame(animate);


  // ======================================
  // EYE MOVEMENT
  // ======================================

  if (eyeballBone) {


    // ------------------------------------
    // Smoothly approach target.
    // ------------------------------------

    eyeCurrentX +=
      (
        eyeTargetX -
        eyeCurrentX
      ) * 0.08;


    eyeCurrentY +=
      (
        eyeTargetY -
        eyeCurrentY
      ) * 0.08;


    // ------------------------------------
    // Apply eye position.
    // ------------------------------------

    eyeballBone.position.x =
      eyeBasePosition.x +
      eyeCurrentX;


    eyeballBone.position.y =
      eyeBasePosition.y +
      eyeOffsetY +
      eyeCurrentY;

  }


  // ======================================
  // HEAD MOVEMENT
  // ======================================

  if (head) {


    // ------------------------------------
    // Head follows eye.
    // ------------------------------------

    const headTargetY =
      eyeCurrentX * 1.4;


    const headTargetX =
      -eyeCurrentY * 1.0;


    const headTargetZ =
      eyeCurrentX * -0.5;


    // ------------------------------------
    // Smooth head movement.
    // ------------------------------------

    headCurrentY +=
      (
        headTargetY -
        headCurrentY
      ) * 0.035;


    headCurrentX +=
      (
        headTargetX -
        headCurrentX
      ) * 0.035;


    headCurrentZ +=
      (
        headTargetZ -
        headCurrentZ
      ) * 0.035;


    // ------------------------------------
    // Apply head rotation.
    // ------------------------------------

    head.rotation.y =
      headBaseRotation.y +
      headCurrentY;


    head.rotation.x =
      headBaseRotation.x +
      headCurrentX;


    head.rotation.z =
      headBaseRotation.z +
      headCurrentZ;

  }


  // ======================================
  // RENDER
  // ======================================

  renderer.render(
    scene,
    camera
  );

}


// ========================================
// START
// ========================================

animate();


// ========================================
// RESIZE
// ========================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
