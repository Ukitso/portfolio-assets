<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <!-- THREE.JS IMPORT MAP -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    #scene {

      width: 100%;
      height: 100%;

    }


    canvas {

      display: block;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <div id="scene"></div>


  <script type="module">


    /* ------------------------- */
    /* IMPORTS                   */
    /* ------------------------- */


    import * as THREE from "three";


    import {

      GLTFLoader

    } from "three/addons/loaders/GLTFLoader.js";


    /* ------------------------- */
    /* SCENE                     */
    /* ------------------------- */


    const container =
      document.getElementById(
        "scene"
      );


    const scene =
      new THREE.Scene();


    /* ------------------------- */
    /* CAMERA                    */
    /* ------------------------- */


    const camera =
      new THREE.PerspectiveCamera(

        45,

        container.clientWidth /
        container.clientHeight,

        0.01,

        1000

      );


    /* ------------------------- */
    /* RENDERER                  */
    /* ------------------------- */


    const renderer =
      new THREE.WebGLRenderer({

        alpha: true,

        antialias: true

      });


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio,

        2

      )

    );


    renderer.setSize(

      container.clientWidth,

      container.clientHeight

    );


    /*
      TRANSPARENT BACKGROUND
    */


    renderer.setClearColor(

      0x000000,

      0

    );


    /*
      COLOUR MANAGEMENT
    */


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    /*
      KEEP LIGHTING GRAPHIC
      AND CLEAN

      Illustrator is not using
      cinematic film tone mapping.
    */


    renderer.toneMapping =
      THREE.NoToneMapping;


    renderer.toneMappingExposure =
      1.0;


    container.appendChild(

      renderer.domElement

    );


    /* ------------------------- */
    /* LIGHTING                  */
    /* ------------------------- */


    /*
      ILLUSTRATOR SETTINGS:

      Light intensity: 70%
      Rotation: 145°
      Height: 45°
      Softness: 40%

      Ambient light: ON
      Ambient intensity: 50%
    */


    /*
      AMBIENT LIGHT

      Approximates Illustrator's
      50% Ambient Light setting.
    */


    const ambientLight =
      new THREE.AmbientLight(

        0xffffff,

        0.5

      );


    scene.add(

      ambientLight

    );


    /*
      MAIN KEY LIGHT

      Neutral white light.

      Position approximates:

      Rotation: 145°
      Height: 45°
    */


    const keyLight =
      new THREE.DirectionalLight(

        0xffffff,

        1.4

      );


    /*
      145° around the model.

      We use a reasonably large
      distance because a
      DirectionalLight's position
      determines direction rather
      than distance falloff.
    */


    const rotation =
      THREE.MathUtils.degToRad(
        145
      );


    const radius =
      10;


    const height =
      7;


    keyLight.position.set(

      Math.cos(
        rotation
      ) * radius,

      height,

      Math.sin(
        rotation
      ) * radius

    );


    /*
      AIM LIGHT AT OKO'S
      CENTRE
    */


    keyLight.target.position.set(

      0,

      0,

      0

    );


    scene.add(

      keyLight

    );


    scene.add(

      keyLight.target

    );


    /* ------------------------- */
    /* LOAD OKO                  */
    /* ------------------------- */


    const loader =
      new GLTFLoader();


    let oko;


    loader.load(

      "./OKO.glb",


      function (
        gltf
      ) {


        console.log(
          "OKO LOADED"
        );


        oko =
          gltf.scene;


        /*
          PREPARE MESHES
        */


        oko.traverse(

          function (
            object
          ) {


            if (
              object.isMesh
            ) {


              object.frustumCulled =
                false;


            }


          }

        );


        /*
          CALCULATE MODEL
          BOUNDS
        */


        const box =
          new THREE.Box3()
          .setFromObject(
            oko
          );


        const size =
          box.getSize(

            new THREE.Vector3()

          );


        const center =
          box.getCenter(

            new THREE.Vector3()

          );


        /*
          CENTRE OKO
          AT WORLD ORIGIN
        */


        oko.position.sub(

          center

        );


        scene.add(

          oko

        );


        /*
          FIT CAMERA
        */


        const maxSize =
          Math.max(

            size.x,

            size.y,

            size.z

          );


        const fov =
          THREE.MathUtils.degToRad(

            camera.fov

          );


        let distance =
          (

            maxSize / 2

          ) /

          Math.tan(

            fov / 2

          );


        /*
          BREATHING ROOM
        */


        distance *=
          1.35;


        camera.position.set(

          0,

          0,

          distance

        );


        camera.lookAt(

          0,

          0,

          0

        );


        /*
          CAMERA CLIPPING
        */


        camera.near =
          Math.max(

            0.01,

            distance / 100

          );


        camera.far =
          distance * 100;


        camera.updateProjectionMatrix();


        console.log(

          "MODEL SIZE:",

          size

        );


      },


      /*
        LOADING PROGRESS
      */


      function (
        progress
      ) {


        if (
          progress.total
        ) {


          console.log(

            "LOADING:",

            Math.round(

              (
                progress.loaded /

                progress.total

              ) * 100

            ) + "%"

          );


        }


      },


      /*
        ERROR
      */


      function (
        error
      ) {


        console.error(

          "FAILED TO LOAD OKO:",

          error

        );


      }

    );


    /* ------------------------- */
    /* RESIZE                    */
    /* ------------------------- */


    function resize() {


      const width =
        container.clientWidth;


      const height =
        container.clientHeight;


      /*
        Avoid divide-by-zero
        issues while embedding.
      */


      if (

        width === 0 ||

        height === 0

      ) {

        return;

      }


      camera.aspect =

        width /

        height;


      camera.updateProjectionMatrix();


      renderer.setSize(

        width,

        height

      );


    }


    window.addEventListener(

      "resize",

      resize

    );


    /* ------------------------- */
    /* RENDER LOOP               */
    /* ------------------------- */


    function animate() {


      requestAnimationFrame(

        animate

      );


      renderer.render(

        scene,

        camera

      );


    }


    animate();


  </script>


</body>

</html>
