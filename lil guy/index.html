<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    #scene {

      width: 100%;
      height: 100%;

    }


    canvas {

      display: block;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <div id="scene"></div>


  <script type="module">


    /* ------------------------- */
    /* IMPORTS                   */
    /* ------------------------- */


    import * as THREE from "three";


    import {

      GLTFLoader

    } from "three/addons/loaders/GLTFLoader.js";


    /* ------------------------- */
    /* SCENE                     */
    /* ------------------------- */


    const container =
      document.getElementById(
        "scene"
      );


    const scene =
      new THREE.Scene();


    /* ------------------------- */
    /* CAMERA                    */
    /* ------------------------- */


    const camera =
      new THREE.PerspectiveCamera(

        45,

        container.clientWidth /
        container.clientHeight,

        0.01,

        1000

      );


    /* ------------------------- */
    /* RENDERER                  */
    /* ------------------------- */


    const renderer =
      new THREE.WebGLRenderer({

        alpha: true,

        antialias: true

      });


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio,

        2

      )

    );


    renderer.setSize(

      container.clientWidth,

      container.clientHeight

    );


    renderer.setClearColor(

      0x000000,

      0

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.NoToneMapping;


    renderer.toneMappingExposure =
      1.0;


    container.appendChild(

      renderer.domElement

    );


    /* ------------------------- */
    /* LIGHTING                  */
    /* ------------------------- */


    /*
      LOW AMBIENT LIGHT

      Keeps some detail visible,
      but allows deep shadows.
    */


    const ambientLight =
      new THREE.AmbientLight(

        0xffffff,

        0.12

      );


    scene.add(

      ambientLight

    );


    /* ------------------------- */
    /* MAIN KEY LIGHT            */
    /* ------------------------- */


    /*
      Strong light from the
      UPPER RIGHT and FRONT.

      Low penumbra creates a much
      sharper transition between
      the lit and shadow areas.
    */


    const keyLight =
      new THREE.SpotLight(

        0xffffff

      );


    keyLight.intensity =
      10;


    keyLight.position.set(

      6,

      7,

      8

    );


    /*
      Wide enough to cover
      the character.
    */


    keyLight.angle =
      0.65;


    /*
      VERY SHARP EDGE.

      Lower = harder transition.
    */


    keyLight.penumbra =
      0.02;


    keyLight.decay =
      0;


    keyLight.distance =
      0;


    keyLight.target.position.set(

      0,

      0,

      0

    );


    scene.add(

      keyLight

    );


    scene.add(

      keyLight.target

    );


    /* ------------------------- */
    /* SUBTLE LEFT FILL          */
    /* ------------------------- */


    /*
      Barely lifts the darkest
      areas without flattening
      the main shadow.
    */


    const fillLight =
      new THREE.DirectionalLight(

        0xffffff,

        0.05

      );


    fillLight.position.set(

      -6,

      2,

      4

    );


    fillLight.target.position.set(

      0,

      0,

      0

    );


    scene.add(

      fillLight

    );


    scene.add(

      fillLight.target

    );


    /* ------------------------- */
    /* UPPER SPOT HIGHLIGHT      */
    /* ------------------------- */


    /*
      Concentrated highlight on
      the upper-right/head area.
    */


    const upperSpot =
      new THREE.SpotLight(

        0xffffff

      );


    upperSpot.intensity =
      5;


    upperSpot.position.set(

      7,

      6,

      6

    );


    upperSpot.angle =
      0.32;


    /*
      Fairly sharp highlight.
    */


    upperSpot.penumbra =
      0.06;


    upperSpot.decay =
      0;


    upperSpot.distance =
      0;


    upperSpot.target.position.set(

      0.8,

      1.1,

      0

    );


    scene.add(

      upperSpot

    );


    scene.add(

      upperSpot.target

    );


    /* ------------------------- */
    /* BODY SPOT HIGHLIGHT       */
    /* ------------------------- */


    /*
      Separate highlight lower
      on the right side of
      the character.
    */


    const bodySpot =
      new THREE.SpotLight(

        0xffffff

      );


    bodySpot.intensity =
      4;


    bodySpot.position.set(

      7,

      0.5,

      6

    );


    bodySpot.angle =
      0.28;


    bodySpot.penumbra =
      0.04;


    bodySpot.decay =
      0;


    bodySpot.distance =
      0;


    bodySpot.target.position.set(

      0.9,

      -0.9,

      0

    );


    scene.add(

      bodySpot

    );


    scene.add(

      bodySpot.target

    );


    /* ------------------------- */
    /* LOAD MODEL                */
    /* ------------------------- */


    const loader =
      new GLTFLoader();


    let oko;


    loader.load(

      "./OKO.glb",


      function (

        gltf

      ) {


        console.log(

          "OKO LOADED"

        );


        oko =
          gltf.scene;


        /*
          PREPARE MODEL
        */


        oko.traverse(

          function (

            object

          ) {


            if (

              object.isMesh

            ) {


              object.frustumCulled =
                false;


              if (

                object.material

              ) {


                /*
                  Lower roughness gives
                  the spotlights more
                  visible highlights.
                */


                object.material.roughness =
                  0.48;


                object.material.metalness =
                  0;


                object.material.needsUpdate =
                  true;


              }


            }


          }

        );


        /* --------------------- */
        /* MODEL BOUNDS          */
        /* --------------------- */


        const box =
          new THREE.Box3()
          .setFromObject(

            oko

          );


        const size =
          box.getSize(

            new THREE.Vector3()

          );


        const center =
          box.getCenter(

            new THREE.Vector3()

          );


        /*
          CENTRE MODEL
        */


        oko.position.sub(

          center

        );


        scene.add(

          oko

        );


        /* --------------------- */
        /* CAMERA FRAMING        */
        /* --------------------- */


        const maxSize =
          Math.max(

            size.x,

            size.y,

            size.z

          );


        const fov =
          THREE.MathUtils.degToRad(

            camera.fov

          );


        let distance =

          (

            maxSize / 2

          )

          /

          Math.tan(

            fov / 2

          );


        /*
          BREATHING ROOM
        */


        distance *=
          1.35;


        camera.position.set(

          0,

          0,

          distance

        );


        camera.lookAt(

          0,

          0,

          0

        );


        /*
          CAMERA CLIPPING
        */


        camera.near =
          Math.max(

            0.01,

            distance / 100

          );


        camera.far =
          distance * 100;


        camera.updateProjectionMatrix();


        console.log(

          "MODEL SIZE:",

          size

        );


      },


      function (

        progress

      ) {


        if (

          progress.total

        ) {


          console.log(

            "LOADING:",

            Math.round(

              (

                progress.loaded /

                progress.total

              )

              *

              100

            )

            +

            "%"

          );


        }


      },


      function (

        error

      ) {


        console.error(

          "FAILED TO LOAD OKO:",

          error

        );


      }

    );


    /* ------------------------- */
    /* RESIZE                    */
    /* ------------------------- */


    function resize() {


      const width =
        container.clientWidth;


      const height =
        container.clientHeight;


      if (

        width === 0 ||

        height === 0

      ) {

        return;

      }


      camera.aspect =

        width /

        height;


      camera.updateProjectionMatrix();


      renderer.setSize(

        width,

        height

      );


    }


    window.addEventListener(

      "resize",

      resize

    );


    /* ------------------------- */
    /* RENDER LOOP               */
    /* ------------------------- */


    function animate() {


      requestAnimationFrame(

        animate

      );


      renderer.render(

        scene,

        camera

      );


    }


    animate();


  </script>


</body>

</html>
