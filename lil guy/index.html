<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Oko</title>

  <!-- THREE.JS IMPORT MAP -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1B1C1C;
    }

    #oko-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="oko-container"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// BASIC SETUP
// ============================================================

const container = document.getElementById("oko-container");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1B1C1C);


// CAMERA
const camera = new THREE.PerspectiveCamera(
  45,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);


// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);


// ============================================================
// LIGHTING
// ============================================================

const ambientLight = new THREE.AmbientLight(
  0xffffff,
  2
);

scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

directionalLight.position.set(
  3,
  5,
  4
);

scene.add(directionalLight);


// ============================================================
// LOAD OKO
// ============================================================

const loader = new GLTFLoader();

loader.load(
  "./OKO.glb",

  (gltf) => {

    const oko = gltf.scene;

    scene.add(oko);


    // ========================================================
    // FIND IMPORTANT OBJECTS
    // ========================================================

    let eyeballBone = null;
    let eyeballMesh = null;

    let head = null;
    let body = null;

    let leftEar = null;
    let rightEar = null;

    let skinnedMesh = null;


    oko.traverse((object) => {

      if (object.name === "Eyeball") {
        eyeballBone = object;
      }

      if (object.name === "EYEBALL") {
        eyeballMesh = object;
      }

      if (object.name === "HEAD") {
        head = object;
      }

      if (object.name === "BODY_1") {
        body = object;
      }

      if (object.isSkinnedMesh && object.skeleton) {
        skinnedMesh = object;
      }

    });


    // ========================================================
    // GET EARS DIRECTLY FROM THE SKELETON
    // ========================================================

    if (skinnedMesh && skinnedMesh.skeleton) {

      const bones = skinnedMesh.skeleton.bones;

      console.log("Oko skeleton bones:");

      bones.forEach((bone, index) => {
        console.log(index, bone.name);
      });


      // Current GLB:
      // index 2 = left ear
      // index 3 = right ear

      leftEar = bones[2];
      rightEar = bones[3];


      console.log(
        "LEFT EAR:",
        leftEar?.name,
        leftEar
      );

      console.log(
        "RIGHT EAR:",
        rightEar?.name,
        rightEar
      );

      console.log(
        "LEFT EAR IS SKELETON BONE:",
        leftEar === bones[2]
      );

      console.log(
        "RIGHT EAR IS SKELETON BONE:",
        rightEar === bones[3]
      );

    }


    // ========================================================
    // CHECK EVERYTHING LOADED
    // ========================================================

    console.log("EYEBALL BONE:", eyeballBone);
    console.log("EYEBALL MESH:", eyeballMesh);
    console.log("HEAD:", head);
    console.log("BODY:", body);
    console.log("SKINNED MESH:", skinnedMesh);


    // ========================================================
    // CENTER OKO
    // ========================================================

    const box = new THREE.Box3().setFromObject(oko);

    const center = box.getCenter(
      new THREE.Vector3()
    );

    oko.position.sub(center);


    // ========================================================
    // CAMERA FRAMING
    // ========================================================

    const centeredBox = new THREE.Box3().setFromObject(oko);

    const size = centeredBox.getSize(
      new THREE.Vector3()
    );

    const maxDimension = Math.max(
      size.x,
      size.y,
      size.z
    );

    const fov = camera.fov * Math.PI / 180;

    let cameraDistance =
      (maxDimension / 2) /
      Math.tan(fov / 2);

    cameraDistance *= 1.15;


    camera.position.set(
      0,
      0,
      cameraDistance
    );

    camera.lookAt(0, 0, 0);


    // ========================================================
    // SAVE ORIGINAL POSITIONS / ROTATIONS
    // ========================================================

    const eyeBasePosition = eyeballBone
      ? eyeballBone.position.clone()
      : new THREE.Vector3();


    const headBaseRotation = head
      ? head.rotation.clone()
      : new THREE.Euler();


    const bodyBaseRotation = body
      ? body.rotation.clone()
      : new THREE.Euler();


    const leftEarBaseRotation = leftEar
      ? leftEar.rotation.clone()
      : new THREE.Euler();


    const rightEarBaseRotation = rightEar
      ? rightEar.rotation.clone()
      : new THREE.Euler();


    // ========================================================
    // EYE SETTINGS
    // ========================================================

    const eyeRangeX = 0.16;
    const eyeRangeY = 0.12;

    const eyeOffsetY = 0.05;


    let eyeTargetX = 0;
    let eyeTargetY = 0;

    let eyeCurrentX = 0;
    let eyeCurrentY = 0;


    // ========================================================
    // HEAD SETTINGS
    // ========================================================

    let headTargetX = 0;
    let headTargetY = 0;
    let headTargetZ = 0;

    let headCurrentX = 0;
    let headCurrentY = 0;
    let headCurrentZ = 0;


    // ========================================================
    // BODY SETTINGS
    // ========================================================

    let bodyCurrentX = 0;
    let bodyCurrentY = 0;
    let bodyCurrentZ = 0;


    // ========================================================
    // IDLE
    // ========================================================

    let idle = false;

    let idleTimer = null;

    const idleDelay = 2500;


    let idleEyeTargetX = 0;
    let idleEyeTargetY = 0;


    let idleHeadTargetX = 0;
    let idleHeadTargetY = 0;
    let idleHeadTargetZ = 0;


    let idleBodyTargetX = 0;
    let idleBodyTargetY = 0;
    let idleBodyTargetZ = 0;


    // ========================================================
    // EAR IDLE
    // ========================================================

    let earTargetLeftX = 0;
    let earTargetLeftY = 0;
    let earTargetLeftZ = 0;

    let earTargetRightX = 0;
    let earTargetRightY = 0;
    let earTargetRightZ = 0;


    let earCurrentLeftX = 0;
    let earCurrentLeftY = 0;
    let earCurrentLeftZ = 0;

    let earCurrentRightX = 0;
    let earCurrentRightY = 0;
    let earCurrentRightZ = 0;


    let nextEarMovement = 0;


    // ========================================================
    // RANDOM RANGE
    // ========================================================

    function randomRange(min, max) {

      return min + Math.random() * (max - min);

    }


    // ========================================================
    // START IDLE
    // ========================================================

    function startIdle() {

      idle = true;

      chooseIdleEyeTarget();
      chooseIdleHeadTarget();
      chooseIdleBodyTarget();
      chooseEarTarget();

    }


    // ========================================================
    // EXIT IDLE
    // ========================================================

    function exitIdle() {

      idle = false;

      idleEyeTargetX = 0;
      idleEyeTargetY = 0;

      idleHeadTargetX = 0;
      idleHeadTargetY = 0;
      idleHeadTargetZ = 0;

      idleBodyTargetX = 0;
      idleBodyTargetY = 0;
      idleBodyTargetZ = 0;

      earTargetLeftX = 0;
      earTargetLeftY = 0;
      earTargetLeftZ = 0;

      earTargetRightX = 0;
      earTargetRightY = 0;
      earTargetRightZ = 0;

    }


    // ========================================================
    // IDLE EYE TARGET
    // ========================================================

    function chooseIdleEyeTarget() {

      idleEyeTargetX = randomRange(
        -0.10,
        0.10
      );

      idleEyeTargetY = randomRange(
        -0.07,
        0.07
      );

    }


    // ========================================================
    // IDLE HEAD TARGET
    // ========================================================

    function chooseIdleHeadTarget() {

      idleHeadTargetX = randomRange(
        -0.025,
        0.025
      );

      idleHeadTargetY = randomRange(
        -0.035,
        0.035
      );

      idleHeadTargetZ = randomRange(
        -0.045,
        0.045
      );

    }


    // ========================================================
    // IDLE BODY TARGET
    // ========================================================

    function chooseIdleBodyTarget() {

      idleBodyTargetX = randomRange(
        -0.006,
        0.006
      );

      idleBodyTargetY = randomRange(
        -0.010,
        0.010
      );

      idleBodyTargetZ = randomRange(
        -0.012,
        0.012
      );

    }


    // ========================================================
    // EAR TARGET
    // ========================================================

    function chooseEarTarget() {

      earTargetLeftX = randomRange(
        -0.035,
        0.035
      );

      earTargetLeftY = randomRange(
        -0.025,
        0.025
      );

      earTargetLeftZ = randomRange(
        -0.045,
        0.045
      );


      earTargetRightX = randomRange(
        -0.035,
        0.035
      );

      earTargetRightY = randomRange(
        -0.025,
        0.025
      );

      earTargetRightZ = randomRange(
        -0.045,
        0.045
      );


      nextEarMovement =
        performance.now() +
        randomRange(1800, 5000);

    }


    // ========================================================
    // MOUSE
    // ========================================================

    window.addEventListener(
      "mousemove",
      (event) => {

        exitIdle();


        clearTimeout(idleTimer);

        idleTimer = setTimeout(
          startIdle,
          idleDelay
        );


        const normalizedX =
          (event.clientX / window.innerWidth) * 2 - 1;


        const normalizedY =
          (event.clientY / window.innerHeight) * 2 - 1;


        // Eye physically moves rather than rotating

        eyeTargetX =
          normalizedX * eyeRangeX;


        eyeTargetY =
          -normalizedY * eyeRangeY;

      }
    );


    // ========================================================
    // ANIMATION
    // ========================================================

    function animate() {

      requestAnimationFrame(animate);


      const now = performance.now();

      const time = now * 0.001;


      // ======================================================
      // IDLE EYES
      // ======================================================

      if (idle) {

        eyeTargetX = idleEyeTargetX;
        eyeTargetY = idleEyeTargetY;

      }


      // ======================================================
      // EYE SMOOTHING
      // ======================================================

      eyeCurrentX +=
        (eyeTargetX - eyeCurrentX) *
        0.08;


      eyeCurrentY +=
        (eyeTargetY - eyeCurrentY) *
        0.08;


      // ======================================================
      // MOVE EYEBALL
      // ======================================================

      if (eyeballBone) {

        eyeballBone.position.x =
          eyeBasePosition.x +
          eyeCurrentX;


        eyeballBone.position.y =
          eyeBasePosition.y +
          eyeOffsetY +
          eyeCurrentY;

      }


      // ======================================================
      // HEAD FOLLOW
      // ======================================================

      let targetHeadY =
        eyeCurrentX * 1.4;


      let targetHeadX =
        -eyeCurrentY * 1.0;


      let targetHeadZ =
        eyeCurrentX * -0.5;


      if (idle) {

        targetHeadX += idleHeadTargetX;
        targetHeadY += idleHeadTargetY;
        targetHeadZ += idleHeadTargetZ;

      }


      headCurrentX +=
        (targetHeadX - headCurrentX) *
        0.035;


      headCurrentY +=
        (targetHeadY - headCurrentY) *
        0.035;


      headCurrentZ +=
        (targetHeadZ - headCurrentZ) *
        0.035;


      // ======================================================
      // APPLY HEAD
      // ======================================================

      if (head) {

        head.rotation.x =
          headBaseRotation.x +
          headCurrentX;


        head.rotation.y =
          headBaseRotation.y +
          headCurrentY;


        head.rotation.z =
          headBaseRotation.z +
          headCurrentZ;

      }


      // ======================================================
      // BODY FOLLOW
      // ======================================================

      let targetBodyX =
        headCurrentX * 0.15;

      let targetBodyY =
        headCurrentY * 0.20;

      let targetBodyZ =
        headCurrentZ * 0.20;


      if (idle) {

        targetBodyX += idleBodyTargetX;
        targetBodyY += idleBodyTargetY;
        targetBodyZ += idleBodyTargetZ;

      }


      bodyCurrentX +=
        (targetBodyX - bodyCurrentX) *
        0.008;


      bodyCurrentY +=
        (targetBodyY - bodyCurrentY) *
        0.008;


      bodyCurrentZ +=
        (targetBodyZ - bodyCurrentZ) *
        0.008;


      // ======================================================
      // APPLY BODY
      // ======================================================

      if (body) {

        body.rotation.x =
          bodyBaseRotation.x +
          bodyCurrentX;


        body.rotation.y =
          bodyBaseRotation.y +
          bodyCurrentY;


        body.rotation.z =
          bodyBaseRotation.z +
          bodyCurrentZ;

      }


      // ======================================================
      // EARS
      // ======================================================

      if (leftEar && rightEar) {

        // Pick a new subtle ear pose occasionally

        if (idle && now >= nextEarMovement) {

          chooseEarTarget();

        }


        // Smooth left ear

        earCurrentLeftX +=
          (earTargetLeftX - earCurrentLeftX) *
          0.015;


        earCurrentLeftY +=
          (earTargetLeftY - earCurrentLeftY) *
          0.015;


        earCurrentLeftZ +=
          (earTargetLeftZ - earCurrentLeftZ) *
          0.015;


        // Smooth right ear

        earCurrentRightX +=
          (earTargetRightX - earCurrentRightX) *
          0.015;


        earCurrentRightY +=
          (earTargetRightY - earCurrentRightY) *
          0.015;


        earCurrentRightZ +=
          (earTargetRightZ - earCurrentRightZ) *
          0.015;


        // Apply relative to Blender's original rotations

        leftEar.rotation.x =
          leftEarBaseRotation.x +
          earCurrentLeftX;


        leftEar.rotation.y =
          leftEarBaseRotation.y +
          earCurrentLeftY;


        leftEar.rotation.z =
          leftEarBaseRotation.z +
          earCurrentLeftZ;


        rightEar.rotation.x =
          rightEarBaseRotation.x +
          earCurrentRightX;


        rightEar.rotation.y =
          rightEarBaseRotation.y +
          earCurrentRightY;


        rightEar.rotation.z =
          rightEarBaseRotation.z +
          earCurrentRightZ;


        // Make absolutely sure the skin gets updated

        skinnedMesh.skeleton.update();

      }


      // ======================================================
      // RENDER
      // ======================================================

      renderer.render(
        scene,
        camera
      );

    }


    animate();

  },

  (progress) => {

    console.log(
      "Loading:",
      (progress.loaded / progress.total * 100).toFixed(1) + "%"
    );

  },

  (error) => {

    console.error(
      "Failed to load Oko:",
      error
    );

  }
);


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      container.clientWidth /
      container.clientHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      container.clientWidth,
      container.clientHeight
    );

  }
);

</script>

</body>
</html>
