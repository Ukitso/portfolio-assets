<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>


  <style>

    html,
    body {

      margin: 0;
      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    #scene {

      width: 100%;
      height: 100%;

    }


    canvas {

      display: block;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <div id="scene"></div>


  <script type="module">

    import * as THREE from "three";

    import {
      GLTFLoader
    } from "three/addons/loaders/GLTFLoader.js";


    /* ------------------------- */
    /* SCENE                     */
    /* ------------------------- */

    const container =
      document.getElementById("scene");


    const scene =
      new THREE.Scene();


    /* ------------------------- */
    /* CAMERA                    */
    /* ------------------------- */

    const camera =
      new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

      );


    /* ------------------------- */
    /* RENDERER                  */
    /* ------------------------- */

    const renderer =
      new THREE.WebGLRenderer({

        alpha: true,

        antialias: true

      });


    renderer.setSize(

      window.innerWidth,
      window.innerHeight

    );


    renderer.setPixelRatio(

      Math.min(
        window.devicePixelRatio,
        2
      )

    );


    /*
      TRANSPARENT BACKGROUND
    */

    renderer.setClearColor(
      0x000000,
      0
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.15;


    container.appendChild(
      renderer.domElement
    );


    /* ------------------------- */
/* LIGHTING                  */
/* ------------------------- */


/*
  VERY LOW AMBIENT LIGHT

  This is important.

  The Illustrator version has
  genuinely dark areas, so we
  do not want to fill all of
  Oko's shadows.
*/

const ambientLight =
  new THREE.AmbientLight(

    0xffe0d0,

    0.08

  );


scene.add(
  ambientLight
);


/*
  MAIN LIGHT

  Positioned high and to the
  RIGHT of the camera.

  This creates the bright
  upper-right surfaces and
  leaves the opposite side
  in heavy shadow.
*/

const keyLight =
  new THREE.PointLight(

    0xffd0b5,

    100,

    0

  );


keyLight.position.set(

  4,
  5,
  6

);


scene.add(
  keyLight
);


/*
  VERY SUBTLE LEFT EDGE FILL

  This is deliberately weak.

  It prevents the silhouette
  disappearing completely,
  while keeping the strong
  dark shadow from the
  Illustrator version.
*/

const edgeLight =
  new THREE.PointLight(

    0xff5c28,

    6,

    0

  );


edgeLight.position.set(

  -4,
  1,
  3

);


scene.add(
  edgeLight
);


    /* ------------------------- */
    /* LOAD OKO                  */
    /* ------------------------- */

    const loader =
      new GLTFLoader();


    let oko;


    loader.load(

      "./OKO.glb",


      (gltf) => {


        console.log(
          "OKO LOADED"
        );


        oko =
          gltf.scene;


        /*
          MAKE SURE MATERIALS
          RENDER CORRECTLY
        */

        oko.traverse(

          (object) => {


            if (
              object.isMesh
            ) {


              object.frustumCulled =
                false;


            }


          }

        );


        /*
          GET MODEL BOUNDS
        */

        const box =
          new THREE.Box3()
          .setFromObject(
            oko
          );


        const size =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        /*
          CENTRE OKO
        */

        oko.position.sub(
          center
        );


        scene.add(
          oko
        );


        /*
          FIT CAMERA
        */

        const maxSize =
          Math.max(

            size.x,
            size.y,
            size.z

          );


        /*
          Calculate a camera
          distance based on
          the actual FOV.
        */

        const fov =
          camera.fov *
          (
            Math.PI / 180
          );


        let distance =
          (
            maxSize / 2
          ) /
          Math.tan(
            fov / 2
          );


        /*
          Leave some breathing
          room around Oko.
        */

        distance *=
          1.35;


        camera.position.set(

          0,
          0,
          distance

        );


        camera.lookAt(

          0,
          0,
          0

        );


        camera.near =
          Math.max(
            0.01,
            distance / 100
          );


        camera.far =
          distance * 100;


        camera.updateProjectionMatrix();


        console.log(
          "MODEL SIZE:",
          size
        );


      },


      undefined,


      (error) => {


        console.error(
          "FAILED TO LOAD OKO:",
          error
        );


      }

    );


    /* ------------------------- */
    /* RESIZE                    */
    /* ------------------------- */

    window.addEventListener(

      "resize",

      () => {


        camera.aspect =

          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,
          window.innerHeight

        );


      }

    );


    /* ------------------------- */
    /* RENDER LOOP               */
    /* ------------------------- */

    function animate() {


      requestAnimationFrame(
        animate
      );


      renderer.render(

        scene,
        camera

      );


    }


    animate();

  </script>


</body>

</html>
