<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    #scene {

      width: 100%;
      height: 100%;

    }


    canvas {

      display: block;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <div id="scene"></div>


  <script type="module">


    /* ------------------------- */
    /* IMPORTS                   */
    /* ------------------------- */


    import * as THREE from "three";


    import {

      GLTFLoader

    } from "three/addons/loaders/GLTFLoader.js";


    /* ------------------------- */
    /* SCENE                     */
    /* ------------------------- */


    const container =
      document.getElementById(
        "scene"
      );


    const scene =
      new THREE.Scene();


    /* ------------------------- */
    /* CAMERA                    */
    /* ------------------------- */


    const camera =
      new THREE.PerspectiveCamera(

        45,

        container.clientWidth /
        container.clientHeight,

        0.01,

        1000

      );


    /* ------------------------- */
    /* RENDERER                  */
    /* ------------------------- */


    const renderer =
      new THREE.WebGLRenderer({

        alpha: true,

        antialias: true

      });


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio,

        2

      )

    );


    renderer.setSize(

      container.clientWidth,

      container.clientHeight

    );


    renderer.setClearColor(

      0x000000,

      0

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.NoToneMapping;


    renderer.toneMappingExposure =
      1.0;


    container.appendChild(

      renderer.domElement

    );


    /* ------------------------- */
    /* LIGHTING                  */
    /* ------------------------- */


    const ambientLight =
      new THREE.AmbientLight(

        0xffffff,

        0.22

      );


    scene.add(

      ambientLight

    );


    /*
      MAIN LIGHT

      Positioned to the RIGHT,
      above and towards the front.
    */


    const keyLight =
      new THREE.DirectionalLight(

        0xffffff,

        3.2

      );


    keyLight.position.set(

      7,

      6,

      8

    );


    keyLight.target.position.set(

      0,

      0,

      0

    );


    scene.add(

      keyLight

    );


    scene.add(

      keyLight.target

    );


    /*
      DARKER OPPOSITE SIDE

      This is intentionally very
      subtle so the main light
      direction stays strong.
    */


    const fillLight =
      new THREE.DirectionalLight(

        0xffffff,

        0.08

      );


    fillLight.position.set(

      -5,

      1,

      4

    );


    fillLight.target.position.set(

      0,

      0,

      0

    );


    scene.add(

      fillLight

    );


    scene.add(

      fillLight.target

    );


    /*
      SMALL SPECULAR SPOTLIGHT

      Creates a tighter,
      more concentrated highlight.
    */


    const spotLight =
      new THREE.SpotLight(

        0xffffff,

        35,

        20,

        Math.PI / 7,

        0.35,

        2

      );


    spotLight.position.set(

      5,

      5,

      7

    );


    spotLight.target.position.set(

      0,

      0,

      0

    );


    scene.add(

      spotLight

    );


    scene.add(

      spotLight.target

    );


    /* ------------------------- */
    /* CURSOR                    */
    /* ------------------------- */


    const mouse =
      new THREE.Vector2(

        0,

        0

      );


    /*
      These values represent
      where the eye wants to move.
    */


    const eyeTarget =
      new THREE.Vector2(

        0,

        0

      );


    window.addEventListener(

      "pointermove",

      function (

        event

      ) {


        const rect =
          renderer.domElement
          .getBoundingClientRect();


        mouse.x =

          (

            (

              event.clientX -

              rect.left

            )

            /

            rect.width

          )

          *

          2

          -

          1;


        mouse.y =

          -

          (

            (

              event.clientY -

              rect.top

            )

            /

            rect.height

          )

          *

          2

          +

          1;


        eyeTarget.x =
          mouse.x;


        eyeTarget.y =
          mouse.y;


      }

    );


    /* ------------------------- */
    /* LOAD MODEL                */
    /* ------------------------- */


    const loader =
      new GLTFLoader();


    let oko;


    /*
      EYEBALL MESH
    */


    let eyeball =
      null;


    /*
      ORIGINAL EYEBALL POSITION

      We save this so movement is
      always relative to the rigged
      position exported from Blender.
    */


    let eyeballBasePosition =
      new THREE.Vector3();


    /*
      SMOOTH CURRENT POSITION
    */


    const eyeballCurrentOffset =
      new THREE.Vector2(

        0,

        0

      );


    /*
      HOW FAR THE EYE CAN MOVE

      Increase these numbers if you
      want stronger eye movement.
    */


    const eyeMovementX =
      0.12;


    const eyeMovementY =
      0.10;


    loader.load(

      "./OKO.glb",


      function (

        gltf

      ) {


        console.log(

          "OKO LOADED"

        );


        oko =
          gltf.scene;


        /* --------------------- */
        /* PREPARE MODEL         */
        /* --------------------- */


        oko.traverse(

          function (

            object

          ) {


            if (

              object.isMesh

            ) {


              object.frustumCulled =
                false;


              /*
                FIND EYEBALL
              */


              if (

                object.name ===
                "EYEBALL"

              ) {


                eyeball =
                  object;


                eyeballBasePosition
                  .copy(

                    eyeball.position

                  );


                console.log(

                  "EYEBALL FOUND:",

                  eyeball

                );


              }


              /*
                MATERIAL
              */


              if (

                object.material

              ) {


                object.material.roughness =
                  0.48;


                object.material.metalness =
                  0;


                object.material.needsUpdate =
                  true;


              }


            }


          }

        );


        /* --------------------- */
        /* MODEL BOUNDS          */
        /* --------------------- */


        const box =
          new THREE.Box3()
          .setFromObject(

            oko

          );


        const size =
          box.getSize(

            new THREE.Vector3()

          );


        const center =
          box.getCenter(

            new THREE.Vector3()

          );


        /*
          CENTRE MODEL
        */


        oko.position.sub(

          center

        );


        scene.add(

          oko

        );


        /* --------------------- */
        /* CAMERA FRAMING        */
        /* --------------------- */


        const maxSize =
          Math.max(

            size.x,

            size.y,

            size.z

          );


        const fov =
          THREE.MathUtils.degToRad(

            camera.fov

          );


        let distance =

          (

            maxSize / 2

          )

          /

          Math.tan(

            fov / 2

          );


        distance *=
          1.35;


        camera.position.set(

          0,

          0,

          distance

        );


        camera.lookAt(

          0,

          0,

          0

        );


        camera.near =
          Math.max(

            0.01,

            distance / 100

          );


        camera.far =
          distance * 100;


        camera.updateProjectionMatrix();


        console.log(

          "MODEL SIZE:",

          size

        );


      },


      function (

        progress

      ) {


        if (

          progress.total

        ) {


          console.log(

            "LOADING:",

            Math.round(

              (

                progress.loaded /

                progress.total

              )

              *

              100

            )

            +

            "%"

          );


        }


      },


      function (

        error

      ) {


        console.error(

          "FAILED TO LOAD OKO:",

          error

        );


      }

    );


    /* ------------------------- */
    /* RESIZE                    */
    /* ------------------------- */


    function resize() {


      const width =
        container.clientWidth;


      const height =
        container.clientHeight;


      if (

        width === 0 ||

        height === 0

      ) {

        return;

      }


      camera.aspect =

        width /

        height;


      camera.updateProjectionMatrix();


      renderer.setSize(

        width,

        height

      );


    }


    window.addEventListener(

      "resize",

      resize

    );


    /* ------------------------- */
    /* ANIMATE EYE               */
    /* ------------------------- */


    function animateEyeball() {


      if (

        !eyeball

      ) {

        return;

      }


      /*
        SMOOTHLY FOLLOW CURSOR

        The damping keeps the eye
        from snapping instantly.
      */


      eyeballCurrentOffset.x +=

        (

          eyeTarget.x -

          eyeballCurrentOffset.x

        )

        *

        0.08;


      eyeballCurrentOffset.y +=

        (

          eyeTarget.y -

          eyeballCurrentOffset.y

        )

        *

        0.08;


      /*
        MOVE EYEBALL INSIDE SOCKET

        Negative Y makes screen
        movement feel natural.
      */


      eyeball.position.x =

        eyeballBasePosition.x

        +

        (

          eyeballCurrentOffset.x

          *

          eyeMovementX

        );


      eyeball.position.y =

        eyeballBasePosition.y

        +

        (

          -

          eyeballCurrentOffset.y

          *

          eyeMovementY

        );


      /*
        Keep the original depth.
      */


      eyeball.position.z =

        eyeballBasePosition.z;


    }


    /* ------------------------- */
    /* RENDER LOOP               */
    /* ------------------------- */


    function animate() {


      requestAnimationFrame(

        animate

      );


      animateEyeball();


      renderer.render(

        scene,

        camera

      );


    }


    animate();


  </script>


</body>

</html>
