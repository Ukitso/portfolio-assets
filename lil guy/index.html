<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* FULL PAGE INTERACTION AREA */

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* THE LITTLE GUY */

    .character {
      position: absolute;

      width: 350px;
      height: 350px;

      left: 50%;
      top: 50%;

      /*
        Keep the character
        centred in the widget.
      */

      transform: translate(-50%, -50%);
    }


    /*
      BODY WRAPPER

      This is animated separately
      from the eyeball.
    */

    .body-wrapper {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      transform-origin: center center;

      will-change: transform;
    }


    /* BODY */

    .body {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;
    }


    /* EYEBALL */

    .eye {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;

      will-change: transform;
    }

  </style>

</head>


<body>


  <!-- FULL PAGE INTERACTION AREA -->

  <div
    class="scene"
    id="scene"
  >


    <!-- CHARACTER -->

    <div
      class="character"
      id="character"
    >


      <!--
        BODY WRAPPER

        Lets the body move
        independently.
      -->

      <div
        class="body-wrapper"
        id="bodyWrapper"
      >

        <img
          src="body.png"
          class="body"
          alt=""
        >

      </div>


      <!-- EYEBALL -->

      <img
        src="eyeball.png"
        class="eye"
        id="eye"
        alt=""
      >


    </div>


  </div>


  <script>


    /* ELEMENTS */

    const scene =
      document.getElementById("scene");

    const eye =
      document.getElementById("eye");

    const bodyWrapper =
      document.getElementById("bodyWrapper");


    /* ------------------------- */
    /* EYE POSITION              */
    /* ------------------------- */


    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;


    /*
      MAXIMUM CURSOR
      EYE MOVEMENT
    */

    const maxMove = 18;


    /* ------------------------- */
    /* IDLE STATE                */
    /* ------------------------- */


    let idle = true;
    let idleTimer;


    /*
      AWARENESS RADIUS
    */

    const closeDistance = 180;
    const farDistance = 800;


    /*
      RETURN TO IDLE
      AFTER 2.5 SECONDS
    */

    function resetIdle() {

      clearTimeout(idleTimer);

      idle = false;


      idleTimer = setTimeout(() => {

        idle = true;

        chooseIdleTarget();

      }, 2500);

    }


    /*
      PICK A MORE ACTIVE
      IDLE LOOKING POSITION
    */

    function chooseIdleTarget() {

      if (!idle) return;


      targetX =
        (Math.random() * 28) - 14;


      targetY =
        (Math.random() * 20) - 10;


      setTimeout(() => {

        if (idle) {

          chooseIdleTarget();

        }

      },

      700 + Math.random() * 1300

      );

    }


    /* ------------------------- */
    /* CURSOR TRACKING           */
    /* ------------------------- */


    scene.addEventListener(
      "mousemove",
      (event) => {


        const rect =
          eye.getBoundingClientRect();


        const centerX =
          rect.left +
          rect.width / 2;


        const centerY =
          rect.top +
          rect.height / 2;


        const deltaX =
          event.clientX -
          centerX;


        const deltaY =
          event.clientY -
          centerY;


        /*
          TRUE RADIAL DISTANCE
        */

        const distance =
          Math.sqrt(
            deltaX * deltaX +
            deltaY * deltaY
          );


        let attention = 0;


        /*
          FULL ATTENTION
        */

        if (
          distance <= closeDistance
        ) {

          attention = 1;

        }


        /*
          SOFT ATTENTION
          FALLOFF
        */

        else if (
          distance < farDistance
        ) {


          const progress =
            (distance - closeDistance) /
            (farDistance - closeDistance);


          const smoothProgress =
            progress *
            progress *
            (3 - 2 * progress);


          attention =
            1 -
            smoothProgress;

        }


        /*
          ONLY INTERRUPT IDLE
          WHEN HE NOTICES YOU
        */

        if (
          attention > 0.05
        ) {

          resetIdle();


          const angle =
            Math.atan2(
              deltaY,
              deltaX
            );


          targetX =
            Math.cos(angle) *
            maxMove *
            attention;


          targetY =
            Math.sin(angle) *
            maxMove *
            attention;

        }

      }
    );


    /*
      CURSOR LEAVES PAGE
    */

    scene.addEventListener(
      "mouseleave",
      () => {

        resetIdle();

      }
    );


    /* ------------------------- */
    /* BODY ANIMATION            */
    /* ------------------------- */


    /*
      BODY LEAN

      The body follows the
      eye slightly behind.
    */

    let bodyLeanX = 0;
    let bodyLeanY = 0;


    /*
      FLOATING TIMER

      Used for continuous
      gentle movement.
    */

    let startTime =
      performance.now();


    function animate() {


      /* --------------------- */
      /* EYE MOVEMENT          */
      /* --------------------- */


      currentX +=
        (targetX - currentX) *
        0.08;


      currentY +=
        (targetY - currentY) *
        0.08;


      eye.style.transform =
        `translate(
          ${currentX}px,
          ${currentY}px
        )`;


      /* --------------------- */
      /* BODY LEAN             */
      /* --------------------- */


      /*
        Body follows eye
        with slower easing.
      */

      bodyLeanX +=
        (
          currentX -
          bodyLeanX
        ) *
        0.025;


      bodyLeanY +=
        (
          currentY -
          bodyLeanY
        ) *
        0.025;


      /*
        BODY POSITION

        Eye movement is scaled
        down so the body only
        reacts subtly.
      */

      const leanX =
        bodyLeanX *
        0.18;


      const leanY =
        bodyLeanY *
        0.10;


      /*
        TIME FOR BREATHING
        / FLOATING MOTION
      */

      const time =
        (
          performance.now() -
          startTime
        ) /
        1000;


      /*
        SUBTLE FLOAT
      */

      const floatY =
        Math.sin(
          time *
          1.4
        ) *
        3;


      /*
        TINY NATURAL ROTATION

        The eye direction also
        influences the lean.
      */

      const rotate =
        (
          bodyLeanX *
          0.12
        ) +

        (
          Math.sin(
            time *
            0.9
          ) *
          0.5
        );


      /*
        APPLY BODY MOVEMENT
      */

      bodyWrapper.style.transform =
        `
          translate(
            ${leanX}px,
            ${leanY + floatY}px
          )
          rotate(
            ${rotate}deg
          )
        `;


      requestAnimationFrame(
        animate
      );

    }


    /* START */

    animate();
    chooseIdleTarget();


  </script>


</body>

</html>
