<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #kkzywz {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="kkzywz"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// SETUP
// ============================================================

const container =
  document.getElementById("kkzywz");

const scene =
  new THREE.Scene();


// ============================================================
// CAMERA
// ============================================================

const camera =
  new THREE.PerspectiveCamera(
    45,
    container.clientWidth /
      container.clientHeight,
    0.01,
    1000
  );


// ============================================================
// RENDERER
// ============================================================

const renderer =
  new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setClearColor(
  0x000000,
  0
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.NoToneMapping;

renderer.toneMappingExposure =
  1.0;

container.appendChild(
  renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    0.45
  );

scene.add(
  ambientLight
);


const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    1.8
  );

directionalLight.position.set(
  4,
  5,
  6
);

scene.add(
  directionalLight
);


const fillLight =
  new THREE.DirectionalLight(
    0xffffff,
    0.15
  );

fillLight.position.set(
  -4,
  2,
  3
);

scene.add(
  fillLight
);


// ============================================================
// MODEL
// ============================================================

const loader =
  new GLTFLoader();

let oko;


// ============================================================
// BONES
// ============================================================

let leftEar;
let rightEar;

let leftShoulder;
let rightShoulder;

let leftArm;
let rightArm;

let leftHip;
let rightHip;

let leftLeg;
let rightLeg;

let head;
let eyeball;


// ============================================================
// BASE TRANSFORMS
// ============================================================

let leftEarBaseRotation;
let rightEarBaseRotation;

let leftShoulderBaseRotation;
let rightShoulderBaseRotation;

let leftArmBaseRotation;
let rightArmBaseRotation;

let leftHipBaseRotation;
let rightHipBaseRotation;

let leftLegBaseRotation;
let rightLegBaseRotation;

let headBaseRotation;

let eyeballBasePosition;

let baseOkoPosition;
let baseOkoScale;


// ============================================================
// EYE
// ============================================================

let eyeMovementAmount = 0;

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;


// ============================================================
// NORMAL IDLE EYE DARTS
// ============================================================

let eyeDartX = 0;
let eyeDartY = 0;

let eyeDartTargetX = 0;
let eyeDartTargetY = 0;

let eyeDartAmount = 0;

let nextEyeDart = 3.0;

let eyeDartStart = -10;

const eyeDartDuration = 0.38;


// ============================================================
// NERVOUS EYES
// ============================================================

let nervousEyeX = 0;
let nervousEyeY = 0;

let nervousEyeTargetX = 0;
let nervousEyeTargetY = 0;

let nextNervousEyeMove = 0;

let nervousEyeStart = -10;

let nervousEyeStrength = 0;

let nervousEyePhase = "none";


// ============================================================
// POINTER
// ============================================================

let pointerX = 0;
let pointerY = 0;

let pointerScreenX = 0;
let pointerScreenY = 0;

let pointerMoved = false;


// ============================================================
// BEHAVIOUR
// ============================================================

let behaviour = "idle";

let shyAmount = 0;

let shyPulse = 0;

let wasNear = false;


// ============================================================
// EAR REACTION
// ============================================================

let earReaction = 0;

let earReactionStart = -10;

const earReactionDuration = 0.42;


// ============================================================
// EAR IDLE TWITCH
// ============================================================

let earTwitchLeft = 0;
let earTwitchRight = 0;

let nextLeftEarTwitch = 2.5;
let nextRightEarTwitch = 4.0;

let leftEarTwitchStart = -10;
let rightEarTwitchStart = -10;

const earTwitchDuration = 0.28;


// ============================================================
// IDLE BODY ACTIONS
// ============================================================

let idleAction = null;

let nextIdleAction = 2.5;


// ============================================================
// LOAD MODEL
// ============================================================

loader.load(
  "./OKO.glb",

  function(gltf) {

    console.log(
      "OKO LOADED"
    );

    oko =
      gltf.scene;


    // --------------------------------------------------------
    // CENTER MODEL
    // --------------------------------------------------------

    const box =
      new THREE.Box3()
        .setFromObject(
          oko
        );

    const size =
      box.getSize(
        new THREE.Vector3()
      );

    const center =
      box.getCenter(
        new THREE.Vector3()
      );

    oko.position.sub(
      center
    );

    scene.add(
      oko
    );


    // --------------------------------------------------------
    // BASE TRANSFORMS
    // --------------------------------------------------------

    baseOkoPosition =
      oko.position.clone();

    baseOkoScale =
      oko.scale.clone();


    // --------------------------------------------------------
    // BONES
    // --------------------------------------------------------

    leftEar =
      oko.getObjectByName(
        "left_ear"
      );

    rightEar =
      oko.getObjectByName(
        "right_ear"
      );


    leftShoulder =
      oko.getObjectByName(
        "left_shoulder"
      );

    rightShoulder =
      oko.getObjectByName(
        "right_shoulder"
      );


    leftArm =
      oko.getObjectByName(
        "left_arm"
      );

    rightArm =
      oko.getObjectByName(
        "right_arm"
      );


    leftHip =
      oko.getObjectByName(
        "left_hip_bone"
      );

    rightHip =
      oko.getObjectByName(
        "right_hip_bone"
      );


    leftLeg =
      oko.getObjectByName(
        "left_leg"
      );

    rightLeg =
      oko.getObjectByName(
        "right_leg"
      );


    head =
      oko.getObjectByName(
        "HEAD"
      );

    eyeball =
      oko.getObjectByName(
        "Eyeball"
      );


    // --------------------------------------------------------
    // BASE ROTATIONS
    // --------------------------------------------------------

    if (leftEar)
      leftEarBaseRotation =
        leftEar.rotation.clone();

    if (rightEar)
      rightEarBaseRotation =
        rightEar.rotation.clone();


    if (leftShoulder)
      leftShoulderBaseRotation =
        leftShoulder.rotation.clone();

    if (rightShoulder)
      rightShoulderBaseRotation =
        rightShoulder.rotation.clone();


    if (leftArm)
      leftArmBaseRotation =
        leftArm.rotation.clone();

    if (rightArm)
      rightArmBaseRotation =
        rightArm.rotation.clone();


    if (leftHip)
      leftHipBaseRotation =
        leftHip.rotation.clone();

    if (rightHip)
      rightHipBaseRotation =
        rightHip.rotation.clone();


    if (leftLeg)
      leftLegBaseRotation =
        leftLeg.rotation.clone();

    if (rightLeg)
      rightLegBaseRotation =
        rightLeg.rotation.clone();


    if (head)
      headBaseRotation =
        head.rotation.clone();


    if (eyeball)
      eyeballBasePosition =
        eyeball.position.clone();


    // --------------------------------------------------------
    // EYE MOVEMENT
    // --------------------------------------------------------

    eyeMovementAmount =
      Math.max(
        size.x,
        size.y,
        size.z
      ) * 0.045;


    // --------------------------------------------------------
    // CAMERA
    // --------------------------------------------------------

    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );

    const fov =
      THREE.MathUtils.degToRad(
        camera.fov
      );

    let distance =
      (maxSize / 2) /
      Math.tan(
        fov / 2
      );

    distance *= 1.35;


    camera.position.set(
      0,
      0,
      distance
    );

    camera.lookAt(
      0,
      0,
      0
    );

    camera.near =
      Math.max(
        0.01,
        distance / 100
      );

    camera.far =
      distance * 100;

    camera.updateProjectionMatrix();

  },

  undefined,

  function(error) {

    console.error(
      "ERROR LOADING OKO:",
      error
    );

  }
);


// ============================================================
// MOUSE
// ============================================================

document.addEventListener(
  "mousemove",
  function(e) {

    pointerScreenX =
      e.clientX;

    pointerScreenY =
      e.clientY;

    pointerMoved = true;


    const mouseX =
      (e.clientX /
        window.innerWidth) *
      2 - 1;

    const mouseY =
      (e.clientY /
        window.innerHeight) *
      2 - 1;


    pointerX =
      mouseX;

    pointerY =
      mouseY;


    targetX =
      mouseX * 0.45;

    targetY =
      mouseY * 0.30;

  }
);


// ============================================================
// SHY DETECTION
// ============================================================

function updateShyState() {

  if (!oko)
    return;


  const rect =
    container.getBoundingClientRect();


  const centreX =
    rect.left +
    rect.width / 2;

  const centreY =
    rect.top +
    rect.height / 2;


  const dx =
    pointerScreenX -
    centreX;

  const dy =
    pointerScreenY -
    centreY;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  const hoverRadius =
    Math.min(
      rect.width,
      rect.height
    ) * 0.38;


  const pointerNear =
    pointerMoved &&
    distance <
    hoverRadius;


  // ----------------------------------------------------------
  // ENTER SHY
  // ----------------------------------------------------------

  if (
    pointerNear &&
    !wasNear
  ) {

    behaviour =
      "shy";

    shyPulse =
      1;


    earReaction =
      1;

    earReactionStart =
      clock.getElapsedTime();


    // Start nervous eyes

    nervousEyeX = 0;
    nervousEyeY = 0;

    nervousEyeTargetX =
      THREE.MathUtils.randFloat(
        -0.15,
        0.15
      );

    nervousEyeTargetY =
      THREE.MathUtils.randFloat(
        -0.08,
        0.08
      );

    nervousEyeStart =
      clock.getElapsedTime();

    nervousEyeStrength =
      1;

    nervousEyePhase =
      "look";


    nextNervousEyeMove =
      clock.getElapsedTime() +
      THREE.MathUtils.randFloat(
        0.7,
        1.4
      );

  }


  // ----------------------------------------------------------
  // LEAVE SHY
  // ----------------------------------------------------------

  if (
    !pointerNear &&
    wasNear
  ) {

    behaviour =
      "idle";

    nervousEyeStrength =
      0;

    nervousEyePhase =
      "none";

  }


  wasNear =
    pointerNear;


  // ----------------------------------------------------------
  // SHY AMOUNT
  // ----------------------------------------------------------

  const targetShy =
    pointerNear
      ? 1
      : 0;


  shyAmount =
    THREE.MathUtils.damp(
      shyAmount,
      targetShy,
      pointerNear
        ? 9
        : 4,
      1 / 60
    );


  // ----------------------------------------------------------
  // STARTLE
  // ----------------------------------------------------------

  shyPulse =
    THREE.MathUtils.damp(
      shyPulse,
      0,
      12,
      1 / 60
    );

}


// ============================================================
// NERVOUS EYE BEHAVIOUR
// ============================================================

function updateNervousEyes(time) {

  if (
    behaviour !== "shy"
  ) {

    nervousEyeX =
      THREE.MathUtils.damp(
        nervousEyeX,
        0,
        7,
        1 / 60
      );

    nervousEyeY =
      THREE.MathUtils.damp(
        nervousEyeY,
        0,
        7,
        1 / 60
      );

    return;

  }


  // ----------------------------------------------------------
  // RANDOM NERVOUS FLICK
  // ----------------------------------------------------------

  if (
    time >
    nextNervousEyeMove
  ) {

    nervousEyeStart =
      time;


    nervousEyeTargetX =
      THREE.MathUtils.randFloat(
        -0.16,
        0.16
      );

    nervousEyeTargetY =
      THREE.MathUtils.randFloat(
        -0.10,
        0.10
      );


    nervousEyeStrength =
      1;


    if (
      Math.random() < 0.35
    ) {

      nervousEyeTargetX =
        Math.random() > 0.5
          ? 0.22
          : -0.22;

    }


    nextNervousEyeMove =
      time +
      THREE.MathUtils.randFloat(
        0.65,
        1.8
      );

  }


  // ----------------------------------------------------------
  // QUICK EYE MOVEMENT
  // ----------------------------------------------------------

  nervousEyeX =
    THREE.MathUtils.damp(
      nervousEyeX,
      nervousEyeTargetX,
      18,
      1 / 60
    );


  nervousEyeY =
    THREE.MathUtils.damp(
      nervousEyeY,
      nervousEyeTargetY,
      18,
      1 / 60
    );


  // ----------------------------------------------------------
  // TINY NERVOUS MICRO MOVEMENT
  // ----------------------------------------------------------

  const microX =
    Math.sin(
      time * 17
    ) *
    0.012;


  const microY =
    Math.sin(
      time * 13.5 +
      1.4
    ) *
    0.008;


  nervousEyeX +=
    microX *
    nervousEyeStrength;

  nervousEyeY +=
    microY *
    nervousEyeStrength;

}


// ============================================================
// NORMAL IDLE EYE DART
// ============================================================

function updateEyeDart(time) {

  if (!eyeball)
    return;


  if (
    behaviour === "shy"
  ) {

    return;

  }


  if (
    time >
    nextEyeDart
  ) {

    eyeDartStart =
      time;

    eyeDartAmount =
      1;


    eyeDartTargetX =
      THREE.MathUtils.randFloat(
        -0.18,
        0.18
      );

    eyeDartTargetY =
      THREE.MathUtils.randFloat(
        -0.12,
        0.12
      );


    nextEyeDart =
      time +
      THREE.MathUtils.randFloat(
        2.5,
        6
      );

  }


  const elapsed =
    time -
    eyeDartStart;


  let progress =
    THREE.MathUtils.clamp(
      elapsed /
        eyeDartDuration,
      0,
      1
    );


  let dart =
    0;


  if (
    progress < 0.20
  ) {

    dart =
      easeOut(
        progress / 0.20
      );

  } else {

    dart =
      1 -
      easeInOut(
        (progress - 0.20) /
        0.80
      );

  }


  dart *=
    eyeDartAmount;


  eyeDartX =
    eyeDartTargetX *
    dart;

  eyeDartY =
    eyeDartTargetY *
    dart;


  if (
    progress >= 1
  ) {

    eyeDartAmount =
      0;

  }

}


// ============================================================
// RANDOM EAR TWITCHES
// ============================================================

function updateEarTwitches(time) {

  if (
    !leftEar ||
    !rightEar
  ) {
    return;
  }


  // ----------------------------------------------------------
  // LEFT
  // ----------------------------------------------------------

  if (
    time >
    nextLeftEarTwitch
  ) {

    leftEarTwitchStart =
      time;

    earTwitchLeft =
      1;


    nextLeftEarTwitch =
      time +
      THREE.MathUtils.randFloat(
        2.5,
        6
      );

  }


  // ----------------------------------------------------------
  // RIGHT
  // ----------------------------------------------------------

  if (
    time >
    nextRightEarTwitch
  ) {

    rightEarTwitchStart =
      time;

    earTwitchRight =
      1;


    nextRightEarTwitch =
      time +
      THREE.MathUtils.randFloat(
        3,
        7
      );

  }


  // ----------------------------------------------------------
  // LEFT TWITCH
  // ----------------------------------------------------------

  const leftElapsed =
    time -
    leftEarTwitchStart;


  let leftProgress =
    THREE.MathUtils.clamp(
      leftElapsed /
        earTwitchDuration,
      0,
      1
    );


  let leftTwitch =
    0;


  if (
    leftProgress < 0.25
  ) {

    leftTwitch =
      easeOut(
        leftProgress / 0.25
      );

  } else {

    leftTwitch =
      1 -
      easeInOut(
        (leftProgress - 0.25) /
        0.75
      );

  }


  leftTwitch *=
    earTwitchLeft;


  // ----------------------------------------------------------
  // RIGHT TWITCH
  // ----------------------------------------------------------

  const rightElapsed =
    time -
    rightEarTwitchStart;


  let rightProgress =
    THREE.MathUtils.clamp(
      rightElapsed /
        earTwitchDuration,
      0,
      1
    );


  let rightTwitch =
    0;


  if (
    rightProgress < 0.25
  ) {

    rightTwitch =
      easeOut(
        rightProgress / 0.25
      );

  } else {

    rightTwitch =
      1 -
      easeInOut(
        (rightProgress - 0.25) /
        0.75
      );

  }


  rightTwitch *=
    earTwitchRight;


  // ----------------------------------------------------------
  // SUBTLE CONSTANT EAR LIFE
  // ----------------------------------------------------------

  const leftSway =
    Math.sin(
      time * 0.80
    ) * 0.018;


  const rightSway =
    Math.sin(
      time * 0.72 +
      1.8
    ) * 0.014;


  const leftSwayZ =
    Math.sin(
      time * 0.63 +
      0.5
    ) * 0.012;


  const rightSwayZ =
    Math.sin(
      time * 0.68 +
      2.2
    ) * 0.010;


  // ----------------------------------------------------------
  // LEFT EAR
  // ----------------------------------------------------------

  leftEar.rotation.x =
    leftEarBaseRotation.x +
    leftSway +
    leftTwitch * 0.13;


  leftEar.rotation.z =
    leftEarBaseRotation.z +
    leftSwayZ +
    leftTwitch * 0.08;


  // ----------------------------------------------------------
  // RIGHT EAR
  // ----------------------------------------------------------

  rightEar.rotation.x =
    rightEarBaseRotation.x +
    rightSway +
    rightTwitch * 0.11;


  rightEar.rotation.z =
    rightEarBaseRotation.z +
    rightSwayZ -
    rightTwitch * 0.07;


  // ----------------------------------------------------------
  // FINISH
  // ----------------------------------------------------------

  if (
    leftProgress >= 1
  ) {

    earTwitchLeft =
      0;

  }


  if (
    rightProgress >= 1
  ) {

    earTwitchRight =
      0;

  }

}


// ============================================================
// BIG SHY EAR REACTION
// ============================================================

function updateEarReaction(time) {

  if (
    !leftEar ||
    !rightEar
  ) {
    return;
  }


  const elapsed =
    time -
    earReactionStart;


  let progress =
    elapsed /
    earReactionDuration;


  progress =
    THREE.MathUtils.clamp(
      progress,
      0,
      1
    );


  let reaction =
    0;


  if (
    progress < 0.35
  ) {

    const p =
      progress / 0.35;

    reaction =
      easeOut(p);

  } else {

    const p =
      (progress - 0.35) /
      0.65;

    reaction =
      1 -
      easeInOut(p);

  }


  reaction *=
    earReaction;


  leftEar.rotation.x +=
    reaction * 0.24;

  leftEar.rotation.z +=
    reaction * 0.10;


  rightEar.rotation.x +=
    reaction * 0.18;

  rightEar.rotation.z -=
    reaction * 0.14;

}


// ============================================================
// IDLE ACTIONS
// ============================================================

function startIdleAction(time) {

  if (
    behaviour !== "idle" ||
    idleAction
  ) {
    return;
  }


  const actions = [
    "look",
    "weight"
  ];


  const type =
    actions[
      Math.floor(
        Math.random() *
        actions.length
      )
    ];


  idleAction = {

    type: type,

    start: time,

    duration:
      type === "look"
        ? 1.1
        : 0.9

  };

}


// ============================================================
// EASING
// ============================================================

function easeInOut(t) {

  return (
    t < 0.5

      ? 2 * t * t

      : 1 -
        Math.pow(
          -2 * t + 2,
          2
        ) / 2
  );

}


function easeOut(t) {

  return 1 -
    Math.pow(
      1 - t,
      3
    );

}


// ============================================================
// IDLE ACTION UPDATE
// ============================================================

function updateIdleAction(time) {

  if (!oko)
    return;


  if (
    behaviour !== "idle"
  ) {

    idleAction =
      null;

    return;

  }


  if (
    !idleAction &&
    time >
    nextIdleAction
  ) {

    startIdleAction(
      time
    );

  }


  if (!idleAction)
    return;


  const elapsed =
    time -
    idleAction.start;


  const progress =
    Math.min(
      elapsed /
        idleAction.duration,
      1
    );


  // ----------------------------------------------------------
  // LOOK
  // ----------------------------------------------------------

  if (
    idleAction.type === "look"
  ) {

    const p =
      Math.sin(
        progress *
        Math.PI
      );


    const direction =
      Math.random() > 0.5
        ? 1
        : -1;


    if (head) {

      head.rotation.y =
        headBaseRotation.y +
        direction *
        p *
        0.12;

    }

  }


  // ----------------------------------------------------------
  // WEIGHT SHIFT
  // ----------------------------------------------------------

  if (
    idleAction.type === "weight"
  ) {

    const p =
      Math.sin(
        progress *
        Math.PI
      );


    if (leftLeg) {

      leftLeg.rotation.z =
        leftLegBaseRotation.z +
        p * 0.14;

    }


    if (rightLeg) {

      rightLeg.rotation.z =
        rightLegBaseRotation.z -
        p * 0.14;

    }


    if (leftHip) {

      leftHip.rotation.z =
        leftHipBaseRotation.z +
        p * 0.025;

    }


    if (rightHip) {

      rightHip.rotation.z =
        rightHipBaseRotation.z -
        p * 0.025;

    }

  }


  // ----------------------------------------------------------
  // FINISH
  // ----------------------------------------------------------

  if (
    progress >= 1
  ) {

    idleAction =
      null;


    nextIdleAction =
      time +
      THREE.MathUtils.randFloat(
        1.8,
        4.5
      );

  }

}


// ============================================================
// BREATHING
// ============================================================

function updateBreathing(time) {

  if (!oko)
    return;


  const breathing =
    Math.sin(
      time * 1.15
    );


  const inhale =
    (breathing + 1) / 2;


  if (baseOkoScale) {

    const breathScale =
      inhale *
      0.006;


    oko.scale.x =
      baseOkoScale.x +
      breathScale;


    oko.scale.y =
      baseOkoScale.y +
      breathScale * 1.5;


    oko.scale.z =
      baseOkoScale.z +
      breathScale;

  }

}


// ============================================================
// MAIN ANIMATION
// ============================================================

const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  // ----------------------------------------------------------
  // TIME
  // ----------------------------------------------------------

  const time =
    clock.getElapsedTime();


  // ----------------------------------------------------------
  // BEHAVIOUR
  // ----------------------------------------------------------

  updateShyState();

  updateIdleAction(
    time
  );


  // ----------------------------------------------------------
  // EYES
  // ----------------------------------------------------------

  currentX +=
    (
      targetX -
      currentX
    ) * 0.08;


  currentY +=
    (
      targetY -
      currentY
    ) * 0.08;


  updateEyeDart(
    time
  );

  updateNervousEyes(
    time
  );


  if (!oko) {

    renderer.render(
      scene,
      camera
    );

    return;

  }


  // ==========================================================
  // BREATHING
  // ==========================================================

  updateBreathing(
    time
  );


  // ==========================================================
  // HEAD
  // ==========================================================

  if (head) {

    head.rotation.y =
      headBaseRotation.y +
      currentX * 0.18;


    head.rotation.x =
      headBaseRotation.x -
      currentY * 0.10;


    head.rotation.z =
      headBaseRotation.z;


    // Shy turn

    head.rotation.y +=
      -currentX *
      shyAmount *
      0.16;


    // Shy tuck

    head.rotation.x +=
      shyAmount *
      0.06;


    // Startle

    head.rotation.z +=
      shyPulse *
      0.035;


    // Breathing

    head.rotation.x +=
      Math.sin(
        time * 1.15
      ) *
      0.004;

  }


  // ==========================================================
  // EYEBALL
  // ==========================================================

  if (
    eyeball &&
    eyeMovementAmount > 0
  ) {

    let finalEyeX =
      currentX *
      eyeMovementAmount;


    let finalEyeY =
      -currentY *
      eyeMovementAmount;


    // Normal idle dart

    finalEyeX +=
      eyeDartX *
      eyeMovementAmount *
      0.65;


    finalEyeY +=
      -eyeDartY *
      eyeMovementAmount *
      0.65;


    // Nervous eye behaviour

    if (
      behaviour === "shy"
    ) {

      // Reduce cursor tracking

      finalEyeX =
        currentX *
        eyeMovementAmount *
        0.45;


      finalEyeY =
        -currentY *
        eyeMovementAmount *
        0.45;


      // Add nervous glances

      finalEyeX +=
        nervousEyeX *
        eyeMovementAmount;


      finalEyeY +=
        -nervousEyeY *
        eyeMovementAmount;

    }


    eyeball.position.x =
      eyeballBasePosition.x +
      finalEyeX;


    eyeball.position.y =
      eyeballBasePosition.y +
      finalEyeY;


    eyeball.position.z =
      eyeballBasePosition.z;

  }


  // ==========================================================
  // EARS
  // ==========================================================

  updateEarTwitches(
    time
  );

  updateEarReaction(
    time
  );


  // ==========================================================
  // SHOULDERS
  // ==========================================================

  if (
    leftShoulder &&
    rightShoulder
  ) {

    leftShoulder.rotation.z =
      leftShoulderBaseRotation.z;

    rightShoulder.rotation.z =
      rightShoulderBaseRotation.z;


    leftShoulder.rotation.z +=
      shyAmount *
      0.025;

    rightShoulder.rotation.z -=
      shyAmount *
      0.025;


    const breathing =
      Math.sin(
        time * 1.15
      ) *
      0.012;


    leftShoulder.rotation.x =
      leftShoulderBaseRotation.x +
      breathing;


    rightShoulder.rotation.x =
      rightShoulderBaseRotation.x +
      breathing;

  }


  // ==========================================================
  // ARMS
  // ==========================================================

  if (
    leftArm &&
    rightArm
  ) {

    leftArm.rotation.z =
      leftArmBaseRotation.z;

    rightArm.rotation.z =
      rightArmBaseRotation.z;


    leftArm.rotation.x =
      leftArmBaseRotation.x;

    rightArm.rotation.x =
      rightArmBaseRotation.x;


    leftArm.rotation.y =
      leftArmBaseRotation.y;

    rightArm.rotation.y =
      rightArmBaseRotation.y;


    // --------------------------------------------------------
    // SHY TUCK
    // --------------------------------------------------------

    leftArm.rotation.z +=
      shyAmount *
      0.16;

    rightArm.rotation.z -=
      shyAmount *
      0.16;


    leftArm.rotation.x +=
      shyAmount *
      0.08;

    rightArm.rotation.x +=
      shyAmount *
      0.08;


    // --------------------------------------------------------
    // STARTLE
    // --------------------------------------------------------

    leftArm.rotation.z +=
      shyPulse *
      0.10;

    rightArm.rotation.z -=
      shyPulse *
      0.10;


    // --------------------------------------------------------
    // NERVOUS FIDGET
    // --------------------------------------------------------

    if (
      behaviour === "shy"
    ) {

      const nervousLeft =
        Math.sin(
          time * 11.5
        ) *
        0.012 *
        shyAmount;


      const nervousRight =
        Math.sin(
          time * 13.2 +
          1.7
        ) *
        0.010 *
        shyAmount;


      leftArm.rotation.z +=
        nervousLeft;


      rightArm.rotation.z -=
        nervousRight;


      leftArm.rotation.x +=
        Math.sin(
          time * 8.5
        ) *
        0.006 *
        shyAmount;


      rightArm.rotation.x +=
        Math.sin(
          time * 9.7 +
          2
        ) *
        0.005 *
        shyAmount;

    }


    // --------------------------------------------------------
    // BREATHING
    // --------------------------------------------------------

    const armBreathing =
      Math.sin(
        time * 1.15
      ) *
      0.006;


    leftArm.rotation.x +=
      armBreathing;

    rightArm.rotation.x +=
      armBreathing;

  }


  // ==========================================================
  // LEGS
  // ==========================================================

  if (
    leftLeg &&
    rightLeg
  ) {

    leftLeg.rotation.z =
      leftLegBaseRotation.z;

    rightLeg.rotation.z =
      rightLegBaseRotation.z;


    leftLeg.rotation.x =
      leftLegBaseRotation.x;

    rightLeg.rotation.x =
      rightLegBaseRotation.x;


    leftLeg.rotation.y =
      leftLegBaseRotation.y;

    rightLeg.rotation.y =
      rightLegBaseRotation.y;


    // Shy weight shift

    leftLeg.rotation.z +=
      shyAmount *
      0.055;

    rightLeg.rotation.z -=
      shyAmount *
      0.055;


    // Tiny crouch

    leftLeg.rotation.x +=
      shyAmount *
      0.035;

    rightLeg.rotation.x +=
      shyAmount *
      0.035;

  }


  // ==========================================================
  // HIPS
  // ==========================================================

  if (
    leftHip &&
    rightHip
  ) {

    leftHip.rotation.z =
      leftHipBaseRotation.z;

    rightHip.rotation.z =
      rightHipBaseRotation.z;


    leftHip.rotation.z +=
      shyAmount *
      0.015;

    rightHip.rotation.z -=
      shyAmount *
      0.015;

  }


  // ==========================================================
  // BODY SCALE
  // ==========================================================

  if (baseOkoScale) {

    const breathing =
      (
        Math.sin(
          time * 1.15
        ) + 1
      ) / 2 *
      0.006;


    const shySquash =
      shyAmount *
      0.035 +
      shyPulse *
      0.025;


    oko.scale.x =
      baseOkoScale.x +
      breathing +
      shySquash *
      0.35;


    oko.scale.y =
      baseOkoScale.y +
      breathing *
      1.5 -
      shySquash;


    oko.scale.z =
      baseOkoScale.z +
      breathing +
      shySquash *
      0.35;

  }


  // ==========================================================
  // BODY POSITION
  // ==========================================================

  if (baseOkoPosition) {

    const awayX =
      -currentX *
      shyAmount *
      0.035;


    const crouch =
      shyAmount *
      -0.025;


    const startle =
      shyPulse *
      -0.015;


    const breathing =
      Math.sin(
        time * 1.15
      ) *
      0.003;


    oko.position.x =
      baseOkoPosition.x +
      awayX;


    oko.position.y =
      baseOkoPosition.y +
      crouch +
      startle +
      breathing;

  }


  // ==========================================================
  // RENDER
  // ==========================================================

  renderer.render(
    scene,
    camera
  );

}


// ============================================================
// START
// ============================================================

animate();


// ============================================================
// RESIZE
// ============================================================

function resize() {

  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if (
    width === 0 ||
    height === 0
  ) {
    return;
  }


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height
  );

}


window.addEventListener(
  "resize",
  resize
);

</script>

</body>
</html>
