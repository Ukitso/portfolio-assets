<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    #scene {

      width: 100%;
      height: 100%;

    }


    canvas {

      display: block;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <div id="scene"></div>


  <script type="module">


    /* ------------------------- */
    /* IMPORTS                   */
    /* ------------------------- */


    import * as THREE from "three";


    import {

      GLTFLoader

    } from "three/addons/loaders/GLTFLoader.js";


    /* ------------------------- */
    /* SCENE                     */
    /* ------------------------- */


    const container =
      document.getElementById(
        "scene"
      );


    const scene =
      new THREE.Scene();


    /* ------------------------- */
    /* CAMERA                    */
    /* ------------------------- */


    const camera =
      new THREE.PerspectiveCamera(

        45,

        container.clientWidth /
        container.clientHeight,

        0.01,

        1000

      );


    /* ------------------------- */
    /* RENDERER                  */
    /* ------------------------- */


    const renderer =
      new THREE.WebGLRenderer({

        alpha: true,

        antialias: true

      });


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio,

        2

      )

    );


    renderer.setSize(

      container.clientWidth,

      container.clientHeight

    );


    renderer.setClearColor(

      0x000000,

      0

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.NoToneMapping;


    renderer.toneMappingExposure =
      1.0;


    container.appendChild(

      renderer.domElement

    );


    /* ------------------------- */
    /* LIGHTING                  */
    /* ------------------------- */


    const ambientLight =
      new THREE.AmbientLight(

        0xffffff,

        0.22

      );


    scene.add(

      ambientLight

    );


    /*
      MAIN LIGHT

      Positioned to the RIGHT,
      above and towards the front.
    */


    const keyLight =
      new THREE.DirectionalLight(

        0xffffff,

        3.2

      );


    keyLight.position.set(

      7,

      6,

      8

    );


    keyLight.target.position.set(

      0,

      0,

      0

    );


    scene.add(

      keyLight

    );


    scene.add(

      keyLight.target

    );


    /*
      VERY SUBTLE FILL
    */


    const fillLight =
      new THREE.DirectionalLight(

        0xffffff,

        0.08

      );


    fillLight.position.set(

      -5,

      1,

      4

    );


    fillLight.target.position.set(

      0,

      0,

      0

    );


    scene.add(

      fillLight

    );


    scene.add(

      fillLight.target

    );


    /*
      SHARP HIGHLIGHT SPOT
    */


    const spotLight =
      new THREE.SpotLight(

        0xffffff,

        35,

        20,

        Math.PI / 7,

        0.35,

        2

      );


    spotLight.position.set(

      5,

      5,

      7

    );


    spotLight.target.position.set(

      0,

      0,

      0

    );


    scene.add(

      spotLight

    );


    scene.add(

      spotLight.target

    );


    /* ------------------------- */
    /* EYEBALL MOVEMENT          */
    /* ------------------------- */


    let targetX =
      0;


    let targetY =
      0;


    let currentX =
      0;


    let currentY =
      0;


    let idle =
      true;


    let idleTimer;


    const eyeMovementX =
      0.12;


    const eyeMovementY =
      0.10;


    function resetIdle() {


      clearTimeout(

        idleTimer

      );


      idle =
        false;


      idleTimer =
        setTimeout(

          () => {


            idle =
              true;


            chooseIdleTarget();


          },

          2500

        );


    }


    function chooseIdleTarget() {


      if (

        !idle

      ) {

        return;

      }


      targetX =
        THREE.MathUtils.randFloat(

          -

          eyeMovementX
          *
          0.8,

          eyeMovementX
          *
          0.8

        );


      targetY =
        THREE.MathUtils.randFloat(

          -

          eyeMovementY
          *
          0.8,

          eyeMovementY
          *
          0.8

        );


      setTimeout(

        () => {


          if (

            idle

          ) {


            chooseIdleTarget();


          }


        },


        THREE.MathUtils.randInt(

          1000,

          2500

        )

      );


    }


    document.addEventListener(

      "mousemove",

      (

        event

      ) => {


        resetIdle();


        const normalisedX =

          (

            event.clientX

            -

            window.innerWidth /
            2

          )

          /

          (

            window.innerWidth /
            2

          );


        const normalisedY =

          (

            event.clientY

            -

            window.innerHeight /
            2

          )

          /

          (

            window.innerHeight /
            2

          );


        targetX =

          THREE.MathUtils.clamp(

            normalisedX,

            -1,

            1

          )

          *

          eyeMovementX;


        targetY =

          THREE.MathUtils.clamp(

            normalisedY,

            -1,

            1

          )

          *

          eyeMovementY;


      }

    );


    /* ------------------------- */
    /* LOAD MODEL                */
    /* ------------------------- */


    const loader =
      new GLTFLoader();


    let oko;


    let eyeball =
      null;


    let eyeballBasePosition =
      new THREE.Vector3();


    /*
      BODY ANIMATION VALUES

      These follow the eye more
      slowly than the eyeball.
    */


    let bodyFollowX =
      0;


    let bodyFollowY =
      0;


    /*
      Base transform of the model.

      Saved once after centring so
      the idle animation is always
      relative to its proper position.
    */


    const bodyBasePosition =
      new THREE.Vector3();


    const bodyBaseRotation =
      new THREE.Euler();


    const bodyBaseScale =
      new THREE.Vector3();


    loader.load(

      "./OKO.glb",


      function (

        gltf

      ) {


        console.log(

          "OKO LOADED"

        );


        oko =
          gltf.scene;


        /* --------------------- */
        /* PREPARE MODEL         */
        /* --------------------- */


        oko.traverse(

          function (

            object

          ) {


            if (

              object.isMesh

            ) {


              object.frustumCulled =
                false;


              /*
                FIND EYEBALL
              */


              if (

                object.name ===
                "EYEBALL"

              ) {


                eyeball =
                  object;


                eyeballBasePosition
                  .copy(

                    eyeball.position

                  );


                console.log(

                  "EYEBALL FOUND"

                );


              }


              /*
                MATERIAL
              */


              if (

                object.material

              ) {


                object.material.roughness =
                  0.48;


                object.material.metalness =
                  0;


                object.material.needsUpdate =
                  true;


              }


            }


          }

        );


        /* --------------------- */
        /* MODEL BOUNDS          */
        /* --------------------- */


        const box =
          new THREE.Box3()
          .setFromObject(

            oko

          );


        const size =
          box.getSize(

            new THREE.Vector3()

          );


        const center =
          box.getCenter(

            new THREE.Vector3()

          );


        /*
          CENTRE MODEL
        */


        oko.position.sub(

          center

        );


        /*
          SAVE THE CENTRED
          TRANSFORM BEFORE
          ANIMATION STARTS.
        */


        bodyBasePosition.copy(

          oko.position

        );


        bodyBaseRotation.copy(

          oko.rotation

        );


        bodyBaseScale.copy(

          oko.scale

        );


        scene.add(

          oko

        );


        /* --------------------- */
        /* CAMERA FRAMING        */
        /* --------------------- */


        const maxSize =
          Math.max(

            size.x,

            size.y,

            size.z

          );


        const fov =
          THREE.MathUtils.degToRad(

            camera.fov

          );


        let distance =

          (

            maxSize /
            2

          )

          /

          Math.tan(

            fov /
            2

          );


        distance *=
          1.35;


        camera.position.set(

          0,

          0,

          distance

        );


        camera.lookAt(

          0,

          0,

          0

        );


        camera.near =
          Math.max(

            0.01,

            distance /
            100

          );


        camera.far =
          distance *
          100;


        camera.updateProjectionMatrix();


        chooseIdleTarget();


      },


      function (

        progress

      ) {


        if (

          progress.total

        ) {


          console.log(

            "LOADING:",

            Math.round(

              (

                progress.loaded /

                progress.total

              )

              *

              100

            )

            +

            "%"

          );


        }


      },


      function (

        error

      ) {


        console.error(

          "FAILED TO LOAD OKO:",

          error

        );


      }

    );


    /* ------------------------- */
    /* RESIZE                    */
    /* ------------------------- */


    function resize() {


      const width =
        container.clientWidth;


      const height =
        container.clientHeight;


      if (

        width === 0 ||

        height === 0

      ) {

        return;

      }


      camera.aspect =

        width /

        height;


      camera.updateProjectionMatrix();


      renderer.setSize(

        width,

        height

      );


    }


    window.addEventListener(

      "resize",

      resize

    );


    /* ------------------------- */
    /* ANIMATE EYEBALL           */
    /* ------------------------- */


    function animateEyeball() {


      if (

        !eyeball

      ) {

        return;

      }


      /*
        Smooth eye movement.
      */


      currentX +=

        (

          targetX

          -

          currentX

        )

        *

        0.08;


      currentY +=

        (

          targetY

          -

          currentY

        )

        *

        0.08;


      /*
        These are the directions
        that we confirmed work
        correctly for your model.
      */


      eyeball.position.x =

        eyeballBasePosition.x

        +

        currentX;


      eyeball.position.y =

        eyeballBasePosition.y

        -

        currentY;


      eyeball.position.z =

        eyeballBasePosition.z;


    }


    /* ------------------------- */
    /* ANIMATE BODY              */
    /* ------------------------- */


    function animateBody() {


      if (

        !oko

      ) {

        return;

      }


      /*
        BODY LAG

        The body follows the eye
        much more slowly.
      */


      bodyFollowX +=

        (

          currentX

          -

          bodyFollowX

        )

        *

        0.025;


      bodyFollowY +=

        (

          currentY

          -

          bodyFollowY

        )

        *

        0.025;


      /*
        LEFT / RIGHT LEAN

        Kept extremely subtle.
      */


      const lookAmountX =

        bodyFollowX /

        eyeMovementX;


      const lean =

        lookAmountX *

        0.08;


      /*
        UP / DOWN REACTION

        Looking up/down causes
        a very subtle squash
        and stretch.
      */


      const lookAmountY =

        bodyFollowY /

        eyeMovementY;


      const stretchY =

        1

        -

        (

          lookAmountY

          *

          0.025

        );


      const squashX =

        1

        +

        (

          lookAmountY

          *

          0.015

        );


      /*
        IDLE BREATHING

        Very slow and deliberately
        subtle.
      */


      const time =

        performance.now()

        *

        0.001;


      const breathing =

        Math.sin(

          time *
          1.5

        )

        *

        0.012;


      /*
        TINY IDLE SWAY

        This sits underneath the
        eye-driven lean.
      */


      const idleSway =

        Math.sin(

          time *
          0.7

        )

        *

        0.015;


      /*
        APPLY ROTATION

        Rotation around Z gives
        a left/right lean on screen.
      */


      oko.rotation.z =

        bodyBaseRotation.z

        -

        lean

        +

        idleSway;


      /*
        APPLY BREATHING SCALE

        Breathing slightly expands
        vertically and horizontally.
      */


      oko.scale.x =

        bodyBaseScale.x

        *

        (

          squashX

          -

          breathing *
          0.35

        );


      oko.scale.y =

        bodyBaseScale.y

        *

        (

          stretchY

          +

          breathing

        );


      /*
        Keep depth unchanged.
      */


      oko.scale.z =

        bodyBaseScale.z;


    }


    /* ------------------------- */
    /* RENDER LOOP               */
    /* ------------------------- */


    function animate() {


      requestAnimationFrame(

        animate

      );


      animateEyeball();


      animateBody();


      renderer.render(

        scene,

        camera

      );


    }


    animate();


  </script>


</body>

</html>
