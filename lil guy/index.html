<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Oko</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #oko-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="oko-container"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// SETUP
// ============================================================

const container = document.getElementById("oko-container");

const scene = new THREE.Scene();


// ============================================================
// CAMERA
// ============================================================

const camera = new THREE.PerspectiveCamera(
  45,
  container.clientWidth / container.clientHeight,
  0.01,
  1000
);


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setClearColor(0x000000, 0);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.NoToneMapping;

renderer.toneMappingExposure = 1.0;

container.appendChild(renderer.domElement);


// ============================================================
// LIGHTING
// ============================================================

// Soft ambient light
const ambientLight = new THREE.AmbientLight(
  0xffffff,
  0.22
);

scene.add(ambientLight);


// Main light from upper-right / front
const keyLight = new THREE.SpotLight(
  0xffffff,
  3.0
);

keyLight.position.set(
  4,
  5,
  6
);

keyLight.angle = THREE.MathUtils.degToRad(35);

keyLight.penumbra = 0.35;

keyLight.decay = 1.5;

keyLight.distance = 20;

scene.add(keyLight);


// Point the light toward Oko
const keyTarget = new THREE.Object3D();

keyTarget.position.set(
  0,
  0,
  0
);

scene.add(keyTarget);

keyLight.target = keyTarget;


// Small fill light from the opposite side
const fillLight = new THREE.DirectionalLight(
  0xffffff,
  0.12
);

fillLight.position.set(
  -4,
  2,
  3
);

scene.add(fillLight);


// ============================================================
// MODEL
// ============================================================

const loader = new GLTFLoader();

let oko = null;

let eyeball = null;

let eyeballBasePosition = new THREE.Vector3();


// Bones
let earLeft = null;
let earRight = null;

let armLeft = null;
let armRight = null;

let footLeft = null;
let footRight = null;


// Store original rotations
const baseRotations = new Map();


// ============================================================
// BONE NAME DETECTION
// ============================================================

function findBone(possibleNames) {

  if (!oko) return null;

  let found = null;

  oko.traverse(function(object) {

    if (!object.isBone) return;

    const name = object.name.toLowerCase();

    for (const possibleName of possibleNames) {

      if (
        name === possibleName ||
        name.includes(possibleName)
      ) {

        if (!found) {
          found = object;
        }

      }

    }

  });

  return found;
}


// ============================================================
// LOAD GLB
// ============================================================

loader.load(

  "./OKO.glb",

  function(gltf) {

    console.log("OKO LOADED");

    oko = gltf.scene;


    // --------------------------------------------------------
    // HIERARCHY
    // --------------------------------------------------------

    console.log(
      "========== OKO HIERARCHY =========="
    );

    oko.traverse(function(object) {

      console.log(
        object.type,
        "|",
        object.name || "(unnamed)"
      );

    });

    console.log(
      "========== END HIERARCHY =========="
    );


    // --------------------------------------------------------
    // FIND EYEBALL + BONES
    // --------------------------------------------------------

    oko.traverse(function(object) {

      // Eyeball mesh
      if (object.name === "EYEBALL") {

        eyeball = object;

        eyeballBasePosition.copy(
          eyeball.position
        );

        console.log(
          "EYEBALL FOUND:",
          eyeball.name
        );

      }


      // Store initial bone rotations
      if (object.isBone) {

        baseRotations.set(
          object,
          object.rotation.clone()
        );

      }

    });


    // --------------------------------------------------------
    // TRY TO FIND BONES
    // --------------------------------------------------------

    earLeft = findBone([
      "ear.l",
      "ear_l",
      "earleft",
      "left_ear",
      "left ear",
      "earleft"
    ]);

    earRight = findBone([
      "ear.r",
      "ear_r",
      "earright",
      "right_ear",
      "right ear",
      "earright"
    ]);


    armLeft = findBone([
      "arm.l",
      "arm_l",
      "armleft",
      "left_arm",
      "left arm"
    ]);

    armRight = findBone([
      "arm.r",
      "arm_r",
      "armright",
      "right_arm",
      "right arm"
    ]);


    footLeft = findBone([
      "foot.l",
      "foot_l",
      "footleft",
      "left_foot",
      "left foot",
      "leg.l",
      "leg_l"
    ]);

    footRight = findBone([
      "foot.r",
      "foot_r",
      "footright",
      "right_foot",
      "right foot",
      "leg.r",
      "leg_r"
    ]);


    console.log("EAR LEFT:", earLeft);

    console.log("EAR RIGHT:", earRight);

    console.log("ARM LEFT:", armLeft);

    console.log("ARM RIGHT:", armRight);

    console.log("FOOT LEFT:", footLeft);

    console.log("FOOT RIGHT:", footRight);


    // --------------------------------------------------------
    // CENTRE MODEL
    // --------------------------------------------------------

    const box = new THREE.Box3().setFromObject(oko);

    const size = box.getSize(
      new THREE.Vector3()
    );

    const center = box.getCenter(
      new THREE.Vector3()
    );

    oko.position.sub(center);


    scene.add(oko);


    // --------------------------------------------------------
    // CAMERA FRAMING
    // --------------------------------------------------------

    const maxSize = Math.max(
      size.x,
      size.y,
      size.z
    );

    const fov = THREE.MathUtils.degToRad(
      camera.fov
    );

    let distance =
      (maxSize / 2) /
      Math.tan(fov / 2);

    distance *= 1.35;


    camera.position.set(
      0,
      0,
      distance
    );

    camera.lookAt(
      0,
      0,
      0
    );


    camera.near =
      Math.max(
        0.01,
        distance / 100
      );

    camera.far =
      distance * 100;

    camera.updateProjectionMatrix();

  },

  undefined,

  function(error) {

    console.error(
      "FAILED TO LOAD OKO:",
      error
    );

  }

);


// ============================================================
// EYE TRACKING
// ============================================================

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;


// Same behaviour as your original 2D version
let idle = true;

let idleTimer;


// ------------------------------------------------------------
// RESET IDLE
// ------------------------------------------------------------

function resetIdle() {

  clearTimeout(idleTimer);

  idle = false;

  idleTimer = setTimeout(function() {

    idle = true;

    chooseIdleTarget();

  }, 2500);

}


// ------------------------------------------------------------
// IDLE EYE TARGET
// ------------------------------------------------------------

function chooseIdleTarget() {

  if (!idle) return;


  targetX =
    THREE.MathUtils.randFloat(
      -6,
      6
    );

  targetY =
    THREE.MathUtils.randFloat(
      -4,
      4
    );


  setTimeout(function() {

    if (idle) {

      chooseIdleTarget();

    }

  },
  THREE.MathUtils.randFloat(
    1000,
    2500
  ));

}


// ------------------------------------------------------------
// MOUSE
// ------------------------------------------------------------

document.addEventListener(
  "mousemove",
  function(e) {

    resetIdle();


    targetX =
      (e.clientX - window.innerWidth / 2)
      * 0.009;


    targetY =
      (e.clientY - window.innerHeight / 2)
      * 0.009;

  }
);


// ============================================================
// BODY FOLLOW
// ============================================================

let bodyFollowX = 0;
let bodyFollowY = 0;


// ============================================================
// ANIMATION
// ============================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  const time =
    performance.now() * 0.001;


  // ----------------------------------------------------------
  // EYE SMOOTHING
  // ----------------------------------------------------------

  currentX +=
    (targetX - currentX)
    * 0.08;


  currentY +=
    (targetY - currentY)
    * 0.08;


  // ----------------------------------------------------------
  // EYEBALL MOVEMENT
  // ----------------------------------------------------------

  if (eyeball) {

    // IMPORTANT:
    // These are the axes that worked correctly
    // with your model.

    eyeball.position.x =
      eyeballBasePosition.x
      + currentX;


    eyeball.position.y =
      eyeballBasePosition.y
      - currentY;


    eyeball.position.z =
      eyeballBasePosition.z;

  }


  // ----------------------------------------------------------
  // BODY FOLLOW
  // ----------------------------------------------------------

  if (oko) {

    bodyFollowX +=
      (
        currentX * 0.035
        - bodyFollowX
      )
      * 0.025;


    bodyFollowY +=
      (
        currentY * 0.025
        - bodyFollowY
      )
      * 0.025;


    // Tiny lean
    const lean =
      bodyFollowX * 0.08;


    // --------------------------------------------------------
    // BREATHING
    // --------------------------------------------------------

    const breathing =
      Math.sin(time * 1.5)
      * 0.012;


    // --------------------------------------------------------
    // TINY IDLE SWAY
    // --------------------------------------------------------

    const sway =
      Math.sin(time * 0.7)
      * 0.015;


    oko.rotation.z =
      lean + sway;


    oko.rotation.x =
      -bodyFollowY * 0.025;


    // Subtle squash / stretch
    oko.scale.y =
      1 + breathing;


    oko.scale.x =
      1 - breathing * 0.35;


    oko.scale.z =
      1 - breathing * 0.35;

  }


  // ==========================================================
  // EAR ANIMATION
  // ==========================================================

  if (earLeft) {

    const base =
      baseRotations.get(
        earLeft
      );


    if (base) {

      earLeft.rotation.x =
        base.x
        + Math.sin(
          time * 1.15
        ) * 0.025;


      earLeft.rotation.z =
        base.z
        + Math.sin(
          time * 0.75
        ) * 0.018;

    }

  }


  if (earRight) {

    const base =
      baseRotations.get(
        earRight
      );


    if (base) {

      earRight.rotation.x =
        base.x
        + Math.sin(
          time * 1.05
          + 1.2
        ) * 0.025;


      earRight.rotation.z =
        base.z
        + Math.sin(
          time * 0.7
          + 1
        ) * 0.018;

    }

  }


  // ==========================================================
  // ARM ANIMATION
  // ==========================================================

  if (armLeft) {

    const base =
      baseRotations.get(
        armLeft
      );


    if (base) {

      armLeft.rotation.z =
        base.z
        + Math.sin(
          time * 0.8
        ) * 0.025;

      armLeft.rotation.x =
        base.x
        + Math.sin(
          time * 0.65
          + 1
        ) * 0.012;

    }

  }


  if (armRight) {

    const base =
      baseRotations.get(
        armRight
      );


    if (base) {

      armRight.rotation.z =
        base.z
        - Math.sin(
          time * 0.8
        ) * 0.025;

      armRight.rotation.x =
        base.x
        - Math.sin(
          time * 0.65
          + 1
        ) * 0.012;

    }

  }


  // ==========================================================
  // FEET / LEGS
  // ==========================================================

  if (footLeft) {

    const base =
      baseRotations.get(
        footLeft
      );


    if (base) {

      footLeft.rotation.z =
        base.z
        + Math.sin(
          time * 0.75
        ) * 0.018;

      footLeft.rotation.x =
        base.x
        + Math.sin(
          time * 0.6
        ) * 0.012;

    }

  }


  if (footRight) {

    const base =
      baseRotations.get(
        footRight
      );


    if (base) {

      footRight.rotation.z =
        base.z
        - Math.sin(
          time * 0.75
        ) * 0.018;

      footRight.rotation.x =
        base.x
        - Math.sin(
          time * 0.6
        ) * 0.012;

    }

  }


  // ==========================================================
  // RENDER
  // ==========================================================

  renderer.render(
    scene,
    camera
  );

}


// ============================================================
// RESIZE
// ============================================================

function resize() {

  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if (
    width === 0 ||
    height === 0
  ) {
    return;
  }


  camera.aspect =
    width / height;


  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height
  );

}


window.addEventListener(
  "resize",
  resize
);


// ============================================================
// START
// ============================================================

animate();

chooseIdleTarget();

resize();

</script>

</body>
</html>
