<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>

    html,
    body {

      margin: 0;
      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    /* FULL PAGE SCENE */

    .scene {

      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    /* THREE.JS CANVAS */

    canvas {

      display: block;

      width: 100%;
      height: 100%;

      background: transparent;

    }

  </style>

</head>


<body>


  <div
    class="scene"
    id="scene"
  ></div>


  <script type="module">


    /* ------------------------- */
    /* IMPORT THREE.JS           */
    /* ------------------------- */


    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js";


    import { GLTFLoader } from
      "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/loaders/GLTFLoader.js";


    /* ------------------------- */
    /* SCENE                     */
    /* ------------------------- */


    const scene =
      document.getElementById("scene");


    const threeScene =
      new THREE.Scene();


    /* ------------------------- */
    /* CAMERA                    */
    /* ------------------------- */


    const camera =
      new THREE.PerspectiveCamera(

        35,

        window.innerWidth /
        window.innerHeight,

        0.01,

        100

      );


    camera.position.set(
      0,
      0,
      6
    );


    /* ------------------------- */
    /* RENDERER                  */
    /* ------------------------- */


    const renderer =
      new THREE.WebGLRenderer({

        alpha: true,
        antialias: true

      });


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    renderer.setClearColor(
      0x000000,
      0
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.1;


    scene.appendChild(
      renderer.domElement
    );


    /* ------------------------- */
    /* LIGHTING                  */
    /* ------------------------- */


    /*
      MAIN SOFT LIGHT

      Large and frontal,
      similar to the Blender
      setup we were discussing.
    */


    const keyLight =
      new THREE.DirectionalLight(
        0xffffff,
        2.5
      );


    keyLight.position.set(
      -3,
      4,
      5
    );


    threeScene.add(
      keyLight
    );


    /*
      SECONDARY LIGHT

      Softens the completely
      black side of the model
      without removing the
      dark eye cavity.
    */


    const fillLight =
      new THREE.DirectionalLight(
        0xffffff,
        0.8
      );


    fillLight.position.set(
      3,
      1,
      3
    );


    threeScene.add(
      fillLight
    );


    /*
      SUBTLE TOP LIGHT
    */


    const topLight =
      new THREE.DirectionalLight(
        0xffffff,
        0.7
      );


    topLight.position.set(
      0,
      5,
      2
    );


    threeScene.add(
      topLight
    );


    /* ------------------------- */
    /* MODEL                     */
    /* ------------------------- */


    const loader =
      new GLTFLoader();


    let oko;


    loader.load(

      "OKO.glb",


      function (gltf) {


        oko =
          gltf.scene;


        /*
          CENTER MODEL

          We can adjust these
          once we see how the
          exported GLB is positioned.
        */


        oko.position.set(
          0,
          0,
          0
        );


        /*
          INITIAL SCALE

          Change this if Oko
          appears too large
          or too small.
        */


        oko.scale.setScalar(
          1
        );


        /*
          ENABLE SHADOW SETTINGS
          ON ALL MESHES
        */


        oko.traverse(
          (object) => {

            if (
              object.isMesh
            ) {

              object.castShadow =
                true;


              object.receiveShadow =
                true;

            }

          }
        );


        threeScene.add(
          oko
        );


        /*
          LOG THE ENTIRE MODEL
          AND BONE STRUCTURE.

          This will help us
          identify the exact
          exported bone names
          for animation later.
        */


        console.log(
          "OKO MODEL:",
          oko
        );


        oko.traverse(
          (object) => {

            if (
              object.isBone
            ) {

              console.log(
                "BONE:",
                object.name
              );

            }

          }
        );

      },


      undefined,


      function (error) {

        console.error(
          "ERROR LOADING OKO:",
          error
        );

      }

    );


    /* ------------------------- */
    /* RESIZE                    */
    /* ------------------------- */


    function resize() {


      const width =
        scene.clientWidth;


      const height =
        scene.clientHeight;


      camera.aspect =
        width /
        height;


      camera.updateProjectionMatrix();


      renderer.setSize(
        width,
        height
      );

    }


    window.addEventListener(
      "resize",
      resize
    );


    resize();


    /* ------------------------- */
    /* ANIMATION LOOP            */
    /* ------------------------- */


    function animate() {


      requestAnimationFrame(
        animate
      );


      renderer.render(
        threeScene,
        camera
      );

    }


    animate();


  </script>


</body>

</html>
