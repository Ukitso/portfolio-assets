<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oko Test</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1B1C1C;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
  "three/addons/loaders/GLTFLoader.js";


// ==================================================
// SCENE
// ==================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x1B1C1C);


// ==================================================
// CAMERA
// ==================================================

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);


// ==================================================
// RENDERER
// ==================================================

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);


// ==================================================
// LIGHTING
// ==================================================

const ambientLight = new THREE.AmbientLight(
  0xffffff,
  2
);

scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

directionalLight.position.set(
  3,
  5,
  5
);

scene.add(directionalLight);


// ==================================================
// OKO
// ==================================================

let oko = null;

let eyeball = null;
let head = null;
let body = null;


// ==================================================
// ORIGINAL BONE ROTATIONS
// ==================================================
//
// We keep the rotations Oko has in Blender.
// Our animation is added on top of these.
//

const eyeBaseRotation =
  new THREE.Euler();

const headBaseRotation =
  new THREE.Euler();

const bodyBaseRotation =
  new THREE.Euler();


// ==================================================
// MOUSE
// ==================================================

let mouseX = 0;
let mouseY = 0;

window.addEventListener(
  "mousemove",
  (event) => {

    mouseX =
      (event.clientX / window.innerWidth) * 2 - 1;

    mouseY =
      (event.clientY / window.innerHeight) * 2 - 1;

  }
);


// ==================================================
// LOAD OKO
// ==================================================

const loader = new GLTFLoader();

loader.load(

  "./OKO.glb",

  (gltf) => {

    oko = gltf.scene;

    scene.add(oko);


    console.log("================================");
    console.log("OKO LOADED");
    console.log("================================");


    // ==================================================
    // FIND BONES
    // ==================================================

    console.log("------ BONES ------");

    oko.traverse((object) => {

      if (object.isBone) {

        console.log(
          "BONE:",
          object.name
        );

      }

    });

    console.log("-------------------");


    // ==================================================
    // GET BONES
    // ==================================================

    eyeball =
      oko.getObjectByName("Eyeball");

    head =
      oko.getObjectByName("HEAD");

    body =
      oko.getObjectByName("BODY_1");


    console.log("Eyeball:", eyeball);
    console.log("Head:", head);
    console.log("Body:", body);


    // ==================================================
    // STORE ORIGINAL ROTATIONS
    // ==================================================

    eyeBaseRotation.copy(
      eyeball.rotation
    );

    headBaseRotation.copy(
      head.rotation
    );

    bodyBaseRotation.copy(
      body.rotation
    );


    // ==================================================
    // MODEL BOUNDS
    // ==================================================

    const box =
      new THREE.Box3().setFromObject(oko);

    const center =
      box.getCenter(
        new THREE.Vector3()
      );

    const size =
      box.getSize(
        new THREE.Vector3()
      );


    console.log("Oko size:", size);
    console.log("Oko center:", center);


    // ==================================================
    // CENTRE OKO
    // ==================================================

    oko.position.sub(center);


    // ==================================================
    // CAMERA
    // ==================================================

    const maxDimension =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    const fitHeightDistance =
      maxDimension /
      (
        2 *
        Math.tan(
          THREE.MathUtils.degToRad(
            camera.fov / 2
          )
        )
      );


    const cameraDistance =
      fitHeightDistance * 1.5;


    camera.position.set(
      0,
      0,
      cameraDistance
    );

    camera.lookAt(
      0,
      0,
      0
    );


    console.log(
      "Camera distance:",
      cameraDistance
    );


    console.log("================================");

  },


  // ==================================================
  // LOADING
  // ==================================================

  (progress) => {

    if (progress.total) {

      const percent =
        (
          progress.loaded /
          progress.total
        ) * 100;

      console.log(
        "Loading Oko:",
        percent.toFixed(0) + "%"
      );

    }

  },


  // ==================================================
  // ERROR
  // ==================================================

  (error) => {

    console.error(
      "COULD NOT LOAD OKO:",
      error
    );

  }

);


// ==================================================
// ANIMATION
// ==================================================

function animate() {

  requestAnimationFrame(animate);


  if (eyeball && head && body) {


    // ==================================================
    // 1. EYEBALL TRACKING
    // ==================================================
    //
    // The eyeball is the ONLY thing directly
    // responding to the mouse.
    //
    // These axes are inverted from the previous version.
    //

    const eyeTargetY =
      -mouseX * 0.45;

    const eyeTargetX =
      mouseY * 0.30;


    // Smooth eye movement

    const eyeSpeed = 0.12;


    eyeball.rotation.y +=
      (
        eyeTargetY -
        eyeball.rotation.y +
        eyeBaseRotation.y
      ) * eyeSpeed;


    eyeball.rotation.x +=
      (
        eyeTargetX -
        eyeball.rotation.x +
        eyeBaseRotation.x
      ) * eyeSpeed;


    // ==================================================
    // 2. WORK OUT HOW FAR THE EYE HAS MOVED
    // ==================================================
    //
    // We use the eyeball's actual offset from its
    // Blender rest position.
    //
    // The head therefore reacts to the eye rather
    // than directly reacting to the mouse.
    //

    const eyeOffsetY =
      eyeball.rotation.y -
      eyeBaseRotation.y;

    const eyeOffsetX =
      eyeball.rotation.x -
      eyeBaseRotation.x;


    // ==================================================
    // 3. HEAD FOLLOWS EYEBALL
    // ==================================================
    //
    // Much smaller movement than the eye.
    //
    // It also has a slower response, giving it
    // a slight "weight" behind the eye.
    //

    const headTargetY =
      eyeOffsetY * 0.25;

    const headTargetX =
      eyeOffsetX * 0.20;

    const headTargetZ =
      eyeOffsetY * -0.12;


    const headSpeed = 0.055;


    head.rotation.y +=
      (
        headTargetY -
        (
          head.rotation.y -
          headBaseRotation.y
        )
      ) * headSpeed;


    head.rotation.x +=
      (
        headTargetX -
        (
          head.rotation.x -
          headBaseRotation.x
        )
      ) * headSpeed;


    head.rotation.z +=
      (
        headTargetZ -
        (
          head.rotation.z -
          headBaseRotation.z
        )
      ) * headSpeed;


    // ==================================================
    // 4. BODY FOLLOWS HEAD
    // ==================================================
    //
    // Even more subtle.
    //
    // This creates the layered feeling:
    //
    //     mouse
    //       ↓
    //     eyeball
    //       ↓
    //      head
    //       ↓
    //      body
    //

    const currentHeadOffsetY =
      head.rotation.y -
      headBaseRotation.y;

    const currentHeadOffsetX =
      head.rotation.x -
      headBaseRotation.x;

    const currentHeadOffsetZ =
      head.rotation.z -
      headBaseRotation.z;


    const bodyTargetY =
      currentHeadOffsetY * 0.22;

    const bodyTargetX =
      currentHeadOffsetX * 0.15;

    const bodyTargetZ =
      currentHeadOffsetZ * 0.30;


    const bodySpeed = 0.025;


    body.rotation.y +=
      (
        bodyTargetY -
        (
          body.rotation.y -
          bodyBaseRotation.y
        )
      ) * bodySpeed;


    body.rotation.x +=
      (
        bodyTargetX -
        (
          body.rotation.x -
          bodyBaseRotation.x
        )
      ) * bodySpeed;


    body.rotation.z +=
      (
        bodyTargetZ -
        (
          body.rotation.z -
          bodyBaseRotation.z
        )
      ) * bodySpeed;

  }


  // ==================================================
  // RENDER
  // ==================================================

  renderer.render(
    scene,
    camera
  );

}

animate();


// ==================================================
// RESIZE
// ==================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
